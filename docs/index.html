﻿/* ════════════════════════════════════════════════════════
   EOS v7 — Watchtower
   Clinical-instrument redesign · KCMH NICU
   ════════════════════════════════════════════════════════ */

/* ──────────────  THEME TOKENS  ────────────── */
[data-theme="ot"], :root {
  /* Operating Theatre (default) — calm slate-navy */
  --bg:        #0a0f14;
  --bg-2:      #0e151c;
  --surface:   #131c25;
  --surface-2: #182231;
  --surface-3: #1f2c3d;
  --surface-4: #283a51;

  --line:      #233244;
  --line-2:    #314660;
  --line-3:    #486684;

  --ink:       #e6edf5;
  --ink-2:     #a6b6c8;
  --ink-3:     #6c7e93;
  --ink-4:     #4a5b71;

  /* Single calm accent — mint/cyan */
  --m:         #5fd1c2;    /* mint */
  --m-2:       #47a899;
  --m-deep:    #16332f;
  --m-tint:    #1a2e2d;

  /* Alerts — saturated, calibrated for dark bg */
  --r:         #ff6b6b;    /* red */
  --r-2:       #d44e4e;
  --r-tint:    #2e1820;
  --r-glow:    rgba(255,107,107,.22);

  --a:         #f5b94a;    /* amber */
  --a-2:       #c9913a;
  --a-tint:    #2a2114;

  --g:         #7be09b;    /* green */
  --g-2:       #5cb37a;
  --g-tint:    #15291e;

  --v:         #a78bfa;    /* violet — info */
  --v-tint:    #20203a;

  /* Type */
  --f-sans: 'Sarabun', 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;

  /* Shadow / glow */
  --sh-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
  --sh-2: 0 10px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --sh-pop: 0 24px 56px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.4);

  --rad-1: 6px;
  --rad-2: 10px;
  --rad-3: 14px;
  --rad-4: 20px;
}

[data-theme="dawn"] {
  --bg:        #f1efe9;
  --bg-2:      #e9e6dd;
  --surface:   #fbfaf6;
  --surface-2: #f4f2eb;
  --surface-3: #ebe8de;
  --surface-4: #ddd9cc;

  --line:      #d4cfbf;
  --line-2:    #b9b2a0;
  --line-3:    #978f7c;

  --ink:       #1c2128;
  --ink-2:     #404a55;
  --ink-3:     #6f7984;
  --ink-4:     #98a1ac;

  --m:         #1a8276;
  --m-2:       #145d54;
  --m-deep:    #b6dbd3;
  --m-tint:    #d6ebe6;

  --r:         #c8392e;
  --r-2:       #9c2a22;
  --r-tint:    #f3ddd9;
  --r-glow:    rgba(200,57,46,.22);

  --a:         #b87a16;
  --a-2:       #8c5910;
  --a-tint:    #f1e3c3;

  --g:         #2f7f4d;
  --g-2:       #205d38;
  --g-tint:    #d6e8d9;

  --v:         #6a4ec9;
  --v-tint:    #e2dbf4;
}

/* ──────────────  RESET / BASE  ────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  font-family: var(--f-sans);
  font-size: 14px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -.005em;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--surface-4); }

.mono, .n { font-family: var(--f-mono); font-feature-settings: "tnum","cv11","ss03"; letter-spacing: -.01em; }
.muted { color: var(--ink-3); }
.dim { color: var(--ink-4); }

/* Common ico bg helper */
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  font: 11px/1 var(--f-mono); color: var(--ink-2);
  background: var(--surface-3); border: 1px solid var(--line-2);
  border-radius: 4px;
}

/* ──────────────  APP SHELL  ────────────── */
.shell {
  display: grid;
  grid-template-columns: 64px 1fr;
  grid-template-rows: 100vh;
  height: 100vh;
}

/* SIDEBAR */
.side {
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  align-items: stretch;
  padding: 12px 0;
  gap: 4px;
}
.side-mark {
  width: 40px; height: 40px;
  margin: 0 auto 12px;
  background: linear-gradient(135deg, var(--m), var(--m-2));
  border-radius: 12px;
  display: grid; place-items: center;
  color: #061814;
  box-shadow: 0 6px 20px rgba(95,209,194,.25);
}
.side-divider { height: 1px; background: var(--line); margin: 6px 12px; }
.side-btn {
  width: 44px; height: 44px;
  margin: 0 auto;
  display: grid; place-items: center;
  color: var(--ink-3);
  border-radius: 10px;
  position: relative;
  transition: color .15s, background .15s;
}
.side-btn:hover { color: var(--ink); background: var(--surface-2); }
.side-btn.active { color: var(--m); background: var(--m-tint); }
.side-btn.active::before {
  content: ''; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px;
  background: var(--m); border-radius: 0 3px 3px 0;
}
.side-badge {
  position: absolute; top: 4px; right: 4px;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--r); color: #1a0a0a;
  border: 2px solid var(--bg-2);
  border-radius: 8px;
  font: 700 9px/12px var(--f-mono);
  display: grid; place-items: center;
}
.side-badge.warn { background: var(--a); color: #1f1408; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.side-avatar {
  width: 36px; height: 36px;
  margin: 0 auto;
  background: linear-gradient(135deg, var(--m), var(--m-2));
  color: #061814;
  border-radius: 10px;
  display: grid; place-items: center;
  font: 700 13px var(--f-sans);
}

/* MAIN COL */
.main {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--bg);
}

/* Top status bar */
.topbar {
  height: 52px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 22px;
  gap: 16px;
  background: var(--bg);
  flex-shrink: 0;
}
.tb-h1 {
  font-size: 14px; font-weight: 600;
  letter-spacing: -.005em;
  color: var(--ink);
}
.tb-sub { font-size: 12px; color: var(--ink-3); }
.tb-divider { width: 1px; height: 22px; background: var(--line); }
.tb-clock {
  display: inline-flex; gap: 6px; align-items: center;
  font: 12px/1 var(--f-mono); color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 6px;
}
.tb-clock .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--g); box-shadow: 0 0 6px var(--g);
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.9); }
}
.tb-cmd {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-3);
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.tb-cmd:hover { border-color: var(--line-3); color: var(--ink-2); }
.tb-spacer { flex: 1; }

.ico-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 8px;
  color: var(--ink-3);
  border: 1px solid transparent;
  background: transparent;
  transition: all .15s;
}
.ico-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }

/* Content scroll area */
.content {
  flex: 1; min-height: 0; overflow: auto;
  display: flex; flex-direction: column;
}

/* ──────────────  PAGE LAYOUT  ────────────── */
.page-pad { padding: 18px 22px 80px; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; margin-bottom: 16px;
}
.page-head h1 {
  margin: 0;
  font: 700 26px/1.15 var(--f-sans);
  letter-spacing: -.025em;
}
.page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.page-head .right { display: flex; gap: 8px; }

.section-lbl {
  font: 600 10.5px/1 var(--f-sans);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 22px 0 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-lbl .ln { flex: 1; height: 1px; background: var(--line); }

/* ──────────────  CARDS  ────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 16px;
}
.card.flat { box-shadow: none; }
.card.glow {
  border-color: var(--m);
  box-shadow: 0 0 0 1px var(--m-deep), 0 0 30px rgba(95,209,194,.1);
}

/* ──────────────  BUTTONS  ────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 8px;
  font: 600 13.5px/1 var(--f-sans);
  letter-spacing: -.005em;
  border: 1px solid transparent;
  transition: all .12s;
  white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-pri {
  background: var(--m);
  color: #061814;
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 6px 14px rgba(95,209,194,.15);
}
.btn-pri:hover:not(:disabled) { background: var(--m-2); transform: translateY(-1px); }

.btn-ghost {
  color: var(--ink-2);
  border-color: var(--line);
  background: transparent;
}
.btn-ghost:hover { border-color: var(--line-3); color: var(--ink); background: var(--surface-2); }

.btn-soft {
  color: var(--ink);
  background: var(--surface-2);
  border-color: var(--line);
}
.btn-soft:hover { background: var(--surface-3); border-color: var(--line-2); }

.btn-danger {
  background: var(--r);
  color: #1a0606;
}
.btn-danger:hover { background: var(--r-2); }

.btn-warn {
  background: var(--a);
  color: #1a1408;
}

.btn-success {
  background: var(--g);
  color: #06190d;
}

.btn-xl { padding: 14px 22px; font-size: 15px; }
.btn-lg { padding: 11px 18px; font-size: 14px; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }

/* ──────────────  NOW BAR  ────────────── */
.nowbar {
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 18px;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}
.nowbar::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--r);
  box-shadow: 0 0 12px var(--r-glow);
}
.nowbar.ok::before { background: var(--g); box-shadow: 0 0 8px rgba(123,224,155,.2); }
.nowbar.warn::before { background: var(--a); }

.nowbar-pill {
  font: 600 10px/1 var(--f-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 8px;
  border-radius: 5px;
  background: var(--r-tint);
  color: var(--r);
  flex-shrink: 0;
}
.nowbar.ok .nowbar-pill { background: var(--g-tint); color: var(--g); }
.nowbar.warn .nowbar-pill { background: var(--a-tint); color: var(--a); }

.nowbar-title { font: 600 16px var(--f-sans); letter-spacing: -.01em; }
.nowbar-desc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.nowbar-spacer { flex: 1; }
.nowbar-actions { display: flex; gap: 6px; }

/* ──────────────  STATS RIBBON  ────────────── */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-2);
  padding: 12px 14px;
  position: relative;
}
.kpi .lbl {
  font: 500 11px/1 var(--f-sans);
  letter-spacing: .04em;
  color: var(--ink-3);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.kpi .val {
  font: 800 30px/1 var(--f-sans);
  letter-spacing: -.03em;
  margin-top: 8px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.kpi .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.kpi.crit .val { color: var(--r); }
.kpi.warn .val { color: var(--a); }
.kpi.ok .val   { color: var(--g); }
.kpi.info .val { color: var(--m); }
.kpi-spark { position: absolute; bottom: 8px; right: 10px; width: 56px; height: 18px; opacity: .9; }

/* ──────────────  FLOOR TABS  ────────────── */
.floor-tabs {
  display: flex; gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 14px;
  width: fit-content;
}
.f-tab {
  padding: 7px 14px;
  border-radius: 7px;
  font: 600 12.5px var(--f-sans);
  color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 8px;
}
.f-tab:hover { color: var(--ink); }
.f-tab.active { background: var(--surface-3); color: var(--ink); }
.f-tab .ct {
  font-family: var(--f-mono);
  font-size: 11px;
  padding: 1px 6px;
  background: var(--surface-3);
  color: var(--ink-2);
  border-radius: 4px;
}
.f-tab.active .ct { background: var(--surface-4); }
.f-tab .alert-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--r); box-shadow: 0 0 6px var(--r);
}

/* ──────────────  BED ROW (the big one)  ────────────── */
.bed-table {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  overflow: hidden;
}
.bed-row {
  display: grid;
  grid-template-columns: 56px 1.4fr 84px 1fr 1fr 110px 90px;
  gap: 14px;
  padding: 14px 18px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  transition: background .12s;
  cursor: pointer;
  position: relative;
}
.bed-row:last-child { border-bottom: none; }
.bed-row:hover { background: var(--surface-2); }
.bed-row.crit { background: linear-gradient(90deg, rgba(255,107,107,.05) 0%, transparent 60%); }
.bed-row.crit::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--r); border-radius: 0 3px 3px 0;
  box-shadow: 0 0 8px var(--r-glow);
}
.bed-row.warn::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--a); border-radius: 0 3px 3px 0;
}
.bed-row.done::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  background: var(--g); border-radius: 0 3px 3px 0;
}

.bed-avatar {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--m), var(--m-2));
  color: #061814;
  display: grid; place-items: center;
  font: 700 17px var(--f-sans);
  letter-spacing: -.02em;
}
.bed-row.crit .bed-avatar { background: linear-gradient(135deg, var(--r), var(--r-2)); color: #1a0606; }
.bed-row.warn .bed-avatar { background: linear-gradient(135deg, var(--a), var(--a-2)); color: #1a1408; }

.bed-id-col { display: flex; flex-direction: column; gap: 3px; }
.bed-id-col .name { font: 700 15px var(--f-sans); letter-spacing: -.005em; }
.bed-id-col .meta { font: 11px var(--f-mono); color: var(--ink-3); display: flex; gap: 8px; }
.bed-id-col .meta .pill {
  background: var(--surface-3);
  color: var(--ink-2);
  padding: 1px 6px; border-radius: 4px;
  font-size: 10.5px;
}

.bed-age {
  text-align: center;
}
.bed-age .n {
  font: 800 22px/1 var(--f-sans);
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.bed-age .u { font-size: 11px; color: var(--ink-3); margin-top: 3px; font-family: var(--f-mono); }

/* Timeline strip */
.tl-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  align-items: center;
}
.tl-strip .tl-cell {
  height: 18px;
  border-radius: 4px;
  background: var(--surface-3);
  position: relative;
  display: grid; place-items: center;
  font: 9px/1 var(--f-mono);
  color: var(--ink-4);
}
.tl-strip .tl-cell.done { background: var(--g-tint); color: var(--g); }
.tl-strip .tl-cell.crit { background: var(--r-tint); color: var(--r); animation: tl-pulse 1.8s infinite; }
.tl-strip .tl-cell.warn { background: var(--a-tint); color: var(--a); }
.tl-strip .tl-cell.due { background: var(--a-tint); color: var(--a); border: 1px dashed var(--a); }
.tl-strip .tl-cell.now { border: 1px solid var(--m); background: var(--m-tint); color: var(--m); }
@keyframes tl-pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--r-glow); }
  50%  { box-shadow: 0 0 0 4px transparent; }
}

/* Vitals chips with sparkline */
.v-chips { display: flex; gap: 6px; }
.v-chip {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 7px;
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
  min-width: 0;
}
.v-chip.flag {
  background: var(--r-tint);
  border-color: var(--r-2);
  color: var(--r);
}
.v-chip .k { font: 600 9.5px/1 var(--f-mono); color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
.v-chip.flag .k { color: var(--r); opacity: .9; }
.v-chip .vv { font: 700 14px/1 var(--f-sans); margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.v-chip .sp {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 14px;
  opacity: .6;
}

.bed-status {
  text-align: right;
  font: 12px var(--f-sans);
  display: flex; flex-direction: column; gap: 3px;
  align-items: flex-end;
}
.bed-status .badge-status {
  display: inline-flex; align-items: center; gap: 5px;
  font: 600 10.5px/1 var(--f-mono);
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 5px;
  background: var(--surface-3);
  color: var(--ink-2);
}
.bed-status .badge-status.crit { background: var(--r-tint); color: var(--r); }
.bed-status .badge-status.warn { background: var(--a-tint); color: var(--a); }
.bed-status .badge-status.ok { background: var(--g-tint); color: var(--g); }
.bed-status .badge-status.info { background: var(--m-tint); color: var(--m); }
.bed-status .next { font: 11px var(--f-mono); color: var(--ink-3); }

.bed-action {
  text-align: right;
}

/* ──────────────  COCKPIT (Patient detail) ────────────── */
.cockpit {
  display: grid;
  grid-template-columns: 360px 1fr 320px;
  gap: 18px;
  align-items: start;
}
@media (max-width: 1200px) {
  .cockpit { grid-template-columns: 1fr; }
}

.cp-id {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 20px;
}
.cp-id .id-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.cp-id .avatar {
  width: 64px; height: 64px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--m), var(--m-2));
  color: #061814;
  display: grid; place-items: center;
  font: 700 26px var(--f-sans);
  letter-spacing: -.04em;
  box-shadow: 0 8px 24px rgba(95,209,194,.18);
}
.cp-id .who h1 { margin: 0; font: 800 26px/1.05 var(--f-sans); letter-spacing: -.025em; }
.cp-id .who .hn { font: 11.5px var(--f-mono); color: var(--ink-3); margin-top: 4px; }
.cp-id .pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.cp-pill {
  font: 600 10.5px/1 var(--f-mono); letter-spacing: .04em;
  padding: 5px 8px; border-radius: 5px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
}
.cp-pill.crit { background: var(--r-tint); color: var(--r); border-color: var(--r-2); }
.cp-pill.warn { background: var(--a-tint); color: var(--a); border-color: var(--a-2); }
.cp-pill.ok { background: var(--g-tint); color: var(--g); border-color: var(--g-2); }
.cp-pill.info { background: var(--m-tint); color: var(--m); border-color: var(--m-2); }

.cp-stats {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 16px;
  font-size: 13px; margin-top: 6px;
}
.cp-stats .l { color: var(--ink-3); font-size: 12px; }
.cp-stats .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.cp-stats .v.flag { color: var(--r); }

/* DIAL — Big radial clock for patient detail */
.dial-wrap {
  background: radial-gradient(circle at 50% 40%, var(--surface-2) 0%, var(--surface) 70%);
  border: 1px solid var(--line);
  border-radius: var(--rad-4);
  padding: 24px;
  display: flex; flex-direction: column; align-items: center;
}
.dial-relative { position: relative; }
.dial-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
  text-align: center;
}
.dial-age { font: 800 60px/1 var(--f-sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.dial-unit { font: 12px var(--f-mono); color: var(--ink-3); margin-top: 4px; letter-spacing: .14em; text-transform: uppercase; }
.dial-next {
  margin-top: 10px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--m-tint);
  color: var(--m);
  font: 600 11.5px/1 var(--f-mono);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.dial-next.crit { background: var(--r-tint); color: var(--r); }
.dial-next.warn { background: var(--a-tint); color: var(--a); }

/* INSTRUMENT VITAL CARDS */
.gauges {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin-top: 14px;
}
.gauge {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-2);
  padding: 14px 16px;
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
}
.gauge.flag {
  border-color: var(--r-2);
  background: linear-gradient(180deg, var(--r-tint) 0%, var(--surface) 60%);
}
.gauge-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.gauge-name { font: 600 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.gauge.flag .gauge-name { color: var(--r); }
.gauge-thai { font: 11px var(--f-sans); color: var(--ink-4); margin-left: auto; }

.gauge-val {
  font: 800 36px/1 var(--f-sans);
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.gauge.flag .gauge-val { color: var(--r); }
.gauge-unit { font: 12px var(--f-mono); color: var(--ink-3); margin-left: 5px; }
.gauge-range { font: 11px var(--f-mono); color: var(--ink-4); margin-top: 4px; letter-spacing: .03em; }

.gauge-bar {
  margin-top: 10px;
  height: 6px;
  border-radius: 3px;
  background: var(--surface-3);
  position: relative;
  overflow: hidden;
}
.gauge-bar .safe {
  position: absolute; top: 0; bottom: 0;
  background: var(--g-tint);
  border-left: 1px dashed var(--g);
  border-right: 1px dashed var(--g);
}
.gauge-bar .ptr {
  position: absolute; top: -3px; bottom: -3px; width: 3px;
  background: var(--ink);
  border-radius: 2px;
  transform: translateX(-50%);
}
.gauge.flag .gauge-bar .ptr { background: var(--r); box-shadow: 0 0 8px var(--r-glow); }

.gauge-spark {
  margin-top: 10px;
  height: 28px;
}

/* WATCH SIDEBAR */
.watch {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 14px;
  position: sticky;
  top: 0;
}
.watch h3 {
  margin: 0 0 12px;
  font: 600 11px/1 var(--f-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex; align-items: center; gap: 8px;
}
.watch-baby {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}
.watch-baby:hover { background: var(--surface-2); }
.watch-baby.active { background: var(--surface-3); }
.watch-baby.active::before {
  content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  background: var(--m); border-radius: 0 3px 3px 0;
}
.watch-init {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface-3); color: var(--ink-2);
  display: grid; place-items: center;
  font: 700 12px var(--f-sans);
  letter-spacing: -.02em;
}
.watch-baby.crit .watch-init { background: var(--r); color: #1a0606; }
.watch-baby.warn .watch-init { background: var(--a); color: #1a1408; }
.watch-baby.ok   .watch-init { background: var(--g); color: #06190d; }
.watch-baby .meta { font-size: 12px; color: var(--ink-2); flex: 1; min-width: 0; }
.watch-baby .meta .b { font-weight: 600; color: var(--ink); }
.watch-baby .meta .l { font: 10.5px var(--f-mono); color: var(--ink-3); margin-top: 1px; }
.watch-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); }
.watch-baby.crit .watch-dot { background: var(--r); box-shadow: 0 0 6px var(--r); }
.watch-baby.warn .watch-dot { background: var(--a); }
.watch-baby.ok   .watch-dot { background: var(--g); }

/* TIMELINE on patient detail */
.timeline {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 4px 0;
}
.tl-event {
  display: grid;
  grid-template-columns: 70px 22px 1fr;
  gap: 12px;
  padding: 14px 20px;
  position: relative;
}
.tl-event + .tl-event { border-top: 1px solid var(--line); }
.tl-event .when { font: 600 13px var(--f-mono); color: var(--ink-2); }
.tl-event .when-thai { font: 11px var(--f-sans); color: var(--ink-4); margin-top: 2px; }
.tl-event .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--surface-3);
  border: 2px solid var(--line-2);
  position: relative;
  z-index: 1;
  margin-top: 4px;
  justify-self: center;
}
.tl-event.done .dot { background: var(--g); border-color: var(--g); }
.tl-event.crit .dot { background: var(--r); border-color: var(--r); box-shadow: 0 0 0 4px var(--r-glow); }
.tl-event.due  .dot { background: transparent; border-color: var(--a); border-style: dashed; }
.tl-event.now .dot {
  background: var(--m); border-color: var(--m);
  box-shadow: 0 0 0 4px rgba(95,209,194,.2);
}
.tl-event::after {
  content: ''; position: absolute;
  left: 92px; top: 0; bottom: 0; width: 2px;
  background: var(--line);
  z-index: 0;
}
.tl-event:first-child::after { top: 14px; }
.tl-event:last-child::after  { bottom: 50%; }

.tl-body { min-width: 0; }
.tl-body .head { font: 600 13.5px var(--f-sans); margin-bottom: 2px; }
.tl-body .head.crit { color: var(--r); }
.tl-body .who { font: 11px var(--f-mono); color: var(--ink-3); }
.tl-body .vitals {
  display: flex; flex-wrap: wrap; gap: 6px 10px;
  margin-top: 8px;
}
.tl-v {
  display: inline-flex; gap: 4px;
  align-items: baseline;
  background: var(--surface-2);
  padding: 3px 8px; border-radius: 5px;
  font: 11.5px var(--f-mono);
}
.tl-v .k { color: var(--ink-3); }
.tl-v .v { color: var(--ink); font-weight: 600; }
.tl-v.flag { background: var(--r-tint); }
.tl-v.flag .v { color: var(--r); }
.tl-v.flag .k { color: var(--r); opacity: .8; }

/* ──────────────  ABX BANNER ────────────── */
.abx-banner {
  display: flex; gap: 14px; align-items: center;
  padding: 16px 20px;
  background: linear-gradient(135deg, var(--a-tint), var(--surface));
  border: 1px solid var(--a-2);
  border-radius: var(--rad-3);
  margin-bottom: 18px;
}
.abx-banner .ico {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--a);
  color: #1a1408;
  display: grid; place-items: center;
}
.abx-banner .body { flex: 1; }
.abx-banner .body .t { font: 700 15px var(--f-sans); }
.abx-banner .body .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

/* ──────────────  RISK PANEL ────────────── */
.risk-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 18px;
}
.risk-num {
  font: 800 56px/1 var(--f-sans);
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}
.risk-band {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 6px;
  font: 600 11px var(--f-mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 8px;
}

.bayes-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  font-size: 12.5px;
  border-bottom: 1px dashed var(--line);
}
.bayes-row:last-child { border-bottom: none; }
.bayes-row .k { color: var(--ink-2); }
.bayes-row .lr {
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.bayes-row .lr.up { background: var(--r-tint); color: var(--r); }
.bayes-row .lr.down { background: var(--g-tint); color: var(--g); }

/* ──────────────  COMMAND PALETTE ────────────── */
.cmd-overlay {
  position: fixed; inset: 0;
  background: rgba(5,10,15,.7);
  z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 12vh;
  backdrop-filter: blur(8px);
  animation: fade-in .15s;
}
.cmd-box {
  width: min(640px, 90vw);
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: var(--sh-pop);
  overflow: hidden;
}
.cmd-input-row {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.cmd-input-row input {
  flex: 1; background: none; border: none; outline: none;
  font: 16px var(--f-sans); color: var(--ink);
}
.cmd-input-row input::placeholder { color: var(--ink-4); }
.cmd-list { max-height: 50vh; overflow: auto; padding: 6px; }
.cmd-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
}
.cmd-item:hover, .cmd-item.sel { background: var(--surface-2); }
.cmd-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-item .hint { font: 11px var(--f-mono); color: var(--ink-3); }
.cmd-section {
  font: 600 10px var(--f-mono); letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 14px 6px;
}

/* ──────────────  MODAL ────────────── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(5,10,15,.7);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(6px);
  animation: fade-in .15s;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  box-shadow: var(--sh-pop);
  width: 100%; max-width: 600px;
  max-height: 90vh; overflow: auto;
  padding: 22px;
  animation: rise .2s;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.modal h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.015em; }
.modal .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 14px; }

/* ──────────────  CHIPS & FIELDS  ────────────── */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 7px 12px;
  border-radius: 7px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font: 500 12.5px var(--f-sans);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all .12s;
}
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.on { background: var(--surface-3); border-color: var(--m); color: var(--m); font-weight: 600; }
.chip.on.warn { border-color: var(--a); color: var(--a); }
.chip.on.danger { border-color: var(--r); color: var(--r); background: var(--r-tint); }
.chip.on.success { border-color: var(--g); color: var(--g); background: var(--g-tint); }
.chip.warn { color: var(--a); }
.chip.danger { color: var(--r); }
.chip.success { color: var(--g); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font: 600 11.5px var(--f-sans);
  letter-spacing: .03em;
  color: var(--ink-2);
}
.field input, .field textarea, .field select {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .12s;
}
.field input:focus { border-color: var(--m); }
.field .help { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.field .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ──────────────  PHONE  ────────────── */
.phone-host {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(circle at 30% 20%, rgba(95,209,194,.04), transparent 60%),
    radial-gradient(circle at 70% 80%, rgba(167,139,250,.03), transparent 60%),
    var(--bg);
}
.phone-frame {
  width: 380px;
  max-width: calc(100vw - 24px);
  height: 800px;
  max-height: calc(100vh - 24px);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 44px;
  padding: 14px;
  box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 0 0 1px var(--line);
  display: flex; flex-direction: column;
}
.phone-screen {
  flex: 1; min-height: 0; overflow: auto;
  background: var(--bg);
  border-radius: 32px;
  display: flex; flex-direction: column;
}
.phone-status {
  flex-shrink: 0;
  padding: 8px 20px 6px;
  display: flex; justify-content: space-between;
  font: 600 12px var(--f-mono);
  color: var(--ink);
}
.phone-tabs {
  display: flex; gap: 4px;
  padding: 6px 16px 0;
}
.phone-tab {
  flex: 1; height: 3px; border-radius: 2px;
  background: var(--surface-3);
  transition: background .2s;
}
.phone-tab.active { background: var(--m); }

.phone-body { flex: 1; padding: 12px 18px 100px; overflow: auto; }
.phone-bottom {
  position: absolute; left: 14px; right: 14px; bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  display: flex; padding: 6px;
  gap: 4px;
  box-shadow: 0 -6px 16px rgba(0,0,0,.2);
}
.phone-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0;
  color: var(--ink-3);
  border-radius: 16px;
  font: 600 10px var(--f-sans);
  letter-spacing: .03em;
}
.phone-btn.active { color: var(--m); background: var(--m-tint); }

/* ──────────────  CALCULATOR ────────────── */
.calc-grid {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 18px;
  align-items: start;
}
@media (max-width: 1100px) { .calc-grid { grid-template-columns: 1fr; } }

.calc-step {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 18px 20px;
  margin-bottom: 12px;
  position: relative;
}
.calc-step .head {
  display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px;
}
.calc-step .num {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface-3);
  color: var(--ink-2);
  display: grid; place-items: center;
  font: 700 13px var(--f-mono);
  flex-shrink: 0;
}
.calc-step.done .num { background: var(--m-tint); color: var(--m); }
.calc-step .q { font: 600 14px var(--f-sans); }
.calc-step .qsub { font: 11.5px var(--f-sans); color: var(--ink-3); margin-top: 2px; }

.calc-gauge {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 22px;
  position: sticky;
  top: 0;
}
.calc-gauge-title { font: 600 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.calc-gauge-svg-wrap { position: relative; width: 240px; height: 240px; margin: 14px auto 0; }
.calc-gauge-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}
.calc-gauge-num { font: 800 56px/1 var(--f-sans); letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.calc-gauge-per { font: 11px var(--f-mono); color: var(--ink-3); margin-top: 4px; letter-spacing: .1em; text-transform: uppercase; }

/* Temp slider */
.t-slider { padding: 6px 0; }
.t-readout {
  font: 800 44px/1 var(--f-sans);
  letter-spacing: -.04em;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.t-readout .u { font: 14px var(--f-mono); color: var(--ink-3); margin-left: 4px; }
.t-track {
  position: relative;
  height: 28px;
  margin: 18px 0 10px;
  background: linear-gradient(90deg, var(--g) 0%, var(--g) 50%, var(--a) 50%, var(--a) 70%, var(--r) 70%, var(--r) 100%);
  border-radius: 14px;
  overflow: hidden;
  opacity: .25;
}
.t-track-input {
  position: absolute; inset: -4px 0;
  width: 100%; height: 36px;
  appearance: none; -webkit-appearance: none;
  background: transparent;
  cursor: pointer;
}
.t-track-input::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none;
  width: 28px; height: 28px;
  background: var(--ink);
  border: 3px solid var(--bg);
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
  border-radius: 50%;
}
.t-ticks { display: flex; justify-content: space-between; font: 11px var(--f-mono); color: var(--ink-3); }

/* Number pad */
.npad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.npad button {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 0;
  font: 600 22px var(--f-mono);
  color: var(--ink);
  transition: all .12s;
}
.npad button:hover { background: var(--surface-3); }
.npad button.fn { background: var(--surface); color: var(--ink-3); font-size: 14px; }
.npad button.ok { background: var(--m); color: #061814; border-color: var(--m); }

/* Big number entry display */
.big-num-display {
  background: var(--surface-2);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  transition: all .2s;
}
.big-num-display.flag {
  background: var(--r-tint);
  border-color: var(--r);
}
.big-num-display .n {
  font: 800 64px/1 var(--f-sans);
  letter-spacing: -.05em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.big-num-display.flag .n { color: var(--r); }
.big-num-display .u { font: 22px var(--f-mono); color: var(--ink-3); margin-left: 6px; }
.big-num-display .range { font: 12px var(--f-mono); color: var(--ink-3); margin-top: 14px; letter-spacing: .03em; }
.big-num-display .alert {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px;
  padding: 6px 12px;
  background: var(--r);
  color: #1a0606;
  border-radius: 6px;
  font: 700 12px var(--f-sans);
}

/* Alert list */
.alert-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 12px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-2);
  margin-bottom: 8px;
  align-items: center;
  cursor: pointer;
  position: relative;
}
.alert-row::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--ink-4);
}
.alert-row.crit::before { background: var(--r); box-shadow: 0 0 6px var(--r-glow); }
.alert-row.warn::before { background: var(--a); }
.alert-row.info::before { background: var(--m); }

.alert-ico {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink-3);
}
.alert-row.crit .alert-ico { background: var(--r-tint); color: var(--r); }
.alert-row.warn .alert-ico { background: var(--a-tint); color: var(--a); }
.alert-row.info .alert-ico { background: var(--m-tint); color: var(--m); }

.alert-body .title { font: 600 14px var(--f-sans); }
.alert-body .desc { font: 12px var(--f-sans); color: var(--ink-3); margin-top: 2px; }
.alert-body .meta { font: 10.5px var(--f-mono); color: var(--ink-3); margin-top: 4px; display: flex; gap: 8px; }

.fade-in { animation: fade-in .25s ease-out; }
.rise { animation: rise .25s ease-out; }

/* Responsive — collapse sidebar to icons-only on narrow */
@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: 1fr 56px; }
  .side {
    grid-row: 2; grid-column: 1;
    flex-direction: row; padding: 0 6px;
    border-right: none; border-top: 1px solid var(--line);
  }
  .side-mark, .side-divider, .side-bottom { display: none; }
  .side-btn { margin: 0; flex: 1; height: 56px; }
  .side-btn.active::before { left: 50%; transform: translateX(-50%); top: 0; bottom: auto; right: auto; height: 3px; width: 30px; border-radius: 0 0 3px 3px; }
}


/* ════════════════════════════════════════
   EOS v8 Sentinel additions
════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════
   EOS v8 — Sentinel
   Responsive + new clinical surfaces on top of v7
   ════════════════════════════════════════════════════════ */

/* ────────── TOUCH TARGETS ────────── */
.btn-sm  { min-height: 32px; }
.btn     { min-height: 40px; }
.btn-lg  { min-height: 44px; }
.btn-xl  { min-height: 56px; }
.ico-btn { min-width: 40px; min-height: 40px; }
.chip    { min-height: 36px; }

/* ────────── RESPONSIVE SHELL ────────── */
/* tablet portrait + below: sidebar becomes a top rail on phone, narrow icon column on tablet */
@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .side  {
    grid-row: 2; grid-column: 1;
    flex-direction: row; padding: 0 4px;
    border-right: none; border-top: 1px solid var(--line);
    height: 64px;
    align-items: stretch;
  }
  .side-mark, .side-divider, .side-bottom { display: none; }
  .side-btn {
    margin: 0; flex: 1; min-width: 44px; height: 100%;
    border-radius: 0;
    flex-direction: column;
    gap: 2px;
    font-size: 10px;
    color: var(--ink-3);
  }
  .side-btn::after {
    content: attr(data-label);
    font: 600 9.5px/1 var(--f-sans);
    letter-spacing: .02em;
  }
  .side-btn.active::before {
    left: 50%; transform: translateX(-50%); top: 0;
    bottom: auto; right: auto; height: 3px; width: 28px;
    border-radius: 0 0 3px 3px;
  }
  .side-badge { top: 6px; right: calc(50% - 18px); }
  .topbar    { padding: 0 14px; gap: 10px; height: 56px; }
  .tb-h1     { font-size: 13px; }
  .tb-sub    { font-size: 11px; }
  .tb-cmd, .tb-clock, .tb-divider { display: none; }
}

@media (max-width: 720px) {
  .topbar .tb-h1 { font-size: 14px; }
  .page-pad { padding: 14px 14px 80px; }
  .page-head h1 { font-size: 22px; }
}

/* ────────── KPI ROW — collapses on narrow ────────── */
@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi .val { font-size: 26px; }
  .kpi { padding: 10px 12px; }
}

/* ────────── BED TABLE → CARDS on narrow ────────── */
@media (max-width: 1100px) {
  .bed-table { background: transparent; border: none; }
  .bed-row {
    grid-template-columns: 56px 1fr auto;
    grid-template-rows: auto auto auto auto;
    grid-template-areas:
      "ava ident status"
      "tl  tl    tl"
      "vit vit   vit"
      "act act   act";
    gap: 12px 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--rad-3);
    margin-bottom: 10px;
  }
  .bed-row > .bed-avatar { grid-area: ava; }
  .bed-row > .bed-id-col { grid-area: ident; min-width: 0; }
  .bed-row > .bed-age    { display: none; }
  .bed-row > .tl-strip   { grid-area: tl; }
  .bed-row > .v-chips    { grid-area: vit; }
  .bed-row > .bed-status { grid-area: status; flex-direction: row; align-items: center; gap: 6px; }
  .bed-row > .bed-action { grid-area: act; text-align: left; }
  .bed-row > .bed-action .btn { width: 100%; }
  .bed-row.crit::before, .bed-row.warn::before, .bed-row.done::before {
    top: 14px; bottom: 14px;
  }
}

/* hide column header on narrow */
@media (max-width: 1100px) {
  .bed-cols-header { display: none !important; }
}

/* ────────── COCKPIT responsive ────────── */
@media (max-width: 1280px) {
  .cockpit { grid-template-columns: 320px 1fr; }
  .cockpit > .watch-col { display: none; }
}
@media (max-width: 900px) {
  .cockpit { grid-template-columns: 1fr; }
  .gauges  { grid-template-columns: repeat(2, 1fr); }
  .dial-wrap { padding: 18px 12px; }
}
@media (max-width: 520px) {
  .gauges  { grid-template-columns: 1fr 1fr; gap: 8px; }
  .gauge-val { font-size: 30px; }
  .dial-age { font-size: 48px; }
}

/* ────────── COMMAND PALETTE responsive ────────── */
@media (max-width: 720px) {
  .cmd-overlay { padding-top: 6vh; align-items: flex-start; }
  .cmd-box     { width: 92vw; }
}

/* ────────── COMMAND PALETTE upgrade ────────── */
.cmd-box {
  background: var(--surface);
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-pop);
}
.cmd-input-row {
  padding: 16px 18px;
  gap: 12px;
}
.cmd-input-row input {
  font: 17px var(--f-sans);
  letter-spacing: -.005em;
}
.cmd-list { padding: 8px; }
.cmd-section {
  padding: 14px 12px 6px;
  display: flex; gap: 8px; align-items: center;
  font: 600 10px var(--f-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.cmd-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  position: relative;
  transition: background .1s;
}
.cmd-item-ico {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  color: var(--ink-3);
  flex-shrink: 0;
}
.cmd-item .lbl {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink);
}
.cmd-item .hint {
  font: 11px var(--f-mono);
  color: var(--ink-3);
}
.cmd-item:hover, .cmd-item.sel {
  background: var(--surface-2);
}
.cmd-item.sel {
  background: var(--m-tint);
}
.cmd-item.sel .cmd-item-ico {
  background: var(--m);
  border-color: var(--m);
  color: #061814;
}
.cmd-item.sel .lbl { color: var(--m); font-weight: 600; }
.cmd-item.sel::before {
  content: '';
  position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px;
  background: var(--m);
  border-radius: 0 3px 3px 0;
}
.cmd-quick {
  font: 12px var(--f-sans);
  padding: 5px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .12s;
}
.cmd-quick:hover {
  background: var(--surface-3);
  border-color: var(--line-2);
  color: var(--ink);
}
.cmd-footer {
  border-top: 1px solid var(--line);
  padding: 10px 14px;
  display: flex; gap: 16px; align-items: center;
  font: 11px var(--f-sans);
  color: var(--ink-3);
  background: var(--surface-2);
}
.cmd-footer .kbd { margin-right: 4px; }

/* ────────── MODAL responsive ────────── */
@media (max-width: 720px) {
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal {
    max-width: 100% !important; width: 100%;
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    padding: 18px 16px 28px;
  }
}

/* ────────── SENTINEL SCORE ────────── */
.sentinel {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 9px 4px 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  font: 600 12px var(--f-mono);
  letter-spacing: .04em;
  color: var(--ink-2);
}
.sentinel .num {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--ink-2);
  font: 700 13px var(--f-mono); letter-spacing: -.02em;
}
.sentinel.s-stable  { background: var(--g-tint); border-color: var(--g-2); color: var(--g); }
.sentinel.s-stable  .num { background: var(--g); color: #06190d; }
.sentinel.s-watch   { background: var(--a-tint); border-color: var(--a-2); color: var(--a); }
.sentinel.s-watch   .num { background: var(--a); color: #1a1408; }
.sentinel.s-concern { background: var(--r-tint); border-color: var(--r-2); color: var(--r); }
.sentinel.s-concern .num { background: var(--r); color: #1a0606; }
.sentinel.s-critical { background: var(--r); border-color: var(--r); color: #fff; }
.sentinel.s-critical .num { background: #fff; color: var(--r); }
.sentinel.s-critical { animation: senti-pulse 2s infinite; }
@keyframes senti-pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--r-glow); }
  50%      { box-shadow: 0 0 0 6px transparent; }
}
.sentinel.lg .num { width: 56px; height: 56px; font-size: 26px; }
.sentinel.lg { padding: 4px 18px 4px 4px; font-size: 13px; letter-spacing: .08em; gap: 14px; }

/* ────────── SENTINEL BREAKDOWN ────────── */
.senti-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 16px;
}
.senti-card .head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 12px;
}
.senti-factors {
  display: flex; flex-direction: column; gap: 8px;
}
.senti-factor {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 10px;
  padding: 8px 10px;
  align-items: center;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 12.5px;
}
.senti-factor.fired { background: var(--r-tint); }
.senti-factor.warn  { background: var(--a-tint); }
.senti-factor .ix { color: var(--ink-3); }
.senti-factor.fired .ix { color: var(--r); }
.senti-factor.warn  .ix { color: var(--a); }
.senti-factor .lbl  { color: var(--ink-2); }
.senti-factor .pts  {
  font: 700 11.5px var(--f-mono);
  padding: 2px 7px; border-radius: 4px;
  background: var(--surface-3); color: var(--ink-3);
}
.senti-factor.fired .pts { background: var(--r); color: #1a0606; }
.senti-factor.warn  .pts { background: var(--a); color: #1a1408; }

/* ────────── CARE PLAN ────────── */
.care-plan {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 4px 0;
}
.care-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  gap: 12px;
  padding: 12px 16px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background .12s;
}
.care-row:last-child { border-bottom: none; }
.care-row:hover { background: var(--surface-2); }

.care-box {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 1.5px solid var(--line-2);
  background: var(--surface-2);
  display: grid; place-items: center;
  transition: all .15s;
  flex-shrink: 0;
}
.care-row.done .care-box { background: var(--g); border-color: var(--g); color: #06190d; }
.care-row.due  .care-box { border-color: var(--a); border-style: dashed; }
.care-row.miss .care-box { border-color: var(--r); background: var(--r-tint); }

.care-row .title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.care-row.done .title { text-decoration: line-through; text-decoration-color: var(--ink-4); color: var(--ink-2); }
.care-row .sub   { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; font-family: var(--f-mono); }
.care-row .when  {
  font: 11px var(--f-mono); color: var(--ink-3);
  padding: 3px 7px; background: var(--surface-2);
  border-radius: 4px;
}
.care-row.done .when { color: var(--g); background: var(--g-tint); }
.care-row.miss .when { color: var(--r); background: var(--r-tint); }
.care-row.due  .when { color: var(--a); background: var(--a-tint); }

.care-progress {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
}
.care-bar {
  flex: 1; height: 8px; border-radius: 4px;
  background: var(--surface-3); overflow: hidden;
  position: relative;
}
.care-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--m), var(--m-2));
  transition: width .3s ease-out;
}

/* ────────── HANDOFF (SBAR) ────────── */
.handoff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 14px;
}
.sbar-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  padding: 16px;
  position: relative;
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: border-color .15s;
}
.sbar-card:hover { border-color: var(--line-2); }
.sbar-card.crit { border-color: var(--r-2); }
.sbar-card.warn { border-color: var(--a-2); }
.sbar-card .sbar-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.sbar-card .sbar-head .who { flex: 1; min-width: 0; }
.sbar-card .sbar-head .who h3 { margin: 0; font: 700 16px var(--f-sans); letter-spacing: -.01em; }
.sbar-card .sbar-head .who .meta { font: 11px var(--f-mono); color: var(--ink-3); margin-top: 3px; }
.sbar-section {
  font: 600 9.5px var(--f-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 10px 0 5px;
  display: flex; gap: 6px; align-items: center;
}
.sbar-section .key {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--ink-2);
  border-radius: 4px;
  font: 700 10px var(--f-mono);
}
.sbar-content { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.sbar-content .flag { color: var(--r); font-weight: 600; }
.sbar-content .warn { color: var(--a); font-weight: 600; }
.sbar-content .ok   { color: var(--g); font-weight: 600; }
.sbar-content ul { margin: 4px 0; padding-left: 14px; }
.sbar-content li { margin: 2px 0; }
.sbar-vitals {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  margin-top: 4px;
}
.sbar-vit {
  background: var(--surface-2); border-radius: 6px;
  padding: 4px 6px; text-align: center;
  font: 11px var(--f-mono);
}
.sbar-vit.flag { background: var(--r-tint); color: var(--r); }
.sbar-vit .k { font-size: 9px; color: var(--ink-3); letter-spacing: .04em; }
.sbar-vit.flag .k { color: var(--r); opacity: .8; }
.sbar-vit .v { font-weight: 700; font-size: 13px; color: var(--ink); margin-top: 1px; }
.sbar-vit.flag .v { color: var(--r); }

.handoff-bar {
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap;
  padding: 14px 16px;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--rad-3);
  margin-bottom: 16px;
}
.handoff-bar .lbl {
  font: 600 10.5px var(--f-mono);
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}

/* ────────── EVIDENCE PANEL ────────── */
.evi-card {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--rad-2);
  padding: 12px 14px;
  margin-top: 10px;
}
.evi-card .ev-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 5px 0;
  font-size: 12.5px;
  border-bottom: 1px dashed var(--line);
}
.evi-card .ev-row:last-child { border-bottom: none; }
.evi-card .ev-row .k { color: var(--ink-3); }
.evi-card .ev-row .v { font-family: var(--f-mono); font-weight: 600; }
.evi-card .ev-row .v.up { color: var(--r); }
.evi-card .ev-row .v.dn { color: var(--g); }

/* ────────── SHIFT BANNER ────────── */
.shift-banner {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--m-tint), var(--surface-2));
  border: 1px solid var(--m-deep);
  border-radius: var(--rad-3);
  margin-bottom: 14px;
}
.shift-banner .ic {
  width: 38px; height: 38px;
  border-radius: 10px; background: var(--m); color: #061814;
  display: grid; place-items: center;
}

/* ────────── BED ROW SENTINEL COL (desktop) ────────── */
@media (min-width: 1101px) {
  .bed-row {
    grid-template-columns: 50px 1.3fr 70px 96px 1fr .9fr 100px 80px;
  }
  .bed-cols-header {
    grid-template-columns: 50px 1.3fr 70px 96px 1fr .9fr 100px 80px !important;
  }
}

/* ────────── TAP HINT on patient detail ────────── */
.tappable {
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.tappable:hover { background: var(--surface-2); }

/* ────────── INLINE VITALS QUICK-EDIT ────────── */
.gauge.tappable:hover { border-color: var(--m); }

/* ────────── PATIENT QUICK-BAR (mobile sticky actions) ────────── */
.pt-quick-bar {
  position: sticky; top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 8px 0;
  display: flex; gap: 6px; flex-wrap: wrap;
}
@media (min-width: 901px) {
  .pt-quick-bar { display: none; }
}

/* ────────── EMPTY STATE polish ────────── */
.empty-state {
  text-align: center; padding: 60px 30px;
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--rad-3);
}
.empty-state .ic-wrap {
  width: 60px; height: 60px; border-radius: 18px;
  display: grid; place-items: center;
  margin: 0 auto 14px;
}
.empty-state h2 { margin: 0 0 4px; font-size: 18px; }
.empty-state .muted { font-size: 13px; }

/* ────────── AUDIT TRAIL ────────── */
.audit-list {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--line);
  border-radius: var(--rad-2);
  overflow: hidden;
}
.audit-row {
  background: var(--surface);
  display: grid; grid-template-columns: 100px 1fr auto; gap: 12px;
  padding: 10px 14px;
  align-items: start;
  font-size: 12.5px;
}
.audit-row .when { font: 11px var(--f-mono); color: var(--ink-3); }
.audit-row .what { color: var(--ink); }
.audit-row .who  { font: 11px var(--f-mono); color: var(--ink-3); }

<script type="text/babel">
// ──── src/eos-data.jsx ────
// EOS Smart Alert — Data layer (v8 Sentinel merge)
// SRP: localStorage, GAS sync, EOS utilities + v8 additions. No React/JSX here.
// Exposes: window.EOS + convenience aliases for panels

const EOS = window.EOS = (() => {

  // ── CONSTANTS ──────────────────────────────────────────
  const TIMEPOINTS = ['1-2 hr','3-4 hr','10 hr','18 hr','22 hr','36 hr','44 hr'];
  const OFFSETS    = {'1-2 hr':1.5,'3-4 hr':3.5,'10 hr':10,'18 hr':18,'22 hr':22,'36 hr':36,'44 hr':44};
  const ABX_TPS    = new Set(['36 hr','44 hr']);
  const SESSION_HR = 8;
  const DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbymZoPlUF1NCot_OMsm3oEzzVxq7Un5VjpVrTE2xQLLadQzvYzkq5H7NinD8UipPouF/exec';

  const RANGES = {
    T:    {lo:36.5,hi:37.4,hardLo:36.0,hardHi:38.0,unit:'°C',   label:'อุณหภูมิ',  en:'Temp'},
    P:    {lo:110, hi:160, hardLo:100, hardHi:180, unit:'bpm',  label:'ชีพจร',     en:'HR'},
    R:    {lo:40,  hi:60,  hardLo:30,  hardHi:70,  unit:'/min', label:'การหายใจ',  en:'RR'},
    SpO2: {lo:95,  hi:100, hardLo:92,  hardHi:100, unit:'%',    label:'ออกซิเจน',  en:'SpO₂'},
  };
  const SKIN_OPTS = ['Rosy','Pale','Marbled','Cyanotic'];
  const RD_OPTS   = ['tachypnea','nasal flaring','retractions','grunting'];

  // ── AUTH / ROLE ─────────────────────────────────────────
  const AUTH = {
    GOOGLE_CLIENT_ID: '658466851314-1a9ub51gpilmg32abobrtqp7772s8dbu.apps.googleusercontent.com',
    ALLOW_DEMO_MODE: false,
  };

  const STAFF_DB = {};

  const ROLE_CFG = {
    doctor: {label:'แพทย์',    icon:'👨‍⚕️',bg:'#eff6ff',color:'#1e40af',canApproveAbx:true, canDischarge:true, canConfig:false,canManageUsers:false},
    nurse:  {label:'พยาบาล',  icon:'👩‍⚕️',bg:'#f0fdf4',color:'#166534',canApproveAbx:false,canDischarge:false,canConfig:false,canManageUsers:false},
    admin:  {label:'ผู้ดูแลระบบ',icon:'🛡️', bg:'#fdf4ff',color:'#7e22ce',canApproveAbx:true, canDischarge:true, canConfig:true, canManageUsers:true},
  };

  // ── STORE KEYS ──────────────────────────────────────────
  const STORE = {
    patients:'eos_patients',
    vitals:  'eos_vitals',
    audit:   'eos_audit',
    users:   'eos_users',
    cfg:     'eos_cfg',
  };

  // ── STORAGE ─────────────────────────────────────────────
  const sj = (s, def) => { try { const v=JSON.parse(s); return v??def; } catch { return def; } };
  const getStore = (k, def=[]) => sj(localStorage.getItem(k), def);
  const setStore = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  // ── SESSION (sessionStorage, 8 hr) ──────────────────────
  const getSession = () => {
    const s = sj(sessionStorage.getItem('eos_sess'), null);
    if (!s) return null;
    if ((Date.now()-new Date(s.loginAt))/3600000 > SESSION_HR) {
      sessionStorage.removeItem('eos_sess'); return null;
    }
    return s;
  };
  const setSession   = s => sessionStorage.setItem('eos_sess', JSON.stringify(s));
  const clearSession = () => sessionStorage.removeItem('eos_sess');

  // ── USER MANAGEMENT ─────────────────────────────────────
  const getUsers = () => {
    const ov = sj(localStorage.getItem(STORE.users), null);
    return (ov && typeof ov === 'object') ? ov : STAFF_DB;
  };
  const saveUsers = db => setStore(STORE.users, db);
  const findStaffByEmail = email => {
    if (!email) return null;
    const key = String(email).trim().toLowerCase();
    const db  = getUsers();
    for (const k in db) if (k.toLowerCase()===key) return {email:k, ...db[k]};
    return null;
  };

  // ── AUDIT LOG ───────────────────────────────────────────
  const auditLog = (action, detail='') => {
    const s     = getSession();
    const entry = { ts:new Date().toISOString(), staff:s?.name||'?', role:s?.role||'?', action, detail };
    const arr = getStore(STORE.audit);
    arr.push(entry);
    if (arr.length > 1000) arr.splice(0, arr.length-1000);
    setStore(STORE.audit, arr);
    const url = getCfg?.() ? (getCfg().url || DEFAULT_WEBHOOK) : DEFAULT_WEBHOOK;
    const token = s?.token || null;
    if (token) {
      fetch(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({sheet:'AuditLog', ...entry, token}),
      }).catch(()=>{});
    }
  };

  // ── CONFIG & SYNC ────────────────────────────────────────
  const getCfg = () => sj(localStorage.getItem(STORE.cfg), {});
  const setCfg = c => setStore(STORE.cfg, {...getCfg(), ...c});

  const fetchT = (url, opts={}, ms=10000) => {
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), ms);
    return fetch(url, {...opts, signal:ctrl.signal}).finally(()=>clearTimeout(t));
  };
  const getToken = () => getSession()?.token || null;

  const syncRow = async (sheet, row) => {
    const url   = getCfg().url || DEFAULT_WEBHOOK;
    const token = getToken();
    try {
      const r = await fetchT(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({sheet, ...row, token}),
      }, 8000);
      return r.ok;
    } catch { return false; }
  };

  const loginGAS = async token => {
    const url = getCfg().url || DEFAULT_WEBHOOK;
    try {
      const r = await fetchT(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'login', token}),
      }, 10000);
      if (!r.ok) return { status:'network_error', code:r.status };
      const data = await r.json();
      return data;
    } catch (e) {
      return { status:'error', message: e?.message||'unknown' };
    }
  };

  const loadFromGAS = async (tokenOverride) => {
    const url = getCfg().url || DEFAULT_WEBHOOK;
    const tok = tokenOverride || getToken();
    if (!tok) return { ok: false };
    try {
      const r = await fetchT(url, {
        method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'load', token: tok }),
      }, 20000);
      if (!r.ok) return { ok: false };
      const data = await r.json();
      if (data.status !== 'ok') return { ok: false };

      const safeNum = (v, lo, hi, def) => {
        const n = Number(v);
        return (v != null && !isNaN(n) && n >= lo && n <= hi) ? n : def;
      };
      const patients = (data.triage || []).map(p => ({
        ...p,
        // ga: validate 22–44 weeks; reject impossible values (e.g. bw in wrong column)
        ga:         safeNum(p.ga,  22, 44,   39),
        gaDays:     safeNum(p.gaDays, 0, 6,  0),
        // bw: validate 400–6000g
        bw:         safeNum(p.bw, 400, 6000, null),
        // kpRisk from GAS (v8 field); default 0 if missing
        kpRisk:     safeNum(p.kpRisk, 0, 1000, 0),
        // floor from GAS (v8 field); default '22B'
        floor:      p.floor || '22B',
        archived:   p.archived  === true || String(p.archived).toUpperCase()  === 'TRUE',
        isSerialPE: p.isSerialPE === true || String(p.isSerialPE).toUpperCase() === 'TRUE',
        // birthAt: prefer v8 field, fall back to dob (ISO string from GAS Date serialization)
        birthAt: p.birthAt || p.dob || null,
        intake: {
          chorio:       p.chorio        ?? false,
          maternalFever:p.maternalFever ?? 'no',
          fever:        p.fever  != null ? Number(p.fever) : null,
          gbs:          p.gbs   ?? 'unk',
          rom:          p.rom   != null ? Number(p.rom)   : 0,
          iap:          p.iap   ?? 'none',
        },
        synced: true,
      }));

      const vitals = (data.serialPE || []).map(v => ({
        ...v,
        T:    v.T    != null ? Number(v.T)    : null,
        P:    v.P    != null ? Number(v.P)    : null,
        R:    v.R    != null ? Number(v.R)    : null,
        SpO2: v.SpO2 != null ? Number(v.SpO2) : null,
        rd:   v.rd   ? String(v.rd).split('|').filter(Boolean) : [],
        abxApproved: v.abxApproved === true || String(v.abxApproved).toUpperCase() === 'TRUE',
        synced: true,
      }));

      return { ok: true, patients, vitals };
    } catch (e) {
      console.error('loadFromGAS:', e.message);
      return { ok: false };
    }
  };

  // ── UTILS ────────────────────────────────────────────────
  const nowISO = () => new Date().toISOString();
  const hoursSince = iso => (Date.now() - new Date(iso).getTime()) / 3600000;
  const maskHn = hn => hn ? String(hn).replace(/(\d{2}\/\d{2})\d+/,'$1****') : '?';
  const esc    = s  => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  const fmtTime = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  };
  const fmtDateTime = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})+' '+fmtTime(iso);
  };
  const fmtRelative = iso => {
    if (!iso) return '—';
    const diff = (Date.now()-new Date(iso))/3600000;
    if (diff < 1/60) return 'เมื่อกี้';
    if (diff < 1)    return Math.round(diff*60)+' นาทีที่แล้ว';
    if (diff < 24)   return (Math.round(diff*10)/10)+' hr ที่แล้ว';
    return Math.round(diff/24)+' วันที่แล้ว';
  };
  const fmtDate = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
  };

  // ── v8 AGE FORMAT UTILS ──────────────────────────────────
  const fmtAge = hr => {
    if (hr == null || isNaN(hr) || !isFinite(hr)) return '—';
    if (hr < 1) return Math.round(hr * 60) + ' m';
    if (hr < 24) {
      const half = Math.round(hr * 2) / 2;
      const s = half % 1 === 0 ? String(half) : half.toFixed(1);
      return s + ' hr';
    }
    const d = Math.floor(hr / 24);
    const h = Math.floor(hr % 24);
    return h === 0 ? d + ' d' : d + ' d ' + h + ' h';
  };
  const fmtAgeShort = hr => {
    if (hr == null) return '—';
    if (hr < 24) {
      const half = Math.round(hr * 2) / 2;
      const s = half % 1 === 0 ? String(half) : half.toFixed(1);
      return s + ' hr';
    }
    return (hr / 24).toFixed(1) + ' d';
  };
  const fmtAgeParts = hr => {
    if (hr == null || isNaN(hr) || !isFinite(hr)) return { n: '—', unit: '' };
    if (hr < 1) return { n: String(Math.round(hr * 60)), unit: 'm' };
    if (hr < 24) {
      const half = Math.round(hr * 2) / 2;
      const s = half % 1 === 0 ? String(half) : half.toFixed(1);
      return { n: s, unit: 'hr' };
    }
    const d = Math.floor(hr / 24);
    const h = Math.floor(hr % 24);
    return { n: String(d), unit: h === 0 ? 'd' : `d ${h} h` };
  };
  const fmtGA = (weeks, days) => {
    if (weeks == null) return '—';
    const w = Math.floor(weeks);
    const d = days ?? Math.round((weeks - w) * 7);
    return d > 0 ? `${w}+${d} wk` : `${w} wk`;
  };

  // ── PDPA: initials display ──────────────────────
  const THAI_CONSONANT_STRICT = /[ก-ฮ]/;
  const firstLetter = (word) => {
    if (!word) return '';
    for (const ch of word) {
      if (THAI_CONSONANT_STRICT.test(ch)) return ch;
      if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
    }
    for (const ch of word) {
      if (!/\s/.test(ch)) return ch;
    }
    return '';
  };
  const initials = (fullName, fallback = '?') => {
    if (!fullName) return fallback;
    const skip = new Set(['baby', 'ของ', 'นาง', 'นาย', 'น.ส.', 'นางสาว', 'ด.ช.', 'ด.ญ.', 'mr', 'mrs', 'ms', 'dr']);
    const parts = String(fullName).trim().split(/\s+/).filter(p => !skip.has(p.toLowerCase()));
    if (parts.length === 0) return fallback;
    const letters = parts.slice(0, 3).map(firstLetter).filter(Boolean).join('');
    return letters || fallback;
  };
  const displayName = (patient) => {
    if (!patient) return '—';
    return initials(patient.name || patient.motherName || patient.hn, patient.bed || '?');
  };
  const floorLabel = (floor) => {
    if (!floor) return '';
    return String(floor).match(/^\d/) ? `ชั้น ${floor}` : String(floor);
  };

  // ── BABY AGE ─────────────────────────────────────────────
  // v8: use birthAt || dob (v5 compat)
  const ageHours = p => hoursSince(p.birthAt || p.dob || p.createdAt);

  // ── VITALS HELPERS ────────────────────────────────────────
  const vitalsFor = (hn, store) => (store||getStore(STORE.vitals)).filter(v=>v.hn===hn).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const doneTPs   = (hn, store) => new Set(vitalsFor(hn, store).map(v=>v.ageHr));
  const nextTP    = (hn, store) => { const done=doneTPs(hn,store); return TIMEPOINTS.find(tp=>!done.has(tp))||null; };
  const tpDueAt   = (p, tp)    => new Date(new Date(p.birthAt || p.dob).getTime()+OFFSETS[tp]*3600000);

  // ── VITAL EVALUATION ─────────────────────────────────────
  // v8 format: {k, val, sev, critical}
  const evalVitals = v => {
    const issues = [];
    if (!v) return issues;
    if (v.wellbeing === 'no') issues.push({ k:'Wellbeing', val:'ผิดปกติ', sev:'red', critical:true });
    if (v.skin && v.skin !== 'Rosy') {
      const critical = v.skin === 'Cyanotic';
      issues.push({ k:'skin', val:v.skin, sev:'red', critical });
    }
    [['T',v.T],['P',v.P],['R',v.R],['SpO2',v.SpO2]].forEach(([k,val]) => {
      if (val == null) return;
      const r = RANGES[k]; if (!r) return;
      const n = +val;
      const critical = n < r.hardLo || n > r.hardHi;
      if (n < r.lo || n > r.hi) {
        issues.push({ k, val:n, txt:n+r.unit, sev:'red', critical });
      }
    });
    if (v.rd && v.rd.length) {
      const critical = v.rd.length > 1;
      issues.push({ k:'rd', val:v.rd.join(', '), txt:v.rd.join(', '), sev:'red', critical });
    }
    return issues;
  };

  const vitalFlag = (key, value) => {
    if (value==null||value==='') return null;
    const r=RANGES[key]; if(!r) return null;
    const v=+value;
    if (v<r.hardLo||v>r.hardHi) return 'red';
    if (v<r.lo||v>r.hi)         return 'amber';
    return null;
  };

  // ── TREND DETECTION ──────────────────────────────────────
  // v8: simpler 3-reading pattern for Sentinel
  const evalTrend = (hn, store) => {
    const vs = vitalsFor(hn, store);
    if (vs.length < 3) return [];
    const last3 = vs.slice(-3);
    const trends = [];
    const rs = last3.map(v => v.R).filter(x => x != null);
    const sps = last3.map(v => v.SpO2).filter(x => x != null);
    if (rs.length === 3 && rs[2] > rs[1] && rs[1] > rs[0] && rs[2] - rs[0] >= 8)
      trends.push({ txt: `RR ↑ ${rs[0]}→${rs[1]}→${rs[2]}` });
    if (sps.length === 3 && sps[2] < sps[1] && sps[1] < sps[0] && sps[0] - sps[2] >= 3)
      trends.push({ txt: `SpO₂ ↓ ${sps[0]}→${sps[1]}→${sps[2]}` });
    return trends;
  };

  // ── TP STATUS — v8 format ─────────────────────────────────
  // Returns: { tp, cat, label, hoursLate?, hoursUntil? }
  const tpStatus = (patient, store) => {
    const age = ageHours(patient);
    if (patient.archived) return { tp: null, cat: 'done', label: 'เสร็จสิ้น 44 hr' };
    const done = doneTPs(patient.hn, store);

    let nextDue = null, nextSoon = null;
    for (const tp of TIMEPOINTS) {
      if (done.has(tp)) continue;
      const off = OFFSETS[tp];
      if (age >= off + 1) { nextDue = tp; break; }      // overdue (>1hr past)
      if (age >= off - 0.5 && age <= off + 1) { nextDue = tp; break; } // due now
      if (age < off - 0.5) { nextSoon = tp; break; }    // upcoming
    }
    if (nextDue) {
      const off = OFFSETS[nextDue];
      const cat = age > off + 1 ? 'overdue' : 'due';
      return { tp: nextDue, cat, label: cat === 'overdue' ? `เลย ${nextDue}` : `ถึงเวลา ${nextDue}`, hoursLate: Math.max(0, age - off) };
    }
    if (nextSoon) {
      const off = OFFSETS[nextSoon];
      const cat = (off - age) <= 2 ? 'soon' : 'ok';
      return { tp: nextSoon, cat, label: cat === 'soon' ? `ใน ${(off-age).toFixed(1)}h` : `ถัดไป ${nextSoon}`, hoursUntil: off - age };
    }
    if (done.size === TIMEPOINTS.length) return { tp: null, cat: 'complete', label: 'เสร็จสมบูรณ์' };
    return { tp: null, cat: 'done', label: 'รอ' };
  };

  // ── KP 2024 EOS CALCULATOR (v8 format) ───────────────────
  const KP = {
    INCIDENCE_DEFAULT: 0.5,
    LR: {
      ga: {
        '34': 2.4, '35': 1.8, '36': 1.4, '37': 1.0, '38': 0.85, '39': 0.75, '40': 0.70, '41+': 0.70,
      },
      tempMax: {
        '<37.5': 0.6, '37.5-38.0': 1.0, '38.0-38.5': 2.2, '38.5-39.0': 4.0, '≥39.0': 6.5,
      },
      rom: {
        '0-6': 0.8, '6-12': 1.0, '12-18': 1.6, '18-24': 2.1, '>24': 3.2,
      },
      gbs: {
        'neg': 0.7, 'unk': 1.0, 'pos': 2.4,
      },
      iap: {
        'broad-spec-≥4hr':   0.30,
        'broad-spec-<4hr':   0.55,
        'gbs-spec-≥2hr':     0.45,
        'gbs-spec-<2hr':     0.75,
        'none':              1.0,
      },
    },

    compute(inputs) {
      const { incidence, ga, tempMax, rom, gbs, iap } = inputs;
      const inc = (incidence ?? this.INCIDENCE_DEFAULT) / 1000;
      let posterior = inc;
      const factors = [];

      const apply = (k, v, label) => {
        if (v == null || v === undefined) return;
        const lr = this.LR[k]?.[v];
        if (!lr) return;
        const oddsBefore = posterior / (1 - posterior);
        const oddsAfter = oddsBefore * lr;
        posterior = oddsAfter / (1 + oddsAfter);
        factors.push({ key: k, label, value: v, lr, posteriorPer1k: posterior * 1000 });
      };

      apply('ga',      String(ga ?? ''),       'GA');
      apply('tempMax', tempMax,                'ไข้มารดา');
      apply('rom',     rom,                    'ROM');
      apply('gbs',     gbs,                    'GBS');
      apply('iap',     iap,                    'IAP');

      const per1k = posterior * 1000;
      const priorPer1k = inc * 1000;
      let band, action;
      if (per1k >= 3.0) {
        band = 'high';
        action = 'พิจารณาให้ Empiric ATB + ส่งเลือดเพาะเชื้อ';
      } else if (per1k >= 1.0) {
        band = 'medium';
        action = 'Enhanced observation: Serial PE q4–6h × 24–36 ชม.';
      } else {
        band = 'low';
        action = 'Routine well-baby care + observation';
      }
      return { priorPer1k, posteriorPer1k: per1k, factors, band, action };
    },

    applyExam(prePosterior, exam) {
      const lr = { well: 0.41, equivocal: 5.0, 'clinical-illness': 21.5 }[exam];
      if (!lr) return prePosterior;
      const odds = prePosterior / (1000 - prePosterior);
      const newOdds = odds * lr;
      const p = newOdds / (1 + newOdds);
      return p * 1000;
    },
  };

  const calcEOSRisk = ({ gaWeeks=39, gaDays=0, romHours=12, maternalTempC=37.0, gbsStatus='unk', iapType='none', incidence=0.5 }) => {
    const ga = gaWeeks + (gaDays || 0) / 7;
    let gaFactor;
    if (ga < 35) gaFactor = 8.0;
    else if (ga < 36) gaFactor = 4.0;
    else if (ga < 37) gaFactor = 2.3;
    else if (ga < 38) gaFactor = 1.5;
    else if (ga < 39) gaFactor = 1.0;
    else if (ga < 40) gaFactor = 0.75;
    else if (ga < 41) gaFactor = 0.60;
    else gaFactor = 0.50;
    let risk = incidence * gaFactor;
    if (gbsStatus === 'pos') risk *= 6.0;
    else if (gbsStatus === 'neg') risk *= 0.18;
    if (romHours >= 24) risk *= 1.9;
    else if (romHours >= 18) risk *= 1.4;
    else if (romHours >= 12) risk *= 1.1;
    else risk *= 0.7;
    if (maternalTempC >= 39.0) risk *= 4.2;
    else if (maternalTempC >= 38.0) risk *= 2.3;
    if (iapType === 'broad_4plus') risk *= 0.065;
    else if (iapType === 'broad_2to4') risk *= 0.12;
    else if (iapType === 'gbs_2plus') risk *= 0.15;
    return Math.max(0.001, Math.round(risk * 10000) / 10000);
  };
