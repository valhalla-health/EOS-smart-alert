// TRIAGE
// ══════════════════════════════════════════════════

function Triage({ onCreated, onCancel }) {
  const [q1, setQ1] = useState(null);
  const [q2, setQ2] = useState(null);
  const [q3, setQ3] = useState(null);
  const [form, setForm] = useState({ motherName:'', hn:'', ga:38, bw:3000, bed:'NICU-', feverTemp:38.6, rom:12, gbsStatus:'unk', chorio:false });
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));

  let current=1;
  if (q1!==null) current=2;
  if (q1===false&&q2!==null) current=3;
  if (q1===true||(q1===false&&q2===false)||(q1===false&&q2===true&&q3!==null)) current=4;

  let outcome=null;
  if (q1===true) outcome={type:'workup',verdict:'red',title:form.chorio?'Chorioamnionitis → H/C + CBC + Empirical ABX':'H/C + CBC · Serial PE',actions:form.chorio?['Chorioamnionitis — workup บังคับ','เจาะ Blood culture และ CBC ภายในอายุ 0–6 hr','เริ่ม Empirical ABX ทันที (แพทย์ยืนยัน)','ABX Time-out ที่ 36 และ 44 hr']:['เจาะ Blood culture และ CBC ภายในอายุ 0–6 hr','เริ่ม Serial PE ทันที','พิจารณา Empirical ABX ตามอาการ','ABX Time-out ที่ 36 และ 44 hr']};
  else if (q1===false&&q2===false) outcome={type:'observe',verdict:'green',title:'Routine Care',actions:['ดูแลตามปกติ','ไม่ต้องการ Serial PE','หากอาการเปลี่ยนแปลง ให้ประเมินใหม่']};
  else if (q1===false&&q2===true&&q3===true) outcome={type:'observe',verdict:'green',title:'Routine Care (IAP Adequate)',actions:['IAP เพียงพอ — Routine care','หากอาการเปลี่ยนแปลง ให้ประเมินใหม่']};
  else if (q1===false&&q2===true&&q3===false) outcome={type:'serialPE',verdict:'amber',title:'Serial Physical Examinations',actions:['ตรวจร่างกายตาม 7 timepoints','หากพบผิดปกติ → พิจารณา ABX','ABX Time-out ที่ 36 และ 44 hr (แพทย์)']};

  const handleSubmit = () => {
    if (!outcome||!form.motherName) return;
    if (+form.ga < 34) return alert('⚠️ EOS Smart Alert ใช้สำหรับ GA ≥ 34 สัปดาห์เท่านั้น\nกรุณาตรวจสอบ GA อีกครั้ง');
    const p = {
      hn: form.hn||`68/${10000+Math.floor(Math.random()*9000)}`,
      name: 'Baby ของ '+form.motherName, motherName:form.motherName,
      sex:'M', ga:+form.ga, bw:+form.bw, bed:form.bed,
      dob:EOS.nowISO(),
      intake:{maternalFever:q1?'yes':'no',fever:q1?+form.feverTemp:null,chorio:form.chorio||false,gbs:form.gbsStatus,rom:+form.rom,iap:q3===true?'adequate':q3===false?'none':'partial'},
      triageOutcome:outcome.type, isSerialPE:outcome.type!=='observe', archived:false,
      ts:EOS.nowISO(), synced:false,
    };
    EOS.auditLog('TRIAGE_SAVE',`HN:${EOS.maskHn(p.hn)} → ${p.triageOutcome}`);
    onCreated(p);
  };

  const questions = [
    { num:1, q:'มารดามีไข้ ≥ 38°C หรือ Chorioamnionitis?', en:'Intrapartum fever ≥ 38°C or chorioamnionitis',
      state:q1, set:setQ1, locked:false, yesClass:'danger', noClass:'',
      extra:q1===true&&<div className="mt-12"><div className="row-2"><div className="field"><label>อุณหภูมิมารดา (°C)</label><input className="mono" type="number" step="0.1" value={form.feverTemp} onChange={e=>upd('feverTemp',+e.target.value)}/></div></div><div className="field mt-8" style={{display:'flex',alignItems:'center',gap:8}}><input type="checkbox" id="chorio-chk" checked={form.chorio} onChange={e=>upd('chorio',e.target.checked)} style={{width:16,height:16}}/><label htmlFor="chorio-chk" style={{fontWeight:600,color:'var(--red-2)'}}>ได้รับการวินิจฉัย Chorioamnionitis (→ workup + พิจารณา Empirical ABX)</label></div></div> },
    { num:2, q:'มารดา GBS Positive หรือมี Risk Factors?', en:'GBS colonized or ROM ≥ 18 hr / prior GBS infant',
      state:q2, set:setQ2, locked:q1===null||q1===true, yesClass:'warn', noClass:'',
      extra:<div className="row-2 mb-12 mt-8"><div className="field"><label>GBS Status</label><select value={form.gbsStatus} onChange={e=>upd('gbsStatus',e.target.value)}><option value="unk">Unknown</option><option value="pos">Positive</option><option value="neg">Negative</option></select></div><div className="field"><label>ROM (hr)</label><input className="mono" type="number" value={form.rom} onChange={e=>upd('rom',+e.target.value)}/></div></div> },
    { num:3, q:'ได้รับ IAP เพียงพอ? (Penicillin/Ampicillin ≥ 4 hr ก่อนคลอด)', en:'Adequate intrapartum antibiotic prophylaxis',
      state:q3, set:setQ3, locked:q1!==false||q2!==true, yesClass:'', noClass:'warn', extra:null },
  ];

  return (
    <div className="panel">
      <div className="page-head">
        <div><h1>Triage Pathway</h1><div className="sub">คัดกรอง EOS · ทารก GA ≥ 34 สัปดาห์</div></div>
        <div className="right"><button className="btn btn-ghost btn-sm" onClick={onCancel}>ยกเลิก</button></div>
      </div>
      <div className="triage-wrap">
        <div>
          <div className="card mb-12">
            <div className="card-head"><span className="card-title">ข้อมูลทารก</span></div>
            <div className="row-2">
              <div className="field"><label>ชื่อมารดา *</label><input value={form.motherName} onChange={e=>upd('motherName',e.target.value)} placeholder="คุณ..."/></div>
              <div className="field"><label>HN</label><input className="mono" value={form.hn} onChange={e=>upd('hn',e.target.value)} placeholder="68/XXXXX"/></div>
            </div>
            <div className="row-3 mt-12">
              <div className="field"><label>GA (wk) <span style={{color:'var(--red-2)',fontSize:11}}>≥34 wk เท่านั้น</span></label><input className="mono" type="number" step="0.1" min="34" max="43" value={form.ga} onChange={e=>upd('ga',+e.target.value)} style={form.ga<34?{borderColor:'var(--red)'}:{}}/>{form.ga<34&&<div style={{color:'var(--red-2)',fontSize:11,marginTop:4}}>⚠️ EOS protocol สำหรับ GA ≥ 34 wk เท่านั้น</div>}</div>
              <div className="field"><label>BW (g)</label><input className="mono" type="number" value={form.bw} onChange={e=>upd('bw',+e.target.value)}/></div>
              <div className="field"><label>เตียง / ห้อง</label><input value={form.bed} onChange={e=>upd('bed',e.target.value)}/></div>
            </div>
          </div>
          {questions.map(({ num, q, en, state, set, locked, yesClass, noClass, extra }) => (
            <div key={num} className={`triage-step ${locked?'locked':current===num?'current':state!==null?'done':''}`}>
              <div className="flex items-center"><span className="step-no">{num}</span><span className="q">{q}</span></div>
              <div className="q-en">{en}</div>
              <div className="step-body">
                {extra}
                <div className="yn-row">
                  <button className={`chip ${yesClass} ${state===true?'active':''}`} onClick={()=>set(true)}>ใช่ · Yes</button>
                  <button className={`chip ${noClass} ${state===false?'active':''}`} onClick={()=>set(false)}>ไม่ใช่ · No</button>
                </div>
              </div>
            </div>
          ))}
        </div>
        <div className="outcome">
          <h4>คำแนะนำ · Recommendation</h4>
          {outcome ? (
            <div className={`verdict active ${outcome.verdict}`}>
              <span className="lg">{outcome.title}</span>
              <div className="actions"><ul>{outcome.actions.map((a,i)=><li key={i}>{a}</li>)}</ul></div>
            </div>
          ) : (
            <div className="verdict">ตอบคำถามทุกข้อเพื่อรับคำแนะนำ</div>
          )}
          {outcome && <button className="btn btn-primary mt-12" style={{width:'100%',justifyContent:'center'}} onClick={handleSubmit} disabled={!form.motherName}><Icon name="check"/>สร้างเคสและเริ่มเฝ้าระวัง</button>}
          {outcome && !form.motherName && <div style={{fontSize:11,color:'var(--red)',textAlign:'center',marginTop:6}}>กรอกชื่อมารดาก่อน</div>}
          <div className="card muted mt-14" style={{fontSize:11,color:'var(--text-3)'}}>อ้างอิง: SOO EOS · KCMH NICU (GA ≥ 34 wk)</div>
        </div>
      </div>
    </div>
  );
}

function PEForm({ patient: p, vitals, onSave, onClose, session }) {
  const tp = nextTP(p.hn, vitals) || '44 hr';
  const isABX = EOS.ABX_TPS.has(tp);
  const [v, setV] = useState({ wellbeing:'yes', skin:'Rosy', T:'', P:'', R:'', SpO2:'', BP:'', rd:[], management:'', crp:'', wbc:'', anc:'', itRatio:'', cultureStatus:'not_sent' });
  const upd = (k,val) => setV(s=>({...s,[k]:val}));
  const toggleRD = key => setV(s=>({...s,rd:s.rd.includes(key)?s.rd.filter(x=>x!==key):[...s.rd,key]}));
  const issues = useMemo(() => evalVitals({...v,T:v.T===''?null:+v.T,P:v.P===''?null:+v.P,R:v.R===''?null:+v.R,SpO2:v.SpO2===''?null:+v.SpO2}), [v]);
  const hasRed = issues.some(i=>i.sev==='red');

  const handleSave = () => {
    const entry = { hn:p.hn, ageHr:tp, ts:EOS.nowISO(), wellbeing:v.wellbeing, skin:v.skin, T:v.T===''?null:+v.T, P:v.P===''?null:+v.P, R:v.R===''?null:+v.R, SpO2:v.SpO2===''?null:+v.SpO2, BP:v.BP, rd:v.rd, staff:session.name, management:v.management, crp:v.crp===''?null:+v.crp, wbc:v.wbc===''?null:+v.wbc, anc:v.anc===''?null:+v.anc, itRatio:v.itRatio===''?null:+v.itRatio, cultureStatus:v.cultureStatus, abxApproved:false, synced:false };
    if (hasRed) EOS.auditLog('ABNORMAL_VITALS',`HN:${EOS.maskHn(p.hn)} ${tp}`);
    else EOS.auditLog('VITALS_SAVE',`HN:${EOS.maskHn(p.hn)} ${tp}`);
    onSave(entry); // syncRow handled in handleSavePE (App) — do NOT call here to avoid duplicate GAS posts
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:'min(700px,calc(100vw - 32px))'}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-12 mb-12">
          <div>
            <h3 style={{marginBottom:0}}>บันทึก Serial PE · <span className="mono">{tp}</span></h3>
            <div className="sub" style={{marginBottom:0}}>{p.name} · HN {p.hn} · อายุ <span className="mono">{ageHours(p)}</span> hr</div>
          </div>
          <button className="icon-btn" style={{marginLeft:'auto'}} onClick={onClose}><Icon name="x"/></button>
        </div>
        {isABX && <div className="banner amber mb-12"><Icon name="abx"/><div><div className="title">ABX Time-Out · {tp}</div>ตรวจสอบ clinical status + workup ก่อนตัดสินใจ ABX (โดยแพทย์)</div></div>}

        <div>
          <h3><span className="num">1</span>General wellbeing · Skin</h3>
          <div className="row-2 mt-8">
            <div><label className="lbl">Wellbeing</label><div className="chip-group mt-8"><button className={`chip ${v.wellbeing==='yes'?'active':''}`} onClick={()=>upd('wellbeing','yes')}>ปกติ · Yes</button><button className={`chip danger ${v.wellbeing==='no'?'active':''}`} onClick={()=>upd('wellbeing','no')}>ผิดปกติ · No</button></div></div>
            <div><label className="lbl">Skin color</label><div className="chip-group mt-8">{EOS.SKIN_OPTS.map(s=><button key={s} className={`chip ${s!=='Rosy'?'danger':''} ${v.skin===s?'active':''}`} onClick={()=>upd('skin',s)}>{s}</button>)}</div></div>
          </div>

          <h3 className="mt-16"><span className="num">2</span>Vital signs</h3>
          <div className="row-4">
            {[{k:'T',label:'Temp',unit:'°C',step:'0.1'},{k:'P',label:'Pulse',unit:'bpm',step:'1'},{k:'R',label:'Resp',unit:'/min',step:'1'},{k:'SpO2',label:'SpO₂',unit:'%',step:'1'}].map(({k,label,unit,step})=>{
              const flag=vitalFlag(k,v[k]); const r=EOS.RANGES[k];
              return (<div key={k}><label className="lbl">{label}</label><div className={`vital-input mt-8${flag?' flag':''}`}><input type="number" step={step} value={v[k]} onChange={e=>upd(k,e.target.value)} placeholder="—"/><span className="unit">{unit}</span></div><div className={`vital-range${flag?' flag':''}`}>{r.lo}–{r.hi}</div></div>);
            })}
          </div>
          <div className="row-2 mt-12"><div><label className="lbl">BP (mmHg)</label><div className="vital-input mt-8"><input value={v.BP} onChange={e=>upd('BP',e.target.value)} placeholder="60/40"/><span className="unit">mmHg</span></div></div></div>

          <h3 className="mt-16"><span className="num">3</span>Respiratory distress</h3>
          <div className="chip-group">{EOS.RD_OPTS.map(rd=><button key={rd} className={`chip danger ${v.rd.includes(rd)?'active':''}`} onClick={()=>toggleRD(rd)}>{rd}</button>)}</div>

          <h3 className="mt-16"><span className="num">4</span>Lab Results <span style={{fontWeight:400,fontSize:11,color:'var(--text-3)'}}>— optional</span></h3>
          <div className="row-2 mt-8">
            <div>
              <label className="lbl">CRP</label>
              <div className={`vital-input mt-8${v.crp&&+v.crp>=10?' flag':''}`}><input type="number" step="0.1" min="0" value={v.crp} onChange={e=>upd('crp',e.target.value)} placeholder="—"/><span className="unit">mg/L</span></div>
              <div className={`vital-range${v.crp&&+v.crp>=10?' flag':''}`}>Elevated: ≥ 10 mg/L</div>
            </div>
            <div>
              <label className="lbl">WBC</label>
              <div className={`vital-input mt-8${v.wbc&&(+v.wbc<5000||+v.wbc>30000)?' flag':''}`}><input type="number" step="100" min="0" value={v.wbc} onChange={e=>upd('wbc',e.target.value)} placeholder="—"/><span className="unit">/μL</span></div>
              <div className={`vital-range${v.wbc&&(+v.wbc<5000||+v.wbc>30000)?' flag':''}`}>Normal: 5,000–30,000</div>
            </div>
          </div>
          <div className="row-2 mt-8">
            <div>
              <label className="lbl">ANC (Absolute Neutrophil Count)</label>
              <div className={`vital-input mt-8${v.anc&&+v.anc<1000?' flag':''}`}><input type="number" step="100" min="0" value={v.anc} onChange={e=>upd('anc',e.target.value)} placeholder="—"/><span className="unit">/μL</span></div>
              <div className={`vital-range${v.anc&&+v.anc<1000?' flag':''}`}>Low: &lt; 1,000</div>
            </div>
            <div>
              <label className="lbl">I:T Ratio</label>
              <div className={`vital-input mt-8${v.itRatio&&+v.itRatio>=0.2?' flag':''}`}><input type="number" step="0.01" min="0" max="1" value={v.itRatio} onChange={e=>upd('itRatio',e.target.value)} placeholder="—"/><span className="unit">ratio</span></div>
              <div className={`vital-range${v.itRatio&&+v.itRatio>=0.2?' flag':''}`}>Elevated: ≥ 0.20</div>
            </div>
          </div>
          <div className="mt-8">
            <label className="lbl">Blood Culture</label>
            <div className="chip-group mt-8">
              {[{k:'not_sent',l:'ไม่ได้เจาะ'},{k:'pending',l:'Pending'},{k:'negative',l:'Negative'},{k:'positive',l:'Positive'}].map(o=>(
                <button key={o.k} className={`chip ${o.k==='positive'?'danger':o.k==='pending'?'warn':o.k==='negative'?'':''} ${v.cultureStatus===o.k?'active':''}`} onClick={()=>upd('cultureStatus',o.k)}>{o.l}</button>
              ))}
            </div>
          </div>

          <h3 className="mt-16"><span className="num">5</span>Management / Plan</h3>
          <div className="field"><textarea rows={2} value={v.management} onChange={e=>upd('management',e.target.value)} placeholder="บันทึกการรักษา / แผนการดูแล..."/></div>
        </div>

        {issues.length>0 && <div className={`banner ${hasRed?'red':'amber'} mt-16`}><Icon name="warn"/><div><div className="title">{hasRed?'พบความผิดปกติ':'ค่าผิดปกติเล็กน้อย'}</div><div style={{marginTop:4,fontSize:12}}>{issues.map((i,idx)=><span key={idx} style={{marginRight:8}}>· {i.k}: {i.txt}</span>)}</div>{hasRed&&<div style={{marginTop:6,fontWeight:600,fontSize:12}}>→ แนะนำให้แพทย์ประเมินทันที</div>}</div></div>}
        {issues.length===0&&(v.T||v.P||v.R)&&<div className="banner teal mt-16"><Icon name="check"/><div><div className="title">Vital signs อยู่ในเกณฑ์ปกติ</div></div></div>}

        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>ยกเลิก</button>
          <button className="btn btn-primary" onClick={handleSave}><Icon name="signature"/>บันทึก Serial PE</button>
        </div>
      </div>
    </div>
  );
}

// CALCULATOR
// ══════════════════════════════════════════════════

function Calculator() {
  const { useState, useMemo } = React;
  const [ver,  setVer]  = useState('2024');
  const [unit, setUnit] = useState('C'); // temp unit
  const [p, setP] = useState({
    gaWeeks:39, gaDays:0,
    romHours:12,
    maternalTempC:37.0,
    gbsStatus:'unk',
    iapType:'none',
    incidence:0.5,
  });
  const [showGuide, setShowGuide] = useState(false);

  const upd = (k,v) => setP(s=>({...s,[k]:v}));

  // °F ↔ °C conversion helpers
  const toC = f => Math.round((f - 32) / 1.8 * 10) / 10;
  const toF = c => Math.round((c * 1.8 + 32) * 10) / 10;
  const dispTemp = p.maternalTempC;
  const dispTempF = toF(dispTemp);

  // Calculate on demand — not auto
  const [result, setResult] = useState(null);
  const doCalculate = () => {
    const risk = calcEOSRisk({...p, version:ver});
    setResult({ risk, table: EOS.calcEOSTable(risk), cat: riskCategory(risk) });
    EOS.auditLog('EOS_CALC', `GA ${p.gaWeeks}w${p.gaDays}d GBS:${p.gbsStatus} IAP:${p.iapType} risk:${risk}`);
  };
  const doClear = () => setResult(null);

  const birthRisk = result?.risk ?? null;
  const table     = result?.table ?? null;
  const cat       = result?.cat   ?? null;

  const pct = Math.min(1, (birthRisk||0) / 5);
  const gc  = (birthRisk||0) >= 3 ? 'var(--red)' : (birthRisk||0) >= 1 ? 'var(--amber)' : 'var(--teal)';

  const IAP_OPTIONS = [
    { k:'broad_4plus', l:'Broad spectrum antibiotics > 4 hr before delivery' },
    { k:'broad_2to4',  l:'Broad spectrum antibiotics 2–3.9 hr before delivery' },
    { k:'gbs_2plus',   l:'GBS-specific antibiotics > 2 hr before delivery' },
    { k:'none',        l:'No antibiotics or any antibiotics < 2 hr before delivery' },
  ];

  const badgeColor = b => b==='red'?'var(--red)':b==='amber'?'var(--amber)':'var(--green)';

  return (
    <div className="panel">
      <div className="page-head">
        <div>
          <h1>EOS Risk Calculator</h1>
          <div className="sub">Kaiser Permanente Neonatal EOS Calculator — Updated 2024</div>
        </div>
      </div>

      {/* Version selector */}
      <div className="card mb-14" style={{padding:'14px 18px'}}>
        <div className="lbl mb-8">Calculator Version</div>
        <div style={{display:'flex',gap:20}}>
          {[{k:'2024',l:'Updated (2024) — Universal GBS Screening'},{k:'2017',l:'Original (2017) — No Universal GBS Screening'}].map(v=>(
            <label key={v.k} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'var(--text-2)',fontWeight:ver===v.k?700:400}}>
              <input type="radio" name="ver" checked={ver===v.k} onChange={()=>setVer(v.k)} style={{accentColor:'var(--teal)',width:16,height:16}}/>
              {v.l}
            </label>
          ))}
        </div>
      </div>

      <div className="calc-grid">
        {/* ── LEFT: Inputs ── */}
        <div className="card">
          <div className="card-head"><span className="card-title">Please enter details below</span></div>

          {/* Incidence */}
          <div className="field mt-8">
            <label className="lbl">Incidence of Early-Onset Sepsis (per 1,000 live births)</label>
            <div className="vital-input mt-6">
              <input type="number" step="0.1" min="0.1" max="10" value={p.incidence} onChange={e=>upd('incidence',+e.target.value)} className="mono"/>
              <span className="unit">/ 1,000</span>
            </div>
            <div className="vital-range">ค่าเฉลี่ย KCMH / KP reference: 0.5–0.8</div>
          </div>

          {/* GA */}
          <div className="field mt-12">
            <label className="lbl">Gestational Age</label>
            <div style={{display:'flex',gap:8,marginTop:6}}>
              <div className="vital-input" style={{flex:1}}><input type="number" min="34" max="43" value={p.gaWeeks} onChange={e=>upd('gaWeeks',+e.target.value)} className="mono"/><span className="unit">wk</span></div>
              <div className="vital-input" style={{flex:1}}><input type="number" min="0" max="6" value={p.gaDays} onChange={e=>upd('gaDays',+e.target.value)} className="mono"/><span className="unit">days</span></div>
            </div>
            <div className="vital-range">Protocol สำหรับ GA ≥ 34 สัปดาห์</div>
          </div>

          {/* Maternal temp + unit */}
          <div className="field mt-12">
            <label className="lbl">Highest Maternal Antepartum Temperature</label>
            <div style={{display:'flex',gap:8,marginTop:6,alignItems:'center'}}>
              <div className="vital-input" style={{flex:1}}>
                <input type="number" step="0.1"
                  value={unit==='C'?dispTemp:dispTempF}
                  onChange={e=>upd('maternalTempC', unit==='C'?+e.target.value:toC(+e.target.value))}
                  className="mono"/>
                <span className="unit">°{unit}</span>
              </div>
              <select className="input" style={{width:90}} value={unit} onChange={e=>setUnit(e.target.value)}>
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
              </select>
            </div>
            <div className="vital-range">
              {unit==='C'?`≥ 38.0°C = risk ↑  ·  F: ${dispTempF}°F`:`≥ 100.4°F = risk ↑  ·  C: ${dispTemp}°C`}
            </div>
          </div>

          {/* ROM */}
          <div className="field mt-12">
            <label className="lbl">Rupture of Membranes (ROM)</label>
            <div className="vital-input mt-6"><input type="number" min="0" value={p.romHours} onChange={e=>upd('romHours',+e.target.value)} className="mono"/><span className="unit">hours</span></div>
            <div className="vital-range">≥ 18 hr = prolonged ROM</div>
          </div>

          {/* GBS */}
          <div className="field mt-12">
            <label className="lbl">Maternal GBS Status</label>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:8}}>
              {[{k:'neg',l:'Negative'},{k:'pos',l:'Positive'},{k:'unk',l:'Unknown'}].map(o=>(
                <label key={o.k} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'var(--text-2)'}}>
                  <input type="radio" name="gbs" checked={p.gbsStatus===o.k} onChange={()=>upd('gbsStatus',o.k)} style={{accentColor:'var(--teal)',width:15,height:15}}/>
                  {o.l}
                </label>
              ))}
            </div>
          </div>

          {/* IAP */}
          <div className="field mt-12">
            <label className="lbl">Type of Intrapartum Antibiotics</label>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:8}}>
              {IAP_OPTIONS.map(o=>(
                <label key={o.k} style={{display:'flex',alignItems:'flex-start',gap:8,cursor:'pointer',fontSize:13,color:'var(--text-2)',lineHeight:1.4}}>
                  <input type="radio" name="iap" checked={p.iapType===o.k} onChange={()=>upd('iapType',o.k)} style={{accentColor:'var(--teal)',width:15,height:15,marginTop:2,flexShrink:0}}/>
                  {o.l}
                </label>
              ))}
            </div>
          </div>

          {/* Calculate / Clear — bottom of inputs card */}
          <div style={{display:'flex',gap:10,marginTop:20,paddingTop:16,borderTop:'1px solid var(--border)'}}>
            <button className="btn btn-primary" style={{flex:1,justifyContent:'center',fontSize:15,minHeight:52}} onClick={doCalculate}>
              <Icon name="calc"/>Calculate »
            </button>
            <button className="btn btn-ghost" style={{minHeight:52,minWidth:80}} onClick={doClear}>Clear</button>

function AlertsLog({ patients, vitals, onOpenPatient }) {
  const items = useMemo(() => {
    const list = [];
    patients.forEach(p => {
      vitalsFor(p.hn, vitals).forEach(v => {
        const issues = evalVitals(v);
        const red = issues.filter(i=>i.sev==='red');
        if (red.length) list.push({kind:'red',p,v,msg:'พบผิดปกติที่ '+v.ageHr+' — '+red.map(i=>i.k+' '+i.txt).join(', ')});
        else { const amb=issues.filter(i=>i.sev==='amber'); if(amb.length) list.push({kind:'amber',p,v,msg:'ผิดปกติเล็กน้อย '+v.ageHr+' — '+amb.map(i=>i.k+' '+i.txt).join(', ')}); }
      });
      const st=tpStatus(p,vitals);
      if(st.cat==='overdue'&&st.dueIn!=null&&st.dueIn<0) list.push({kind:'amber',p,v:{ts:new Date(Date.now()-Math.abs(st.dueIn)*3600000).toISOString()},msg:`เลยกำหนดตรวจ ${st.tp}`});
    });
    return list.sort((a,b)=>new Date(b.v.ts)-new Date(a.v.ts));
  }, [patients, vitals]);
  return (
    <div className="panel">
      <div className="page-head"><div><h1>Alerts Log</h1><div className="sub">การแจ้งเตือนทั้งหมด ({items.length} รายการ)</div></div></div>
      <div className="card" style={{padding:0}}>
        {items.length===0?<div className="muted center" style={{padding:40}}>ยังไม่มีการแจ้งเตือน ✓</div>:items.map((it,idx)=>(
          <div key={idx} className={`alert-row ${it.kind}`}>
            <div className="ico"><Icon name={it.kind==='red'?'warn':'clock'}/></div>
            <div className="body"><div className="title">{it.p.name} · <span className="muted mono">{it.p.bed||it.p.hn}</span></div><div className="desc">{it.msg}</div></div>
            <div className="when">{fmtRelative(it.v.ts)}</div>
            <button className="btn btn-ghost btn-xs" onClick={()=>onOpenPatient(it.p.hn)}>เปิด →</button>
          </div>
        ))}
      </div>
    </div>
  );
}

const ABX_REASONS = [
  {k:'culture_negative',  l:'Blood culture negative — safe to stop'},
  {k:'culture_pending',   l:'Culture pending — clinically stable'},
  {k:'clinical_improved', l:'Clinical improvement — de-escalate'},
  {k:'clinical_worsen',   l:'Clinical deterioration — continue ABX'},
  {k:'risk_high',         l:'High EOS risk score — continue prophylactic'},
  {k:'course_complete',   l:'Completed ≥ 48hr empirical course'},
  {k:'other',             l:'Other (see Management plan)'},
];

function ABXApproval({ patients, vitals, onApprove, session }) {
  const { useState } = React;
  const [reasons, setReasons] = useState({});
  const rc = EOS.ROLE_CFG[session.role];

  if (!rc.canApproveAbx) return (
    <div className="panel">
      <div className="page-head"><div><h1>ABX Approval</h1></div></div>
      <div className="card" style={{textAlign:'center',padding:'56px 20px'}}>
        <Icon name="lock" size={48} style={{opacity:.2,marginBottom:14}}/>
        <div style={{fontSize:17,fontWeight:600,marginBottom:6}}>เฉพาะแพทย์เท่านั้น</div>
        <div style={{color:'var(--text-3)',fontSize:13}}>การอนุมัติหยุด/ต่อ Antibiotic สงวนสำหรับแพทย์ผู้รับผิดชอบ</div>
      </div>
    </div>
  );

  const pending = vitals.filter(v=>EOS.ABX_TPS.has(v.ageHr)&&!v.abxApproved);
  const pMap = Object.fromEntries(patients.map(p=>[p.hn,p]));
  return (
    <div className="panel">
      <div className="page-head"><div><h1>ABX Time-Out Approval</h1><div className="sub">รายการรอการอนุมัติ · เฉพาะแพทย์</div></div></div>
      {pending.length===0 ? (
        <div className="card"><div className="muted center" style={{padding:40}}>ไม่มีรายการรอการอนุมัติ ✓</div></div>
      ) : pending.map(v => {
        const pt = pMap[v.hn], issues = evalVitals(v), hasRed = issues.some(i=>i.sev==='red');
        const selectedReason = reasons[v.ts] || '';
        return (
          <div key={v.ts} className="card mb-12" style={{border:'2px solid #7c3aed',background:'linear-gradient(135deg,#f5f3ff,#fff)'}}>
            <div className="card-head">
              <Icon name="abx" size={20} style={{color:'#7c3aed'}}/>
              <strong style={{color:'#7c3aed'}}>ABX Time-Out — {v.ageHr}</strong>
              <span className="badge badge-navy" style={{marginLeft:'auto'}}>{v.hn}</span>
              {pt && <span style={{marginLeft:8,fontSize:12,color:'var(--text-3)'}}>{pt.name}</span>}
            </div>
            <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>
              ตรวจโดย: {v.staff} · {fmtDateTime(v.ts)}<br/>
              T: {v.T??'—'} · HR: {v.P??'—'} · RR: {v.R??'—'} · SpO₂: {v.SpO2??'—'}% · Skin: {v.skin||'—'}<br/>
              Status: {hasRed
                ? <span style={{color:'var(--red)',fontWeight:600}}>❌ ผิดปกติ</span>
                : <span style={{color:'var(--teal)',fontWeight:600}}>✅ ปกติ</span>}
              {v.management && <><br/>Plan: {v.management}</>}
              {/* Lab results if present */}
              {(v.crp||v.cultureStatus==='negative'||v.cultureStatus==='positive') && (
                <div style={{marginTop:4,display:'flex',gap:8,flexWrap:'wrap'}}>
                  {v.crp!=null && <span className={`badge badge-${+v.crp>=10?'red':'grey'}`}>CRP {v.crp} mg/L</span>}
                  {v.cultureStatus && v.cultureStatus!=='not_sent' && <span className={`badge badge-${v.cultureStatus==='positive'?'red':v.cultureStatus==='negative'?'green':'amber'}`}>Culture: {v.cultureStatus}</span>}
                </div>
              )}
            </div>

            {/* Override Reason — required */}
            <div className="field mt-12">
              <label className="lbl" style={{color:'#7c3aed'}}>Clinical Reason for Decision <span style={{color:'var(--red)'}}>*</span></label>
              <select className="input mt-6" value={selectedReason}
                onChange={e=>setReasons(r=>({...r,[v.ts]:e.target.value}))}
                style={{borderColor:selectedReason?'#7c3aed':'var(--border-2)'}}>
                <option value="">เลือกเหตุผล (required)...</option>
                {ABX_REASONS.map(o=><option key={o.k} value={o.k}>{o.l}</option>)}
              </select>
            </div>

            <div style={{display:'flex',gap:10,marginTop:12}}>
              <button className="btn btn-danger btn-sm" disabled={!selectedReason}
                onClick={()=>onApprove(v.ts,'stop',pt?.name||v.hn,selectedReason)}>

              <button className="btn btn-ghost btn-sm" disabled={!selectedReason}

              {!selectedReason && <span style={{fontSize:11,color:'var(--text-3)',alignSelf:'center'}}>เลือกเหตุผลก่อน</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// QUALITY METRICS
// ══════════════════════════════════════════════════

function QualityMetrics({ patients, vitals }) {
  const { useMemo } = React;

  const m = useMemo(() => {
    const active    = patients.filter(p=>!p.archived);
    const archived  = patients.filter(p=>p.archived);
    const total     = patients.length;

    // Serial PE completion (all 7 TPs done)
    const completed = patients.filter(p => {
      const done = new Set(vitalsFor(p.hn, vitals).map(v=>v.ageHr));
      return TIMEPOINTS.every(tp=>done.has(tp));
    }).length;

    // ABX decisions
    const abxEntries = vitals.filter(v=>v.abxApproved);
    const abxStopped = abxEntries.filter(v=>v.abxDecision==='stop').length;
    const abxContinued = abxEntries.filter(v=>v.abxDecision==='continue').length;

    // Override reasons breakdown
    const reasonCounts = {};
    abxEntries.forEach(v => {
      if (v.abxReason) reasonCounts[v.abxReason] = (reasonCounts[v.abxReason]||0)+1;
    });

    // Culture sent rate
    const allPE = vitals.length;
    const cultureEntries = vitals.filter(v=>v.cultureStatus&&v.cultureStatus!=='not_sent');
    const culturePos = vitals.filter(v=>v.cultureStatus==='positive').length;

    // Abnormal PE rate (alert ratio)
    const redPE   = vitals.filter(v=>evalVitals(v).some(i=>i.sev==='red')).length;
    const amberPE = vitals.filter(v=>evalVitals(v).some(i=>i.sev==='amber')).length;

    // Time to first PE (hours from DOB to first vitals)
    const firstPETimes = patients.map(p => {
      const first = vitalsFor(p.hn, vitals)[0];
      if (!first) return null;
      return (new Date(first.ts)-new Date(p.dob))/3600000;
    }).filter(t=>t!==null&&t>0&&t<72);
    const avgFirstPE = firstPETimes.length
      ? Math.round(firstPETimes.reduce((a,b)=>a+b,0)/firstPETimes.length*10)/10
      : null;

    return { total, active:active.length, archived:archived.length,
      completed, completionPct: total ? Math.round(completed/total*100) : 0,
      abxStopped, abxContinued, abxTotal:abxEntries.length,
      reasonCounts, allPE, cultureEntries:cultureEntries.length,
      culturePct: allPE ? Math.round(cultureEntries.length/allPE*100) : 0,
      culturePos, redPE, amberPE,
      redPct: allPE ? Math.round(redPE/allPE*100) : 0,
      avgFirstPE };
  }, [patients, vitals]);

  const Stat = ({label, value, sub, color}) => (
    <div className="stat" style={{borderLeft:`4px solid ${color||'var(--teal)'}`}}>
      <div className="lbl">{label}</div>
      <div className="val" style={{color:color||'var(--text)'}}>{value}</div>
      {sub && <div className="trend">{sub}</div>}
    </div>
  );

  const ABX_REASON_LABELS = {
    culture_negative:'Culture negative', culture_pending:'Culture pending',
    clinical_improved:'Clinical improvement', clinical_worsen:'Clinical deterioration',
    risk_high:'High risk score', course_complete:'Completed course', other:'Other',
  };

  return (
    <div className="panel">
      <div className="page-head">
        <div><h1>Quality Metrics</h1><div className="sub">EOS Smart Alert — ข้อมูลสรุปคุณภาพการดูแล</div></div>
      </div>

      {/* Overview stats */}
      <div className="stat-grid mb-14">
        <Stat label="Patients Enrolled"  value={m.total}           sub={`${m.active} active · ${m.archived} discharged`} color="var(--teal)"/>
        <Stat label="Serial PE Complete" value={`${m.completed}/${m.total}`}  sub={`${m.completionPct}% completion rate`} color="var(--green)"/>
        <Stat label="Serial PE Records"  value={m.allPE}           sub={`${m.redPct}% abnormal (red alert)`} color="var(--text)"/>
        <Stat label="Avg Time to 1st PE" value={m.avgFirstPE ? m.avgFirstPE+'hr' : '—'} sub="from birth" color="var(--amber)"/>
      </div>

      <div className="row-2 mb-14">
        {/* ABX Decisions */}
        <div className="card">
          <div className="card-head"><span className="card-title">ABX Time-Out Decisions</span></div>
          <div style={{display:'flex',gap:16,marginTop:12}}>
            <div style={{textAlign:'center',flex:1}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--red)',fontFamily:'IBM Plex Mono'}}>{m.abxStopped}</div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:4}}>🛑 หยุด ABX</div>

            <div style={{width:1,background:'var(--border)'}}/>
            <div style={{textAlign:'center',flex:1}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--teal)',fontFamily:'IBM Plex Mono'}}>{m.abxContinued}</div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:4}}>▶️ ต่อ ABX</div>
            </div>
            <div style={{width:1,background:'var(--border)'}}/>
            <div style={{textAlign:'center',flex:1}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--text)',fontFamily:'IBM Plex Mono'}}>{m.abxTotal}</div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:4}}>Total decisions</div>
            </div>
          </div>
          {/* Reason breakdown */}
          {Object.keys(m.reasonCounts).length > 0 && (
            <div style={{marginTop:14,paddingTop:12,borderTop:'1px dashed var(--border)'}}>
              <div className="lbl mb-8">Override Reasons</div>
              {Object.entries(m.reasonCounts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',color:'var(--text-2)'}}>
                  <span>{ABX_REASON_LABELS[k]||k}</span>

        {/* Lab & Alerts */}
        <div className="card">

          <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:14}}>

              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>

                <span style={{fontWeight:700,fontFamily:'IBM Plex Mono',fontSize:14}}>{m.culturePct}%</span>
              </div>
              <div style={{height:6,background:'var(--surface-3)',borderRadius:3}}>
                <div style={{height:'100%',width:`${m.culturePct}%`,background:'var(--teal)',borderRadius:3,transition:'width .4s'}}/>
              </div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{m.cultureEntries} / {m.allPE} PE records · {m.culturePos} positive</div>
            </div>

            <div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:13,color:'var(--text-2)'}}>Abnormal vitals (red)</span>
                <span style={{fontWeight:700,fontFamily:'IBM Plex Mono',fontSize:14,color:'var(--red)'}}>{m.redPct}%</span>
              </div>
              <div style={{height:6,background:'var(--surface-3)',borderRadius:3}}>
                <div style={{height:'100%',width:`${m.redPct}%`,background:'var(--red)',borderRadius:3}}/>
              </div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{m.redPE} red · {m.amberPE} amber / {m.allPE} total PE</div>
            </div>

            <div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:13,color:'var(--text-2)'}}>PE completion rate</span>
                <span style={{fontWeight:700,fontFamily:'IBM Plex Mono',fontSize:14,color:'var(--green)'}}>{m.completionPct}%</span>
              </div>
              <div style={{height:6,background:'var(--surface-3)',borderRadius:3}}>
                <div style={{height:'100%',width:`${m.completionPct}%`,background:'var(--green)',borderRadius:3}}/>
              </div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{m.completed} / {m.total} patients completed all 7 timepoints</div>
            </div>
          </div>
        </div>
      </div>

      <div className="card" style={{fontSize:12,color:'var(--text-3)',textAlign:'center',padding:'10px 16px'}}>
        Based on {m.total} patients · {m.allPE} PE records · Local data only — sync to GAS for cross-session persistence
      </div>
    </div>
  );
}

function AllRecords({ patients, vitals }) {
  const [tab, setTab] = useState('vitals');
  const exportCSV = () => {
    const hdrs=['ts','hn_masked','ageHr','T','P','R','SpO2','BP','skin','rd','wellbeing','management','abxApproved','abxDecision','staff'];
    const rows=[...vitals].reverse().map(r=>hdrs.map(h=>{
      if (h==='hn_masked') return `"${EOS.maskHn(r.hn)}"`;
      if (h==='rd') return `"${(r.rd||[]).join('|')}"`;
      if (h==='abxApproved') return `"${r.abxApproved?'yes':'no'}"`;
      return `"${String(r[h]??'').replace(/"/g,'""')}"`;
    }).join(','));
    const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent([hdrs.join(','),...rows].join('\n'));
    a.download=`EOS_${new Date().toISOString().slice(0,10)}.csv`; a.click(); EOS.auditLog('EXPORT_CSV','');
  };
  return (
    <div className="panel">
      <div className="page-head"><div><h1>All Records</h1></div><div className="right"><button className="btn btn-ghost btn-sm" onClick={exportCSV}><Icon name="download"/>Export CSV</button></div></div>
      <div className="seg mb-14"><button className={tab==='vitals'?'active':''} onClick={()=>setTab('vitals')}>Serial PE ({vitals.length})</button><button className={tab==='patients'?'active':''} onClick={()=>setTab('patients')}>Triage ({patients.length})</button></div>
      <div className="card" style={{padding:0,overflow:'auto'}}>
        {tab==='vitals'&&<table className="eos" style={{minWidth:700}}><thead><tr><th>เวลา</th><th>HN</th><th>Timepoint</th><th>T</th><th>HR</th><th>RR</th><th>Skin</th><th>Status</th><th>Staff</th></tr></thead><tbody>{[...vitals].reverse().map((r,i)=>{const hasRed=evalVitals(r).some(x=>x.sev==='red');return(<tr key={i} style={hasRed?{background:'#fef2f2'}:{}}><td className="mono">{fmtDateTime(r.ts)}</td><td className="mono">{EOS.maskHn(r.hn)}</td><td>{r.ageHr}{EOS.ABX_TPS.has(r.ageHr)&&<span className="badge badge-navy" style={{marginLeft:4,fontSize:9}}>ABX</span>}</td><td className="mono" style={{color:vitalFlag('T',r.T)?'var(--red)':'inherit'}}>{r.T??'—'}</td><td className="mono" style={{color:vitalFlag('P',r.P)?'var(--red)':'inherit'}}>{r.P??'—'}</td><td className="mono" style={{color:vitalFlag('R',r.R)?'var(--red)':'inherit'}}>{r.R??'—'}</td><td style={{color:r.skin&&r.skin!=='Rosy'?'var(--red)':'inherit'}}>{r.skin||'—'}</td><td>{hasRed?<span className="badge badge-red">ผิดปกติ</span>:<span className="badge badge-green">ปกติ</span>}</td><td>{r.staff||'—'}</td></tr>);})}</tbody></table>}
        {tab==='patients'&&<table className="eos"><thead><tr><th>เวลา</th><th>HN</th><th>ชื่อ</th><th>GA</th><th>ผลประเมิน</th><th>Staff</th></tr></thead><tbody>{[...patients].reverse().map((p,i)=><tr key={i} style={p.archived?{opacity:.5}:{}}><td className="mono">{fmtDateTime(p.ts)}</td><td className="mono">{EOS.maskHn(p.hn)}</td><td>{p.name}</td><td className="mono">{p.ga} wk</td><td><span className={`badge badge-${p.triageOutcome==='workup'?'red':p.triageOutcome==='serialPE'?'amber':'green'}`}>{p.triageOutcome}</span></td><td>{p.staff||'—'}</td></tr>)}</tbody></table>}
      </div>
    </div>
  );
}

function Config({ session, patients, vitals }) {
  const [url, setUrl] = useState(()=>EOS.getCfg().url||EOS.DEFAULT_WEBHOOK);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState('');
  const save = () => { EOS.setCfg({url}); EOS.auditLog('CONFIG_SAVE','Webhook URL updated'); setResult({ok:true,msg:'✅ บันทึก URL สำเร็จ'}); };
  const test = async () => { setBusy('test'); setResult(null); try { const r=await EOS.fetchT(url.trim(),{method:'GET'},6000); setResult({ok:r.ok,msg:r.ok?'✅ GAS Online':`⚠️ Status ${r.status}`}); } catch(e){setResult({ok:false,msg:`❌ ${e.message}`});} setBusy(''); };
  const syncAll = async () => {
    setBusy('sync'); setResult(null);
    const pend=[...patients.filter(p=>!p.synced).map(p=>({s:'Triage',r:p})),...vitals.filter(v=>!v.synced).map(v=>({s:'SerialPE',r:v}))];
    if(!pend.length){setResult({ok:true,msg:'✅ ข้อมูลทุกรายการ Sync แล้ว'});setBusy('');return;}
    const res=await Promise.allSettled(pend.map(p=>EOS.syncRow(p.s,p.r)));
    const n=res.filter(r=>r.status==='fulfilled'&&r.value).length;
    setResult({ok:n===pend.length,msg:`☁️ Sync ${n}/${pend.length}`}); setBusy('');
  };
  return (
    <div className="panel">
      <div className="page-head"><div><h1>Config</h1><div className="sub">GAS Webhook + Data Sync</div></div></div>
      <div className="card mb-14">
        <div className="card-head"><span className="card-title">Google Apps Script Webhook</span></div>
        <div className="field mb-12"><label>Webhook URL</label><input value={url} onChange={e=>setUrl(e.target.value)} className="mono" style={{fontSize:12}}/></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-primary" onClick={save}><Icon name="check"/>บันทึก URL</button>
          <button className="btn btn-ghost" onClick={test} disabled={!!busy}>{busy==='test'?'กำลังทดสอบ…':'ทดสอบ Connection'}</button>
          <button className="btn btn-ghost" onClick={syncAll} disabled={!!busy}><Icon name="refresh"/>{busy==='sync'?'กำลัง Sync…':'Sync All Pending'}</button>
        </div>
        {result&&<div className={`banner ${result.ok?'teal':'red'} mt-12`}>{result.msg}</div>}
      </div>
      <div className="card">
        <div className="card-head"><span className="card-title">ข้อมูลระบบ</span></div>
        <div className="kv">
          <div className="k">Version</div><div className="v mono">v3.0 React Edition</div>
          <div className="k">ผู้ใช้ปัจจุบัน</div><div className="v">{session.name} · {EOS.ROLE_CFG[session.role].label}</div>
          <div className="k">เข้าสู่ระบบเมื่อ</div><div className="v mono">{fmtDateTime(session.loginAt)}</div>
          <div className="k">Patients (local)</div><div className="v mono">{patients.length} รายการ</div>
          <div className="k">Vitals (local)</div><div className="v mono">{vitals.length} รายการ</div>
          <div className="k">รอ Sync</div><div className="v mono">{patients.filter(p=>!p.synced).length+vitals.filter(v=>!v.synced).length} รายการ</div>
        </div>
      </div>
    </div>
  );
}

function UserManagement({ session }) {
  const rc = EOS.ROLE_CFG[session.role];
  const [users, setUsers] = useState(()=>EOS.getUsers());
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({email:'',name:'',role:'nurse'});
  const upd = (k,v) => setForm(f=>({...f,[k]:v}));
  if (!rc.canManageUsers) return (
    <div className="panel"><div className="page-head"><div><h1>จัดการผู้ใช้</h1></div></div><div className="card" style={{textAlign:'center',padding:'56px 20px'}}><Icon name="lock" size={48} style={{opacity:.2,marginBottom:14}}/><div style={{fontSize:17,fontWeight:600}}>เฉพาะ Admin เท่านั้น</div></div></div>
  );
  const openAdd = () => { setForm({email:'',name:'',role:'nurse'}); setModal('add'); };
  const openEdit = email => { const u=users[email]; setForm({email,name:u.name,role:u.role}); setModal(email); };
  const save = () => {
    if(!form.email||!form.name) return;
    const db={...users,[form.email.toLowerCase()]:{name:form.name,role:form.role}};
    EOS.saveUsers(db); setUsers(db); EOS.auditLog('USER_SAVE',form.email); setModal(null);
  };
  const del = email => {
    if(!confirm(`ลบ ${email}?`)) return;
    const db={...users}; delete db[email];
    EOS.saveUsers(db); setUsers(db); EOS.auditLog('USER_DELETE',email);
  };
  return (
    <div className="panel">
      <div className="page-head"><div><h1>จัดการผู้ใช้</h1><div className="sub">{Object.keys(users).length} บัญชี</div></div><div className="right"><button className="btn btn-primary btn-sm" onClick={openAdd}><Icon name="plus"/>เพิ่มผู้ใช้</button></div></div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <table className="eos"><thead><tr><th>Role</th><th>ชื่อ</th><th>Email</th><th></th></tr></thead>
        <tbody>{Object.entries(users).map(([email,u])=>{const r=EOS.ROLE_CFG[u.role]||{};return(
          <tr key={email}><td><span style={{padding:'3px 10px',borderRadius:999,fontSize:11,fontWeight:700,background:r.bg,color:r.color}}>{r.icon} {r.label}</span></td>
          <td style={{fontWeight:600}}>{u.name}{email===session.email&&<span style={{marginLeft:6,fontSize:10,padding:'2px 8px',borderRadius:999,background:'#e6f3f1',color:'var(--teal-2)'}}>คุณ</span>}</td>
          <td className="mono" style={{fontSize:12}}>{email}</td>
          <td style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost btn-xs" onClick={()=>openEdit(email)}>แก้ไข</button>
            {email!==session.email&&<button className="btn btn-xs" style={{background:'#fee2e2',color:'var(--red-2)',border:'1px solid var(--red)'}} onClick={()=>del(email)}>ลบ</button>}
          </td></tr>);})}</tbody></table>
      </div>
      {modal&&(
        <div className="modal-backdrop" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>{modal==='add'?'เพิ่มผู้ใช้':'แก้ไขผู้ใช้'}</h3>
            <div className="sub">ต้องใช้ Google Account ที่ลงทะเบียนใน EOS Smart Alert</div>
            <div className="field mb-12"><label>Email</label><input type="email" value={form.email} onChange={e=>upd('email',e.target.value)} disabled={modal!=='add'} placeholder="name@gmail.com"/></div>
            <div className="field mb-12"><label>ชื่อ-นามสกุล</label><input value={form.name} onChange={e=>upd('name',e.target.value)} placeholder="พ.ชื่อ / พย.ชื่อ"/></div>
            <div className="field mb-12"><label>Role</label>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:8}}>
                {Object.entries(EOS.ROLE_CFG).map(([k,r])=>(
                  <div key={k} onClick={()=>upd('role',k)} style={{padding:'10px 8px',border:`1.5px solid ${form.role===k?'var(--teal)':'var(--border-2)'}`,borderRadius:8,textAlign:'center',background:form.role===k?'var(--teal-tint)':'var(--surface)',cursor:'pointer',transition:'all .12s'}}>
                    <div style={{fontSize:20}}>{r.icon}</div><div style={{fontWeight:700,fontSize:12,marginTop:3}}>{r.label}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="modal-foot"><button className="btn btn-ghost" onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-primary" onClick={save} disabled={!form.email||!form.name}>บันทึก</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

  { key:'schedule',  icon:'calendar', label:'Schedule',        section:'รายงาน',   roles:['doctor','nurse','admin'] },
  { key:'abx',       icon:'abx',      label:'ABX Approval',    section:'รายงาน',   roles:['doctor','admin'] },
  { key:'records',   icon:'list',     label:'All Records',     section:'ระบบ',     roles:['doctor','nurse','admin'] },
  { key:'metrics',   icon:'chart',    label:'Quality Metrics', section:'ระบบ',     roles:['doctor','admin'] },
  { key:'audit',     icon:'eye',      label:'Audit Log',       section:'ระบบ',     roles:['admin'] },
  { key:'config',    icon:'cog',      label:'Config',          section:'ระบบ',     roles:['admin'] },
  { key:'users',     icon:'users',    label:'จัดการผู้ใช้',     section:'ระบบ',     roles:['admin'] },
];

const VIEW_TITLES = {
  dashboard:'Ward Board', patients:'Patients', triage:'Triage', calc:'EOS Calculator',
  handoff:'Handoff Summary', alerts:'Alerts Log', schedule:'Schedule', abx:'ABX Approval',
  records:'All Records', metrics:'Quality Metrics', audit:'Audit Log', config:'Config', users:'จัดการผู้ใช้',
  patient:'Patient Detail',
};

// ── MAIN APP ─────────────────────────────────────
function App() {
  const { useState, useEffect } = React;

  // ── State ─────────────────────────────────────
  // เริ่มต้นด้วย null เสมอ — บังคับ login ทุกครั้งที่โหลดหน้า
  const [session, setSession]   = useState(null);
  const [view,    setView]      = useState('dashboard');
  const [openHn,  setOpenHn]    = useState(null);
  const [patients, setPatients] = useState(() => { EOS.seedDemoData(); return EOS.getStore(EOS.STORE.patients, []); });
  const [vitals,   setVitals]   = useState(() => EOS.getStore(EOS.STORE.vitals, []));
  const [peTarget, setPeTarget] = useState(null);
  const [pinModal, setPinModal] = useState(null);   // {msg, resolve}
  const [, tick]          = useState(0);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [moreOpen,    setMoreOpen]    = useState(false); // mobile "More" drawer

  // ── Effects ───────────────────────────────────
  useEffect(() => { EOS.setStore(EOS.STORE.patients, patients); }, [patients]);
  useEffect(() => { EOS.setStore(EOS.STORE.vitals,   vitals);   }, [vitals]);

  // Auto-refresh ward board + session check every 30s
  useEffect(() => {
    const t = setInterval(() => {
      tick(x => x + 1);
      if (!EOS.getSession()) { setSession(null); }
    }, 30000);
    return () => clearInterval(t);
  }, []);

  // ── Not logged in ──────────────────────────────
  if (!session) {
    return <LoginScreen onLogin={sess => { setSession(sess); setView('dashboard'); }}/>;
  }

  const rc = EOS.ROLE_CFG[session.role];
  const currentPatient = openHn ? patients.find(p => p.hn === openHn) : null;

  // ── Handlers ──────────────────────────────────
  const goPatient = hn => { setOpenHn(hn); setView('patient'); };
  const doLogout  = () => {
    EOS.auditLog('LOGOUT', session.name);
    EOS.clearSession();
    // Clear patient PII from localStorage (Vera #3 — shared workstation protection)
    EOS.setStore(EOS.STORE.patients, []);
    EOS.setStore(EOS.STORE.vitals, []);
    // Reset Google Sign-In
    try { if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect(); } catch {}
    setSession(null);
  };

  const showPin = msg => new Promise(resolve => setPinModal({ msg, resolve }));

  const handleCreatePatient = p => {
    setPatients(arr => [p, ...arr]);
    EOS.syncRow('Triage', p);
    goPatient(p.hn);
  };

  const handleSavePE = entry => {
    setVitals(arr => [...arr, entry]);
    setPeTarget(null);
    EOS.syncRow('SerialPE', entry).then(ok => {
      if (ok) setVitals(arr => arr.map(v => v.ts === entry.ts ? {...v, synced:true} : v));
    });
  };

  const handleDischarge = async hn => {
    const txt = await showPin(`Discharge HN ${hn}?\nพิมพ์ "ยืนยัน" เพื่อยืนยัน`);
    setPinModal(null);
    if ((txt||'').trim() !== 'ยืนยัน') return alert('การยืนยันไม่ถูกต้อง');
    setPatients(arr => arr.map(p => p.hn===hn ? {...p, archived:true} : p));
    EOS.auditLog('DISCHARGE', `HN:${EOS.maskHn(hn)}`);
    setView('dashboard'); setOpenHn(null);
  };

  const handleApproveAbx = async (ts, decision, patientName, overrideReason='') => {
    const label = decision==='stop' ? 'หยุด Antibiotic' : 'ต่อ Antibiotic';
    const txt = await showPin(`${label}\n${patientName||''}\nพิมพ์ "ยืนยัน" เพื่อยืนยัน`);
    setPinModal(null);
    if ((txt||'').trim() !== 'ยืนยัน') return;
    const now = EOS.nowISO();
    setVitals(arr => arr.map(v => v.ts===ts ? {
      ...v, abxApproved:true, abxDecision:decision,
      abxBy:session.name, abxAt:now,
      abxReason: overrideReason,
      abxStartAt: decision==='continue' ? now : null,
    } : v));
    EOS.auditLog('ABX_DECISION', `${decision.toUpperCase()} by ${session.name} reason:${overrideReason} ts:${ts}`);
  };

  // ── Nav counts ────────────────────────────────
  let alertCount=0, dueCount=0;
  patients.forEach(p => {
    const st = tpStatus(p, vitals);
    if (st.cat==='overdue'||st.cat==='soon') dueCount++;
    vitalsFor(p.hn, vitals).forEach(v => { if (evalVitals(v).some(i=>i.sev==='red')) alertCount++; });
    if (EOS.evalTrend(p.hn, vitals).length > 0) alertCount++; // trend-based alert
  });
  const abxPending = vitals.filter(v => EOS.ABX_TPS.has(v.ageHr) && !v.abxApproved).length;

  // ── Alert ticker ──────────────────────────────
  const tickerItems = []; // {msg, hn}
  patients.forEach(p => {
    const last = vitalsFor(p.hn, vitals).slice(-1)[0];
    if (last && evalVitals(last).some(i=>i.sev==='red'))
      tickerItems.push({msg:`${p.name} · ${p.bed||p.hn} · ผิดปกติที่ ${last.ageHr}`, hn:p.hn});
    const trends = EOS.evalTrend(p.hn, vitals);
    if (trends.length) tickerItems.push({msg:`${p.bed||p.hn} · Trend: ${trends[0].txt}`, hn:p.hn});
    const st = tpStatus(p, vitals);
    if (st.cat==='overdue'&&!p.archived)
      tickerItems.push({msg:`${p.bed||p.hn} · เลยกำหนด ${st.tp}`, hn:p.hn});
  });
  const tickerMsgs = tickerItems.map(t=>t.msg); // backward compat for alertCount

  // ── Sidebar nav items (role-filtered) ─────────
  const navItems = NAV.filter(n => n.roles.includes(session.role));
  let lastSection = '';

  return (
    <div className="app-shell">
      {/* ─── MOBILE SIDEBAR OVERLAY ───────────── */}
      {sidebarOpen && (
        <div className="sidebar-overlay" onClick={()=>setSidebarOpen(false)}/>
      )}

      {/* ─── SIDEBAR ──────────────────────────── */}
      <aside className={`sidebar${sidebarOpen?' open':''}`}>
        <div className="sidebar-brand">
          <div className="brand-row">
            <div className="brand-mark">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6l-8-3z"/>
                <path d="M9 12h2v-2h2v2h2v2h-2v2h-2v-2H9z"/>
              </svg>
            </div>
            <div>
              <div className="brand-name">EOS Smart Alert</div>
              <div className="brand-sub">v3.0 · KCMH NICU</div>
            </div>
          </div>
          <div className="ward-chip">
            <span className="ward-dot"/>
            <div>
              <div className="label">WARD</div>
              <div className="val">NICU · จุฬาลงกรณ์</div>
            </div>
          </div>
        </div>

        <nav className="sidebar-nav">
          {navItems.map(n => {
            const showSection = n.section !== lastSection;
            lastSection = n.section;
            const isActive = view === n.key || (n.key==='dashboard' && view==='patient');
            const count = n.key==='alerts' ? alertCount : n.key==='abx' ? abxPending : n.key==='dashboard' ? dueCount : 0;
            return (
              <React.Fragment key={n.key}>
                {showSection && <div className="nav-section">{n.section}</div>}
                <button
                  className={`nav-item${isActive?' active':''}`}
                  onClick={() => { setView(n.key); if (n.key!=='patient') setOpenHn(null); setSidebarOpen(false); }}>
                  <Icon name={n.icon} size={17}/>
                  <span>{n.label}</span>
                  {count>0 && <span className={`nav-count ${n.key==='alerts'?'alert':n.key==='abx'?'warn':n.key==='dashboard'?'warn':''}`}>{count}</span>}
                </button>
              </React.Fragment>
            );
          })}
        </nav>

        <div className="sidebar-foot">
          <div className="avatar" style={{background:rc.bg, color:rc.color}}>{session.name.slice(0,2)}</div>
          <div className="info">
            <div className="name">{session.name}</div>
            <div className="role">{rc.icon} {rc.label}</div>
          </div>
          <button className="icon-btn" style={{color:'rgba(255,255,255,.5)'}} onClick={doLogout} title="ออกจากระบบ"><Icon name="logout"/></button>
        </div>
      </aside>

      {/* ─── MAIN ─────────────────────────────── */}
      <main className="main">
        {/* Alert ticker — clickable → go to patient or alerts */}
        {tickerItems.length>0 && (
          <div className="alert-ticker" style={{cursor:'pointer'}} onClick={()=>setView('alerts')}>
            <Icon name="warn" size={16}/>
            <span className="label">URGENT</span>
            <div className="messages">
              <span>{[...tickerItems,...tickerItems].map(t=>t.msg).join('  ·  ')}</span>
            </div>
            <span style={{flexShrink:0,fontSize:11,opacity:.8,paddingLeft:8,borderLeft:'1px solid rgba(255,255,255,.25)'}}>ดูทั้งหมด →</span>
          </div>
        )}

        {/* Topbar */}
        <header className="topbar">
          {/* Hamburger — mobile only */}
          <button className="hamburger-btn icon-btn" onClick={()=>setSidebarOpen(s=>!s)} title="Menu">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="2" y1="14" x2="16" y2="14"/>
            </svg>
          </button>
          <div className="topbar-title">
            {view==='patient'&&currentPatient ? (
              <><span className="breadcrumb">Patients /</span> {currentPatient.name}</>
            ) : (
              VIEW_TITLES[view]||'EOS Smart Alert'
            )}
          </div>
          <div className="topbar-right">
            <div className="live-clock">
              <span className="dot"/>
              LIVE · {new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}
            </div>
            <button className="icon-btn" onClick={()=>setView('alerts')} title="Alerts">
              <Icon name="bell"/>
              {alertCount>0 && <span className="badge-dot"/>}
            </button>
            <button className="icon-btn" onClick={()=>setView('config')} title="Config"><Icon name="cog"/></button>
          </div>
        </header>

        {/* Content */}
        <div className="content">
          <div className="content-inner">
            {view==='dashboard' && <Dashboard patients={patients} vitals={vitals} onOpenPatient={goPatient} onGo={setView}/>}
            {view==='patients'  && <PatientList patients={patients} vitals={vitals} onOpenPatient={goPatient}/>}
            {view==='triage'    && <Triage onCreated={handleCreatePatient} onCancel={()=>setView('dashboard')}/>}
            {view==='calc'      && <Calculator/>}
            {view==='alerts'    && <AlertsLog patients={patients} vitals={vitals} onOpenPatient={goPatient}/>}
            {view==='handoff'   && <HandoffSummary patients={patients} vitals={vitals}/>}
            {view==='schedule'  && <Schedule patients={patients} vitals={vitals} onOpenPatient={goPatient}/>}
            {view==='abx'       && <ABXApproval patients={patients} vitals={vitals} onApprove={handleApproveAbx} session={session}/>}
            {view==='records'   && <AllRecords patients={patients} vitals={vitals} session={session}/>}
            {view==='metrics'   && <QualityMetrics patients={patients} vitals={vitals}/>}
            {view==='audit'     && <AuditLog session={session}/>}
            {view==='config'    && <Config session={session} patients={patients} vitals={vitals}/>}
            {view==='users'     && <UserManagement session={session}/>}
            {view==='patient'   && currentPatient && (
              <PatientDetail
                patient={currentPatient} vitals={vitals}
                onBack={()=>setView('dashboard')}
                onAddPE={setPeTarget}
                onDischarge={handleDischarge}
                session={session}
              />
            )}
          </div>
        </div>
      </main>

      {/* PE Form Modal */}
      {peTarget && (
        <PEForm patient={peTarget} vitals={vitals} onSave={handleSavePE} onClose={()=>setPeTarget(null)} session={session}/>
      )}

      {/* Pin/Confirm Modal */}
      {pinModal && (
        <PinModal
          msg={pinModal.msg}
          onConfirm={txt => { pinModal.resolve(txt); setPinModal(null); }}
          onCancel={()  => { pinModal.resolve(null); setPinModal(null); }}
        />
      )}

      {/* ─── MOBILE BOTTOM TAB BAR ──────────────── */}
      <nav className="mobile-tab-bar">
        {[
          { key:'dashboard', icon:'board',    label:'Ward'    },
          { key:'patients',  icon:'patients', label:'Patients'},
          { key:'triage',    icon:'triage',   label:'Triage'  },
          { key:'alerts',    icon:'bell',     label:'Alerts'  },
        ].map(t => {
          if (!navItems.find(n=>n.key===t.key)) return null;
          const active = view===t.key||(t.key==='dashboard'&&view==='patient');
          const badge = t.key==='alerts' ? alertCount : 0;
          return (
            <button key={t.key}
              className={`mobile-tab${active?' active':''}`}
              onClick={()=>{ setView(t.key); setOpenHn(null); setMoreOpen(false); }}>
              <span className="mobile-tab-icon">
                <Icon name={t.icon} size={22}/>
                {badge>0 && <span className="mobile-tab-badge">{badge}</span>}
              </span>
              <span className="mobile-tab-label">{t.label}</span>
            </button>
          );
        })}
        {/* More button */}
        <button className={`mobile-tab${moreOpen?' active':''}`} onClick={()=>setMoreOpen(o=>!o)}>
          <span className="mobile-tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <span className="mobile-tab-label">More</span>
        </button>
      </nav>

      {/* ─── MOBILE MORE DRAWER ─────────────────── */}
      {moreOpen && (
        <div className="mobile-more-backdrop" onClick={()=>setMoreOpen(false)}>
          <div className="mobile-more-sheet" onClick={e=>e.stopPropagation()}>
            <div className="mobile-more-handle"/>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text-3)',letterSpacing:.8,textTransform:'uppercase',padding:'0 16px 10px'}}>เมนูทั้งหมด</div>
            {navItems.filter(n=>!['dashboard','patients','triage','alerts'].includes(n.key)).map(n=>(
              <button key={n.key} className="mobile-more-item"
                onClick={()=>{ setView(n.key); setOpenHn(null); setMoreOpen(false); }}>
                <span style={{color:view===n.key?'var(--teal)':'var(--text-2)'}}><Icon name={n.icon} size={20}/></span>
                <span style={{flex:1,fontSize:15,fontWeight:view===n.key?700:400,color:view===n.key?'var(--teal)':'var(--text)'}}>{n.label}</span>
                {view===n.key && <span className="badge badge-teal" style={{fontSize:10}}>●</span>}
              </button>
            ))}
            {/* Logout */}
            <button className="mobile-more-item" style={{borderTop:'1px solid var(--border)',marginTop:8,color:'var(--red)'}} onClick={doLogout}>
              <Icon name="logout" size={20} style={{color:'var(--red)'}}/> <span style={{fontSize:15,color:'var(--red)'}}>ออกจากระบบ</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
