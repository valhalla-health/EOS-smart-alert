// EOS Smart Alert — Login Screen v2.1
// Clinical Night Mode: navy, glass card, ECG animation
// Auth: Google Sign-In only — server-side JWT verify via GAS

function LoginScreen({ onLogin }) {
  const { useState, useEffect } = React;
  const [err,     setErr]     = useState('');
  const [errSub,  setErrSub]  = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    const { GOOGLE_CLIENT_ID } = EOS.AUTH;
    if (!GOOGLE_CLIENT_ID) return;

    let attempts = 0;
    const tryInit = () => {
      attempts++;
      if (attempts > 20) return; // หยุดหลังจาก 8 วินาที

      if (!window.google?.accounts?.id) {
        setTimeout(tryInit, 400); return;
      }

      // Re-initialize ทุกครั้ง (สำคัญ: ต้องทำใหม่หลัง logout)
      google.accounts.id.initialize({
        client_id:   GOOGLE_CLIENT_ID,
        callback:    handleGoogleCredential,
        auto_select: false,
      });

      // รอให้ DOM element พร้อม
      const render = () => {
        const el = document.getElementById('gsi-btn-wrap');
        if (!el) { setTimeout(render, 100); return; }
        // ล้าง content เก่าก่อน render ใหม่
        el.innerHTML = '';
        google.accounts.id.renderButton(el, {
          type:'standard', size:'large', shape:'pill',
          theme:'filled_black',
          width: Math.min(300, window.innerWidth - 80),
        });
      };
      render();
    };

    // delay เล็กน้อยให้แน่ใจว่า DOM mount แล้ว
    setTimeout(tryInit, 50);
  }, []);

  const handleGoogleCredential = async resp => {
    setLoading(true); setErr(''); setErrSub('');
    try {
      const result = await EOS.loginGAS(resp.credential);

      if (result?.status === 'ok') {
        doLogin({ email:result.email, name:result.name, role:result.role }, resp.credential);
        return;
      }

      // ── Map error status → user-friendly message ──
      if (result?.status === 'unauthorized') {
        setErr('ไม่มีสิทธิ์เข้าใช้งาน');
        setErrSub('กรุณาติดต่อผู้ดูแลระบบเพื่อเพิ่มบัญชีของคุณ');
      } else if (result?.status === 'network_error') {
        setErr('ไม่สามารถเชื่อมต่อ server');
        setErrSub(`HTTP ${result.code||'?'} — ตรวจ GAS webhook URL ใน Config`);
      } else {
        setErr('เกิดข้อผิดพลาด');
        setErrSub(result?.message || 'กรุณาลองใหม่อีกครั้ง');
      }
    } catch (e) {
      setErr('ยืนยันตัวตนไม่ได้');
      setErrSub(e?.message || 'กรุณาลองใหม่');
    }
    setLoading(false);
  };

  const doLogin = (s, token) => {
    const sess = { ...s, loginAt:EOS.nowISO(), token:token||null };
    EOS.setSession(sess);
    EOS.auditLog('LOGIN', `${s.name} (${s.role})`);
    setLoading(false);
    onLogin(sess);
  };

  const ECG = 'M0,20 L28,20 L32,18 L35,22 L37,20 L42,20 L46,2 L50,38 L54,2 L58,20 L63,20 L66,17 L69,23 L72,20 L120,20';

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:9999, overflow:'hidden',
      background:'radial-gradient(ellipse at 25% 20%, #0f2744 0%, #0a1628 45%, #060e1c 100%)',
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
    }}>

      <style dangerouslySetInnerHTML={{__html:`
        @keyframes ecg-run {
          0%  { stroke-dashoffset:300; opacity:0; }
          8%  { opacity:1; }
          72% { opacity:1; stroke-dashoffset:0; }
          90% { opacity:0; stroke-dashoffset:0; }
          100%{ opacity:0; stroke-dashoffset:300; }
        }
        @keyframes ping {
          0%  { transform:scale(1); opacity:.7; }
          100%{ transform:scale(2.2); opacity:0; }
        }
        @keyframes float-in {
          from { transform:translateY(28px); opacity:0; }
          to   { transform:translateY(0);    opacity:1; }
        }
        @keyframes glow {
          0%,100%{ opacity:.3; }
          50%    { opacity:.65; }
        }
        @keyframes spin {
          to{ transform:rotate(360deg); }
        }
      `}}/>

      {/* Grid */}
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:.04,pointerEvents:'none'}}>
        <defs>
          <pattern id="lg" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0L0 0 0 48" fill="none" stroke="#93c5fd" strokeWidth=".5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#lg)"/>
      </svg>

      {/* Glows */}
      <div style={{position:'absolute',top:'8%',left:'6%',   width:500,height:500,borderRadius:'50%',background:'radial-gradient(circle,rgba(96,165,250,.08),transparent 70%)',animation:'glow 5s ease-in-out infinite',pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'10%',right:'5%',width:380,height:380,borderRadius:'50%',background:'radial-gradient(circle,rgba(245,158,11,.07),transparent 70%)',animation:'glow 5s ease-in-out infinite 2.5s',pointerEvents:'none'}}/>

      {/* Glass card */}
      <div style={{
        animation:'float-in .6s cubic-bezier(.22,1,.36,1) forwards',
        background:'linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03))',
        backdropFilter:'blur(28px)',
        border:'1px solid rgba(255,255,255,.11)',
        borderRadius:30,
        padding:'40px 36px 36px',
        width:'min(90vw,380px)',
        boxShadow:'0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1)',
        display:'flex', flexDirection:'column', alignItems:'center',
      }}>

        {/* ECG */}
        <div style={{width:'100%',height:44,marginBottom:28,position:'relative',overflow:'hidden'}}>
          <svg viewBox="0 0 120 40" preserveAspectRatio="none" style={{width:'100%',height:'100%'}}>
            <path d={ECG} fill="none" stroke="rgba(245,158,11,.15)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            <path d={ECG} fill="none" stroke="#f59e0b" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
              strokeDasharray="300" style={{animation:'ecg-run 3.2s ease-in-out infinite'}}/>
          </svg>
          <div style={{position:'absolute',right:2,top:'50%',transform:'translateY(-50%)'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:'#f59e0b',position:'relative'}}>
              <div style={{position:'absolute',inset:-3,borderRadius:'50%',border:'2px solid #f59e0b',animation:'ping 1.6s ease-out infinite'}}/>
            </div>

        </div>

        {/* Icon */}
        <div style={{

            <path d="M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6l-8-3z"/>
            <path d="M9 12h2v-2h2v2h2v2h-2v2h-2v-2H9z"/>
          </svg>
        </div>

        {/* Title */}
        <div style={{fontSize:26,fontWeight:700,color:'#fff',letterSpacing:'-.5px',marginBottom:8,textAlign:'center'}}>
          EOS Smart Alert

        <div style={{fontSize:15,color:'rgba(255,255,255,.5)',marginBottom:32,textAlign:'center',lineHeight:1.6}}>

﻿// EOS v7 — Visual primitives: Dial, MiniDial, TimelineStrip, Sparkline, Modal

const { useState: useStateUtils, useEffect: useEffectUtils, useMemo: useMemoUtils, useRef: useRefUtils } = React;

// ════════════════════════════════════════
// DIAL — the centerpiece. 7 segments around 270° arc.
// ════════════════════════════════════════
function Dial({ patient, vitals, size = 280, showCenter = true }) {
  const TPS = EOS.TIMEPOINTS;
  const OFF = EOS.OFFSETS;
  const MAX = 44;
  const age = EOS.ageHours(patient);
  const ageClamped = Math.min(age, MAX);
  const all = EOS.vitalsFor(patient.hn, vitals);
  const status = EOS.tpStatus(patient, vitals);

  const stroke = Math.max(8, size * 0.05);
  const r = size / 2 - stroke - 4;
  const cx = size / 2, cy = size / 2;
  // We sweep from 135° to 405° (i.e., -45° to 45° clockwise, leaving bottom open)
  const startAngle = 135;
  const endAngle = 405;
  const totalSweep = endAngle - startAngle;

  const angleFor = hr => startAngle + (hr / MAX) * totalSweep;
  const polar = (a, rad = r) => {
    const rrad = (a * Math.PI) / 180;
    return { x: cx + rad * Math.cos(rrad), y: cy + rad * Math.sin(rrad) };
  };

  // Background track full
  const trackStart = polar(startAngle);
  const trackEnd = polar(endAngle);
  const trackLarge = totalSweep > 180 ? 1 : 0;
  const trackD = `M ${trackStart.x} ${trackStart.y} A ${r} ${r} 0 ${trackLarge} 1 ${trackEnd.x} ${trackEnd.y}`;

  // Segments
  const segments = useMemoUtils(() => {
    const bounds = [0, ...TPS.map(t => OFF[t])];
    const segs = [];
    for (let i = 0; i < bounds.length - 1; i++) {
      const fromHr = bounds[i], toHr = bounds[i + 1];
      const tp = TPS[i];
      const rec = all.find(v => v.ageHr === tp);
      const isAlert = rec && EOS.evalVitals(rec).some(x => x.sev === 'red');
      const isDone = !!rec;
      const isOverdue = !rec && age > toHr + 1;
      const isDue = !rec && age >= toHr - 0.5 && age <= toHr + 1;
      const isFuture = !rec && age < toHr - 0.5;
      let color = 'var(--surface-3)';
      if (isAlert) color = 'var(--r)';
      else if (isDone) color = 'var(--g)';
      else if (isOverdue) color = 'var(--r)';
      else if (isDue) color = 'var(--a)';

      const a1 = angleFor(fromHr);
      const a2 = angleFor(toHr);
      const p1 = polar(a1);
      const p2 = polar(a2);
      const large = (a2 - a1) > 180 ? 1 : 0;
      segs.push({
        d: `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`,
        color, tp, future: isFuture,
        a1, a2,
      });
    }
    return segs;
  }, [patient.hn, age, all.length]);

  // Tick labels
  const ticks = TPS.map(tp => {
    const a = angleFor(OFF[tp]);
    const inner = polar(a, r - stroke - 4);
    const outer = polar(a, r + 12);
    const rec = all.find(v => v.ageHr === tp);
    const isAlert = rec && EOS.evalVitals(rec).some(x => x.sev === 'red');
    const isDone = !!rec;
    let dotColor = 'var(--surface-4)';
    let dotStroke = 'var(--line-2)';
    if (isAlert) { dotColor = 'var(--r)'; dotStroke = 'var(--r)'; }
    else if (isDone) { dotColor = 'var(--g)'; dotStroke = 'var(--g)'; }
    else if (status.tp === tp) { dotColor = 'var(--m)'; dotStroke = 'var(--m)'; }
    return { tp, ax: outer.x, ay: outer.y, dx: inner.x, dy: inner.y, dotColor, dotStroke, a };
  });

  // Now-pointer
  const pAngle = angleFor(ageClamped);
  const pTip = polar(pAngle, r);
  const pInner = polar(pAngle, r - stroke - 6);

  const ageParts = EOS.fmtAgeParts(age);
  const showHours = age < 24;

  const centerColor = status.cat === 'overdue' ? 'crit' : status.cat === 'due' ? 'warn' : 'ok';
  const nextLabel = status.tp || (status.cat === 'complete' ? '44/44' : '—');
  const nextPrefix = status.cat === 'overdue' ? 'OVERDUE' :
                     status.cat === 'due' ? 'DUE NOW' :
                     status.cat === 'soon' ? 'SOON' :
                     status.cat === 'complete' ? 'COMPLETE' : 'NEXT';

  return (
    <div className="dial-relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {/* glow ring (subtle) */}
        <defs>
          <radialGradient id="dial-glow">
            <stop offset="0%" stopColor="var(--m)" stopOpacity=".06"/>
            <stop offset="80%" stopColor="var(--m)" stopOpacity="0"/>
          </radialGradient>
        </defs>
        <circle cx={cx} cy={cy} r={r * 0.65} fill="url(#dial-glow)"/>

        {/* background track */}
        <path d={trackD} fill="none" stroke="var(--surface-3)" strokeWidth={stroke} strokeLinecap="butt"/>

        {/* segments */}
        {segments.map((s, i) => (
          <path key={i}
            d={s.d}
            fill="none"
            stroke={s.color}
            strokeWidth={stroke}
            strokeLinecap="butt"
            opacity={s.future ? 0 : 1}
            style={{ filter: s.color === 'var(--r)' ? 'drop-shadow(0 0 4px var(--r-glow))' : 'none' }}
          />
        ))}

        {/* tick separators between segments */}
        {segments.slice(0, -1).map((s, i) => {
          const inner = polar(s.a2, r - stroke / 2);
          const outer = polar(s.a2, r + stroke / 2);
          return (
            <line key={i}
              x1={inner.x} y1={inner.y} x2={outer.x} y2={outer.y}
              stroke="var(--bg)" strokeWidth="2.5"
            />
          );
        })}

        {/* tick dots OUTSIDE */}
        {ticks.map((t, i) => (
          <g key={i}>
            <circle cx={t.ax} cy={t.ay} r={3.5} fill={t.dotColor} stroke={t.dotStroke} strokeWidth="2"/>
          </g>
        ))}

        {/* now-pointer */}
        {age <= MAX && (
          <g>
            <line x1={cx} y1={cy} x2={pInner.x} y2={pInner.y}
              stroke="var(--ink)" strokeWidth="2.5" strokeLinecap="round" opacity=".6"/>
            <circle cx={pTip.x} cy={pTip.y} r={5} fill="var(--ink)" stroke="var(--bg)" strokeWidth="2"/>
            <circle cx={cx} cy={cy} r={4} fill="var(--ink)"/>
          </g>
        )}

        {/* Tick labels (in monospace) */}
        {ticks.map((t, i) => {
          const labelPos = polar(t.a, r + 26);
          return (
            <text key={i}
              x={labelPos.x} y={labelPos.y}
              textAnchor="middle" dominantBaseline="middle"
              fill="var(--ink-3)"
              fontSize="9.5"
              fontFamily="var(--f-mono), monospace"
              style={{ letterSpacing: '.05em', fontWeight: 600 }}>
              {t.tp.replace(' hr', 'h').replace('-', '–')}
            </text>
          );
        })}
      </svg>

      {showCenter && (
        <div className="dial-center">
          <div className="dial-age">{ageParts.n}</div>
          <div className="dial-unit">{showHours ? 'hours of life' : `days · ${ageParts.unit.split(' ').slice(1).join(' ') || 'old'}`}</div>
          <div className={`dial-next ${centerColor}`}>
            {nextPrefix} · {nextLabel}
          </div>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════
// MINI DIAL — for sidebar / small contexts
// ════════════════════════════════════════
function MiniDial({ patient, vitals, size = 38 }) {
  const TPS = EOS.TIMEPOINTS;
  const OFF = EOS.OFFSETS;
  const MAX = 44;
  const age = EOS.ageHours(patient);
  const all = EOS.vitalsFor(patient.hn, vitals);
  const stroke = Math.max(3, size * 0.08);
  const r = size / 2 - stroke - 1;
  const cx = size / 2, cy = size / 2;
  const startAngle = 135, endAngle = 405;
  const angleFor = hr => startAngle + (hr / MAX) * (endAngle - startAngle);
  const polar = (a, rad = r) => {
    const rrad = (a * Math.PI) / 180;
    return { x: cx + rad * Math.cos(rrad), y: cy + rad * Math.sin(rrad) };
  };
  const trackStart = polar(startAngle);
  const trackEnd = polar(endAngle);
  const trackD = `M ${trackStart.x} ${trackStart.y} A ${r} ${r} 0 1 1 ${trackEnd.x} ${trackEnd.y}`;
  const bounds = [0, ...TPS.map(t => OFF[t])];

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <path d={trackD} fill="none" stroke="var(--surface-3)" strokeWidth={stroke} strokeLinecap="butt"/>
      {bounds.slice(0, -1).map((from, i) => {
        const to = bounds[i + 1];
        const tp = TPS[i];
        const rec = all.find(v => v.ageHr === tp);
        const isAlert = rec && EOS.evalVitals(rec).some(x => x.sev === 'red');
        const isDone = !!rec;
        const isOverdue = !rec && age > to + 1;
        let color = 'transparent';
        if (isAlert || isOverdue) color = 'var(--r)';
        else if (isDone) color = 'var(--g)';
        if (color === 'transparent') return null;
        const a1 = angleFor(from), a2 = angleFor(to);
        const p1 = polar(a1), p2 = polar(a2);
        return <path key={i} d={`M ${p1.x} ${p1.y} A ${r} ${r} 0 0 1 ${p2.x} ${p2.y}`}
                     fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="butt"/>;
      })}
      {age <= MAX && (
        <circle cx={polar(angleFor(age)).x} cy={polar(angleFor(age)).y} r={Math.max(2, size * 0.05)}
                fill="var(--ink)" stroke="var(--bg)" strokeWidth="1.5"/>
      )}
    </svg>
  );
}

// ════════════════════════════════════════
// TIMELINE STRIP — 7-cell row of cells
// ════════════════════════════════════════
function TimelineStrip({ patient, vitals }) {
  const TPS = EOS.TIMEPOINTS;
  const OFF = EOS.OFFSETS;
  const age = EOS.ageHours(patient);
  const all = EOS.vitalsFor(patient.hn, vitals);
  const status = EOS.tpStatus(patient, vitals);
  return (
    <div className="tl-strip">
      {TPS.map(tp => {
        const rec = all.find(v => v.ageHr === tp);
        const off = OFF[tp];
        const isAlert = rec && EOS.evalVitals(rec).some(x => x.sev === 'red');
        const isDone = !!rec;
        const isOverdue = !rec && age > off + 1;
        const isDue = !rec && age >= off - 0.5 && age <= off + 1;
        const isNext = status.tp === tp && !isOverdue;
        let cls = 'tl-cell';
        if (isAlert || isOverdue) cls += ' crit';
        else if (isDone) cls += ' done';
        else if (isDue) cls += ' due';
        else if (isNext) cls += ' now';
        const label = tp.replace(' hr', '').replace('-', '·');
        return <div key={tp} className={cls} title={tp}>{label}</div>;
      })}
    </div>
  );
}

// ════════════════════════════════════════
// SPARKLINE
// ════════════════════════════════════════
function Spark({ series, w = 56, h = 18, color = 'var(--m)', flag, dots = false, area = false }) {
  if (!series || series.length < 2) {
    return <svg width={w} height={h}><line x1="0" y1={h/2} x2={w} y2={h/2} stroke="var(--ink-4)" strokeWidth="1" strokeDasharray="2 2"/></svg>;
  }
  const min = Math.min(...series), max = Math.max(...series);
  const pad = (max - min) * 0.2 || 1;
  const lo = min - pad, hi = max + pad;
  const points = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - lo) / (hi - lo)) * h;
    return [x, y];
  });
  const linePts = points.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const c = flag ? 'var(--r)' : color;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      {area && (
        <polygon points={`${linePts} ${w},${h} 0,${h}`} fill={c} opacity=".15"/>
      )}
      <polyline points={linePts} fill="none" stroke={c} strokeWidth="1.4" strokeLinejoin="round"/>
      {dots && points.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r={i === points.length - 1 ? 2.2 : 1.2}
                fill={i === points.length - 1 ? c : 'var(--ink-3)'}/>
      ))}
    </svg>
  );
}

// ════════════════════════════════════════
// VITAL CHIP — single-vital tiny card with sparkline background
// ════════════════════════════════════════
function VitalChip({ vital, vitalKey, vitals, patient }) {
  const r = EOS.RANGES[vitalKey];
  const v = vital?.[vitalKey];
  const flag = v != null && (v < r.lo || v > r.hi);
  const all = EOS.vitalsFor(patient.hn, vitals);
  const series = all.map(x => x[vitalKey]).filter(x => x != null);
  return (
    <div className={`v-chip ${flag ? 'flag' : ''}`}>
      <div className="k">{r.en}</div>
      <div className="vv">{v != null ? (vitalKey === 'T' ? v.toFixed(1) : Math.round(v)) : '—'}</div>
      <div className="sp">
        <Spark series={series} w={70} h={14} color="var(--m)" flag={flag} area/>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
// MODAL
// ════════════════════════════════════════
function Modal({ children, onClose, maxWidth = 600 }) {
  useEffectUtils(() => {
    const onKey = e => { if (e.key === 'Escape' && onClose) onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{ maxWidth }} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

// ──────── INSTRUMENT GAUGE ────────
function GaugeV7({ vital, vitalKey, vitals, patient }) {
  const r = EOS.RANGES[vitalKey];
  const v = vital?.[vitalKey];
  const flag = v != null && (v < r.lo || v > r.hi);
  const all = EOS.vitalsFor(patient.hn, vitals);
  const series = all.map(x => x[vitalKey]).filter(x => x != null);

  // Range visualization
  const fullMin = r.hardLo - (r.hardHi - r.hardLo) * 0.1;
  const fullMax = r.hardHi + (r.hardHi - r.hardLo) * 0.1;
  const ptrPct = v != null ? Math.max(0, Math.min(100, ((v - fullMin) / (fullMax - fullMin)) * 100)) : 50;
  const safeStart = ((r.lo - fullMin) / (fullMax - fullMin)) * 100;
  const safeEnd = ((r.hi - fullMin) / (fullMax - fullMin)) * 100;

  return (
    <div className={`gauge ${flag ? 'flag' : ''}`}>
      <div className="gauge-head">
        <Icon name={({ T: 'thermo', P: 'heart', R: 'lungs', SpO2: 'drop' })[vitalKey]} size={14}/>
        <div className="gauge-name">{r.en}</div>
        <div className="gauge-thai">{r.label}</div>
      </div>
      <div>
        <span className="gauge-val n">{v != null ? (vitalKey === 'T' ? v.toFixed(1) : Math.round(v)) : '—'}</span>
        <span className="gauge-unit">{r.unit}</span>
      </div>
      <div className="gauge-range">เกณฑ์ {r.lo}–{r.hi}</div>
      <div className="gauge-bar">
        <div className="safe" style={{ left: safeStart + '%', width: (safeEnd - safeStart) + '%' }}/>
        {v != null && <div className="ptr" style={{ left: ptrPct + '%' }}/>}
      </div>
      <div className="gauge-spark">
        {series.length > 1 && <Spark series={series} w={200} h={28} color="var(--m)" flag={flag} dots area/>}
      </div>
    </div>
  );
}

// ──── src/eos-sentinel.jsx ────
// EOS v8 — Sentinel
// Composite deterioration score for EOS-watch newborns.
// Inputs: KP pre-test risk + serial vitals trend + latest exam.
// Output: 0–10 with band + breakdown.

window.Sentinel = (() => {

  // Weighted factors. Goal: catch slow drift before any single vital is "abnormal."
  // Total max: ~12, clamped to 10. Bands:
  //   0–2  Stable  (green)
  //   3–4  Watch   (amber)
  //   5–7  Concern (red but not urgent)
  //   8–10 Critical
  function score(patient, vitals) {
    const factors = [];
    const all = EOS.vitalsFor(patient.hn, vitals);
    const last = all[all.length - 1];
    const prev = all[all.length - 2];

    // 1. Latest abnormality severity ─────────────────────────
    if (last) {
      const issues = EOS.evalVitals(last);
      const critN = issues.filter(i => i.critical).length;
      const abnN  = issues.filter(i => !i.critical).length;
      const pts = critN * 3 + abnN * 1;
      if (pts > 0) {
        factors.push({
          key: 'vitals-now', pts,
          label: `Vital signs abnormal (${critN} critical, ${abnN} mild)`,
          tier: critN > 0 ? 'fired' : 'warn',
        });
      } else {
        factors.push({ key: 'vitals-now', pts: 0, label: 'Vital signs ในเกณฑ์', tier: 'ok' });
      }
    } else {
      factors.push({ key: 'vitals-now', pts: 0, label: 'ยังไม่มีบันทึก', tier: 'ok' });
    }

    // 2. Trend (rising RR / falling SpO2 / rising HR) ────────
    const trends = EOS.evalTrend(patient.hn, vitals);
    if (trends.length > 0) {
      const pts = trends.length >= 2 ? 3 : 2;
      factors.push({
        key: 'trend', pts,
        label: `Trend ผิดทิศ · ${trends.map(t => t.txt).join(' · ')}`,
        tier: 'fired',
      });
    } else if (all.length >= 2) {
      factors.push({ key: 'trend', pts: 0, label: 'Trend คงที่', tier: 'ok' });
    }

    // 3. KP risk ────────────────────────────────────────────
    const kp = patient.kpRisk ?? 0;
    let kpPts = 0, kpLabel = `KP risk ${kp.toFixed(2)}/1k`;
    if (kp >= 3) { kpPts = 3; kpLabel += ' (High)'; }
    else if (kp >= 1) { kpPts = 2; kpLabel += ' (Medium)'; }
    else if (kp >= 0.5) { kpPts = 1; kpLabel += ' (Borderline)'; }
    factors.push({ key: 'kp', pts: kpPts, label: kpLabel,
      tier: kpPts >= 3 ? 'fired' : kpPts >= 2 ? 'warn' : 'ok' });

    // 4. Maternal chorioamnionitis ──────────────────────────
    if (patient.intake?.chorio) {
      factors.push({ key: 'chorio', pts: 2, label: 'Chorioamnionitis ของมารดา', tier: 'fired' });
    }

    // 5. Overdue protocol ───────────────────────────────────
    const st = EOS.tpStatus(patient, vitals);
    if (st.cat === 'overdue') {
      const pts = st.hoursLate > 4 ? 2 : 1;
      factors.push({
        key: 'overdue', pts,
        label: `เลย Serial PE ${st.tp} · ${st.hoursLate?.toFixed(1)}h late`,
        tier: pts >= 2 ? 'fired' : 'warn',
      });
    }

    // 6. Skin / RD signs ─────────────────────────────────────
    if (last) {
      if (last.skin === 'Cyanotic') {
        factors.push({ key: 'skin', pts: 3, label: 'ผิว Cyanotic', tier: 'fired' });
      } else if (last.skin === 'Marbled' || last.skin === 'Pale') {
        factors.push({ key: 'skin', pts: 1, label: `ผิว ${last.skin}`, tier: 'warn' });
      }
      if (last.rd?.length >= 2) {
        factors.push({ key: 'rd', pts: 2, label: `RD signs · ${last.rd.join(', ')}`, tier: 'fired' });
      } else if (last.rd?.length === 1) {
        factors.push({ key: 'rd', pts: 1, label: `RD · ${last.rd[0]}`, tier: 'warn' });
      }
    }

    // 7. Lab signal — CRP elevated or low/very-high WBC ─────
    if (patient.labs) {
      const crp = patient.labs.hsCRP?.value;
      if (crp != null && crp > 10) {
        factors.push({ key: 'crp', pts: crp > 50 ? 2 : 1, label: `hs-CRP ${crp} mg/L`, tier: crp > 50 ? 'fired' : 'warn' });
      }
      const wbc = patient.labs.cbc?.wbc;
      if (wbc != null && (wbc < 5 || wbc > 30)) {
        factors.push({ key: 'wbc', pts: 1, label: `WBC ${wbc} (out of range)`, tier: 'warn' });
      }
    }

    const raw = factors.reduce((s, f) => s + f.pts, 0);
    const score = Math.min(10, raw);

    let band;
    if (score >= 8) band = { key: 'critical', label: 'Critical', cls: 's-critical', action: 'รีบประเมิน · พิจารณา Empiric ATB · แจ้งแพทย์' };
    else if (score >= 5) band = { key: 'concern', label: 'Concern',   cls: 's-concern', action: 'แจ้งแพทย์ · ทบทวน plan · ทำ Lab ซ้ำ' };
    else if (score >= 3) band = { key: 'watch',   label: 'Watch',     cls: 's-watch',   action: 'ติดตามใกล้ชิด · เพิ่มความถี่ vitals' };
    else                 band = { key: 'stable',  label: 'Stable',    cls: 's-stable',  action: 'ดำเนินตาม protocol ปกติ' };

    return { score, band, factors, raw };
  }

  return { score };
})();

// ════════════════════════════════════════
// SENTINEL CHIP — compact + large variants
// ════════════════════════════════════════
function SentinelChip({ patient, vitals, size = 'sm' }) {

// EOS v8 — Care Plan
// Per-patient checklist: protocol items + risk-driven add-ons + clinical milestones.
// Derives done/due/missed automatically from existing data.

const { useState: useStateCP, useMemo: useMemoCP } = React;

window.CarePlan = (() => {

  // Build derived checklist
  function build(patient, vitals, extras = {}) {
    const age = EOS.ageHours(patient);
    const all = EOS.vitalsFor(patient.hn, vitals);
    const done = EOS.doneTPs(patient.hn, vitals);
    const kp = patient.kpRisk ?? 0;
    const labs = patient.labs || {};
    const intake = patient.intake || {};
    const items = [];

    // ── 1. Triage decision ──────────────
    items.push({
      key: 'triage',
      cat: 'admit',
      title: 'ประเมิน Triage แรกรับ',
      sub: kp >= 3 ? 'High risk — H/C + CBC' : kp >= 1 ? 'Medium — Serial PE' : 'Low — Routine',
      status: 'done',
      when: 'ที่แรกรับ',
      by: 'พ.ยานี',
    });

    // ── 2. Serial PE protocol ───────────
    EOS.TIMEPOINTS.forEach((tp, i) => {
      const rec = all.find(v => v.ageHr === tp);
      const off = EOS.OFFSETS[tp];
      const isOverdue = !rec && age > off + 1;
      const isDue = !rec && age >= off - 0.5;
      const isFuture = !rec && age < off - 0.5;
      let status, when;
      if (rec) {
        status = 'done';
        when = `บันทึก ${EOS.fmtTime(rec.ts)}`;
      } else if (isOverdue) {
        status = 'miss';
        when = `เลย ${(age - off).toFixed(1)}h`;
      } else if (isDue) {
        status = 'due';
        when = 'ถึงเวลา';
      } else {
        status = 'pending';
        when = `ใน ${(off - age).toFixed(1)}h`;
      }
      items.push({
        key: 'pe-' + tp,
        cat: 'protocol',
        title: `Serial PE · ${tp}`,
        sub: 'T · HR · RR · SpO₂ · skin · RD',
        status, when,
        by: rec?.by,
      });
    });

    // ── 3. ABX time-outs ────────────────
    if (kp >= 1 || intake.chorio) {
      ['36 hr', '44 hr'].forEach(tp => {
        const rec = all.find(v => v.ageHr === tp);
        const approved = rec?.abxApproved;
        items.push({
          key: 'abx-' + tp,
          cat: 'decision',
          title: `ABX Time-Out · ${tp}`,
          sub: 'ตัดสินใจหยุด/ต่อ antibiotic',
          status: approved ? 'done' : rec ? 'due' : 'pending',
          when: approved ? `${rec.abxDecision === 'stop' ? 'หยุด' : 'ต่อ'} ${EOS.fmtTime(rec.abxAt)}` : rec ? 'รอแพทย์' : '—',
          by: rec?.abxBy,
        });
      });
    }

    // ── 4. Labs (if high-risk) ──────────
    if (kp >= 1 || intake.chorio) {
      items.push({
        key: 'lab-cbc',
        cat: 'labs',
        title: 'CBC + Differential',
        sub: 'WBC · ANC · Plt · Hb',
        status: labs.cbc ? 'done' : age >= 6 ? 'miss' : 'pending',
        when: labs.cbc ? `เจาะ @${labs.cbc.drawnAtHr}h` : age >= 6 ? 'ต้องเจาะแล้ว' : `ภายใน 6h`,
      });
      items.push({
        key: 'lab-crp',
        cat: 'labs',
        title: 'hs-CRP',
        sub: 'ติดตามที่ 10–24h',
        status: labs.hsCRP ? 'done' : age >= 12 ? 'due' : 'pending',
        when: labs.hsCRP ? `${labs.hsCRP.value} mg/L @${labs.hsCRP.drawnAtHr}h` : age >= 12 ? 'ถึงเวลา' : `ภายใน ${(12 - age).toFixed(1)}h`,
      });
      items.push({
        key: 'lab-hc',
        cat: 'labs',
        title: 'Hemoculture',
        sub: 'ก่อนเริ่ม antibiotic',
        status: labs.hc ? 'done' : 'pending',
        when: labs.hc ? `${labs.hc.status} @${labs.hc.drawnAtHr}h` : '—',
      });
    }

    // ── 5. ATB start ────────────────────
    if (kp >= 3 || intake.chorio) {
      const started = labs.abxStartedAtHr != null;
      items.push({
        key: 'abx-start',
        cat: 'med',
        title: 'เริ่ม Empiric Antibiotic',
        sub: 'Ampicillin + Gentamicin (ภายใน 1h)',
        status: started ? 'done' : age >= 1 ? 'miss' : 'due',
        when: started ? `เริ่ม @${labs.abxStartedAtHr}h` : 'ASAP',
      });
    }

    // ── 6. Parent communication ─────────
    items.push({
      key: 'family',
      cat: 'family',
      title: 'แจ้งครอบครัว',
      sub: kp >= 1 ? 'อธิบาย plan + risk' : 'อธิบาย routine',
      status: extras.familyTold ? 'done' : age >= 4 ? 'due' : 'pending',
      when: extras.familyTold ? 'แจ้งแล้ว' : age >= 4 ? 'ควรแจ้งวันนี้' : `ภายใน ${(4 - age).toFixed(1)}h`,
    });

    // ── 7. Discharge readiness ──────────
    if (age >= 36) {
      const complete = done.size === EOS.TIMEPOINTS.length;
      const noAlerts = !all.some(v => EOS.evalVitals(v).some(x => x.sev === 'red'));
      items.push({
        key: 'dc',
        cat: 'discharge',
        title: 'พิจารณา Discharge',
        sub: 'protocol complete + อาการดี',
        status: complete && noAlerts ? 'due' : 'pending',
        when: complete && noAlerts ? 'พร้อม' : 'ยังไม่ครบ',
      });
    }

    return items;
  }

  return { build };
})();

// ════════════════════════════════════════
// CARE PLAN CARD
// ════════════════════════════════════════
function CarePlanCard({ patient, vitals }) {
  const [familyTold, setFamilyTold] = useStateCP(false);
  const items = window.CarePlan.build(patient, vitals, { familyTold });
  const doneN = items.filter(i => i.status === 'done').length;
  const missN = items.filter(i => i.status === 'miss').length;
  const dueN  = items.filter(i => i.status === 'due').length;
  const pct = items.length ? Math.round((doneN / items.length) * 100) : 0;

  // Group by category
  const groups = useMemoCP(() => {
    const cats = ['admit', 'protocol', 'decision', 'labs', 'med', 'family', 'discharge'];
    const labels = {
      admit: 'แรกรับ',
      protocol: 'Serial PE protocol',
      decision: 'การตัดสินใจ',
      labs: 'Labs',
      med: 'ยา / Antibiotic',
      family: 'ครอบครัว',
      discharge: 'จำหน่าย',
    };
    const out = [];
    cats.forEach(c => {
      const its = items.filter(i => i.cat === c);
      if (its.length) out.push({ cat: c, label: labels[c], items: its });
    });
    return out;
  }, [items]);

  return (
    <div>
      <div className="section-lbl" style={{ marginTop: 0 }}>
        <Icon name="check-circle" size={12}/>Care Plan
        {(missN > 0 || dueN > 0) && (
          <span style={{
            marginLeft: 'auto',
            display: 'inline-flex', gap: 6,
          }}>
            {missN > 0 && <span style={{ background: 'var(--r-tint)', color: 'var(--r)', padding: '2px 7px', borderRadius: 4, fontSize: 10.5 }}>{missN} miss</span>}
            {dueN > 0 && <span style={{ background: 'var(--a-tint)', color: 'var(--a)', padding: '2px 7px', borderRadius: 4, fontSize: 10.5 }}>{dueN} due</span>}
          </span>
        )}
        <div className="ln"/>
      </div>

      <div className="care-plan">
        {groups.map(g => (
          <div key={g.cat}>
            <div style={{
              padding: '8px 16px 4px',
              fontSize: 10.5, fontFamily: 'var(--f-mono)',
              letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--ink-4)',
              background: 'var(--surface-2)',
              borderBottom: '1px solid var(--line)',
            }}>{g.label}</div>
            {g.items.map(it => (
              <div key={it.key}
                   className={`care-row ${it.status}`}
                   onClick={() => { if (it.key === 'family') setFamilyTold(v => !v); }}>
                <div className="care-box">
                  {it.status === 'done' && <Icon name="check" size={13} color="#06190d"/>}
                  {it.status === 'miss' && <Icon name="warn" size={12} color="var(--r)"/>}
                  {it.status === 'due'  && <Icon name="clock" size={12} color="var(--a)"/>}
                </div>
                <div>
                  <div className="title">{it.title}</div>
                  <div className="sub">{it.sub}{it.by ? ` · ${it.by}` : ''}</div>
                </div>
                <div className="when">{it.when}</div>
                <div>
                  {it.status !== 'done' && (
                    <Icon name="chevron-right" size={14} color="var(--ink-4)"/>
                  )}
                </div>
              </div>
            ))}
          </div>
        ))}
        <div className="care-progress">
          <div style={{ fontSize: 11, fontFamily: 'var(--f-mono)', color: 'var(--ink-3)', letterSpacing: '.08em' }}>
            {doneN}/{items.length}
          </div>
          <div className="care-bar"><div style={{ width: pct + '%' }}/></div>
          <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--m)', fontFamily: 'var(--f-mono)' }}>{pct}%</div>
        </div>
      </div>
    </div>
  );
}

// EOS v8 — Command palette (extracted so v8-shell can use it without v7's App)

const { useState: useStateCmd, useEffect: useEffectCmd, useMemo: useMemoCmd, useRef: useRefCmd } = React;

const SECTION_META = {
  NAVIGATION: { icon: 'arrow-right', label: 'หน้าจอ · Navigation' },
  ACTIONS:    { icon: 'settings',    label: 'การทำงาน · Actions' },
  BABIES:     { icon: 'baby',        label: 'ทารกในระบบ · Babies' },
};

// Recognize a string that looks like a hotkey (single digit, single letter, ⌘+x, etc.)
const isHotkey = s => /^([⌘⌃⇧⌥]\s*\+?\s*)?[0-9a-zA-Z]$/.test(String(s || '').trim());

function CommandPalette({ items, onClose, onPick }) {
  const [q, setQ] = useStateCmd('');
  const [sel, setSel] = useStateCmd(0);
  const inputRef = useRefCmd(null);
  const listRef = useRefCmd(null);

  useEffectCmd(() => { inputRef.current?.focus(); }, []);

  const filtered = useMemoCmd(() => {
    if (!q) return items;
    const lc = q.toLowerCase();
    return items.filter(it => (it.label + ' ' + (it.sub || '') + ' ' + (it.keywords || '')).toLowerCase().includes(lc));
  }, [q, items]);

  useEffectCmd(() => { setSel(0); }, [q]);

  // keep selected item visible
  useEffectCmd(() => {
    if (!listRef.current) return;
    const el = listRef.current.querySelector('.cmd-item.sel');
    if (el && el.scrollIntoView) {
      const box = listRef.current.getBoundingClientRect();
      const er  = el.getBoundingClientRect();
      if (er.top < box.top || er.bottom > box.bottom) {
        el.scrollIntoView({ block: 'nearest' });
      }
    }
  }, [sel, filtered]);

  useEffectCmd(() => {
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(filtered.length - 1, s + 1)); }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
      else if (e.key === 'Enter') {
        const item = filtered[sel];
        if (item) onPick(item);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [filtered, sel, onClose, onPick]);

  const grouped = useMemoCmd(() => {
    const out = [];
    let lastSection = null;
    filtered.forEach(it => {
      if (it.section !== lastSection) {
        out.push({ __sectionHeader: true, section: it.section });
        lastSection = it.section;
      }
      out.push(it);
    });
    return out;
  }, [filtered]);

  const sectionSummary = useMemoCmd(() => {
    const counts = {};
    items.forEach(it => { counts[it.section] = (counts[it.section] || 0) + 1; });
    return counts;
  }, [items]);

  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="cmd-box" onClick={e => e.stopPropagation()}>
        <div className="cmd-input-row">
          <Icon name="search" size={18} color="var(--ink-3)"/>
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
                 placeholder="ค้นหา HN, ชื่อ, เตียง, คำสั่ง…"/>
          {q && (
            <button className="ico-btn" style={{ width: 28, height: 28 }} onClick={() => setQ('')} title="Clear">
              <Icon name="x" size={14}/>
            </button>
          )}
          <span className="kbd">esc</span>
        </div>

        {/* Quick chips — visible only when input is empty */}
        {!q && (
          <div style={{
            display: 'flex', gap: 6, padding: '8px 14px',
            borderBottom: '1px solid var(--line)',
            flexWrap: 'wrap', alignItems: 'center',
          }}>
            <span style={{ fontSize: 10.5, fontFamily: 'var(--f-mono)', letterSpacing: '.1em', color: 'var(--ink-4)', textTransform: 'uppercase', marginRight: 4 }}>ลัด</span>
            <button className="cmd-quick" onClick={() => setQ('alert')}>เคสเร่งด่วน</button>
            <button className="cmd-quick" onClick={() => setQ('overdue')}>เลยกำหนด</button>
            <button className="cmd-quick" onClick={() => setQ('22B')}>ชั้น 22B</button>
            <button className="cmd-quick" onClick={() => setQ('17A')}>ชั้น 17A</button>
            <button className="cmd-quick" onClick={() => setQ('SCN')}>SCN</button>
          </div>
        )}

        <div className="cmd-list" ref={listRef}>
          {grouped.length === 0 ? (
            <div style={{ padding: '36px 24px', textAlign: 'center' }}>
              <div style={{ width: 44, height: 44, borderRadius: 12, background: 'var(--surface-2)', display: 'grid', placeItems: 'center', margin: '0 auto 10px', color: 'var(--ink-3)' }}>
                <Icon name="search" size={20}/>
              </div>
              <div style={{ color: 'var(--ink-2)', fontSize: 13.5, fontWeight: 600 }}>ไม่พบผลลัพธ์</div>
              <div style={{ color: 'var(--ink-3)', fontSize: 12, marginTop: 4 }}>ลองพิมพ์ HN, ชื่อ, หมายเลขเตียง</div>
            </div>
          ) : grouped.map((it, i) => {
            if (it.__sectionHeader) {
              const meta = SECTION_META[it.section] || { icon: 'list', label: it.section };
              const ct = sectionSummary[it.section] || 0;
              return (
                <div key={'s-' + i} className="cmd-section" style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Icon name={meta.icon} size={11} color="var(--ink-4)"/>
                  <span style={{ flex: 1 }}>{meta.label}</span>
                  <span style={{ background: 'var(--surface-2)', color: 'var(--ink-3)', padding: '1px 7px', borderRadius: 4, fontSize: 10, fontWeight: 600 }}>{ct}</span>
                </div>
              );
            }
            const itemIdx = filtered.indexOf(it);
            return (
              <div key={it.id} className={`cmd-item ${itemIdx === sel ? 'sel' : ''}`}
                onMouseEnter={() => setSel(itemIdx)}
                onClick={() => onPick(it)}>
                <span className="cmd-item-ico">
                  <Icon name={it.icon || 'arrow-right'} size={14} color="currentColor"/>
                </span>
                <span className="lbl">{it.label}</span>
                {it.sub && (
                  isHotkey(it.sub)
                    ? <span className="kbd" style={{ fontSize: 10.5 }}>{it.sub}</span>
                    : <span className="hint">{it.sub}</span>
                )}
              </div>
            );
          })}
        </div>

        <div className="cmd-footer">
          <span><span className="kbd">↑↓</span>นำทาง</span>
          <span><span className="kbd">↵</span>เลือก</span>
          <span><span className="kbd">esc</span>ปิด</span>
          <span style={{ flex: 1 }}/>
          <span style={{ color: 'var(--ink-4)' }}>{filtered.length} รายการ</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { CommandPalette });

﻿// EOS v7 — Calculator, Triage, Alerts, ABX, VitalsEntry, PhoneHome, PinModal

const { useState: useStateScr, useMemo: useMemoScr, useEffect: useEffectScr, useRef: useRefScr } = React;

// ════════════════════════════════════════
// CALCULATOR — Animated Bayesian gauge
// ════════════════════════════════════════
function CalculatorV7({ onCancel }) {
  const [inc, setInc] = useStateScr(0.5);
  const [ga, setGa] = useStateScr('39');
  const [tempMax, setTempMax] = useStateScr('<37.5');
  const [rom, setRom] = useStateScr('6-12');
  const [gbs, setGbs] = useStateScr('unk');
  const [iap, setIap] = useStateScr('none');
  const [exam, setExam] = useStateScr('well');

  const result = useMemoScr(() => EOS.KP.compute({ incidence: inc, ga, tempMax, rom, gbs, iap }), [inc, ga, tempMax, rom, gbs, iap]);
  const finalRisk = useMemoScr(() => EOS.KP.applyExam(result.posteriorPer1k, exam), [result, exam]);

  const band = finalRisk >= 3 ? { c: 'var(--r)', label: 'High Risk', action: 'พิจารณาให้ Empiric Antibiotics + ส่ง H/C' }
              : finalRisk >= 1 ? { c: 'var(--a)', label: 'Medium Risk', action: 'Enhanced obs · Serial PE q4–6h' }
              : { c: 'var(--g)', label: 'Low Risk', action: 'Routine well-baby care' };

  // log-scale gauge (0.05 .. 30)
  const gMin = 0.05, gMax = 30;
  const logPos = v => Math.log(Math.max(gMin, Math.min(gMax, v)) / gMin) / Math.log(gMax / gMin);
  const arcPct = logPos(finalRisk);
  const circ = 2 * Math.PI * 92;

  return (
    <div className="page-pad fade-in">
      <div className="page-head">
        <button className="btn btn-ghost btn-sm" onClick={onCancel}><Icon name="arrow-left" size={13}/>กลับ</button>
        <div style={{ flex: 1 }}>
          <h1>EOS Risk Estimator</h1>
          <div className="sub">Bayesian approximation of KP 2024 model · ≥34 wk GA · <b style={{ color: 'var(--a)' }}>simplified</b></div>
        </div>
      </div>

      <EbmDisclaimer/>

      <div className="calc-grid">
        <div>
          <StepCard num={1} q="อุบัติการณ์ในพื้นที่ (Incidence)" sub="Baseline per 1,000 live births">
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <input type="range" min="0.1" max="2.0" step="0.1" value={inc}
                onChange={e => setInc(parseFloat(e.target.value))}
                style={{ flex: 1, accentColor: 'var(--m)' }}/>
              <div className="n" style={{ minWidth: 50, fontSize: 18, fontWeight: 700, textAlign: 'right' }}>{inc.toFixed(1)}</div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>/1k</div>
            </div>
          </StepCard>

          <StepCard num={2} q="อายุครรภ์ (Gestational Age)" sub="สัปดาห์">
            <div className="chip-row">
              {['34','35','36','37','38','39','40','41+'].map(g => (
                <button key={g} className={`chip ${ga === g ? 'on' : ''} ${ga === g && (g === '34' || g === '35') ? 'warn' : ''}`}
                  onClick={() => setGa(g)}>{g} wk</button>
              ))}
            </div>
          </StepCard>

          <StepCard num={3} q="ไข้มารดาสูงสุดในช่วงคลอด" sub="Highest intrapartum maternal temp (°C)">
            <div className="chip-row">
              {[{ v: '<37.5', l: '< 37.5' }, { v: '37.5-38.0', l: '37.5–38.0' }, { v: '38.0-38.5', l: '38.0–38.5' }, { v: '38.5-39.0', l: '38.5–39.0' }, { v: '≥39.0', l: '≥ 39.0' }].map(o => (
                <button key={o.v} className={`chip ${tempMax === o.v ? 'on' : ''} ${tempMax === o.v && (o.v === '≥39.0' || o.v === '38.5-39.0') ? 'danger' : tempMax === o.v && o.v !== '<37.5' ? 'warn' : ''}`}
                  onClick={() => setTempMax(o.v)}>{o.l}</button>
              ))}
            </div>
          </StepCard>

          <StepCard num={4} q="ระยะเวลาน้ำเดิน (ROM)" sub="ก่อนคลอด">
            <div className="chip-row">
              {[['0-6','0–6 hr'],['6-12','6–12 hr'],['12-18','12–18 hr'],['18-24','18–24 hr'],['>24','> 24 hr']].map(([v, l]) => (
                <button key={v} className={`chip ${rom === v ? 'on' : ''} ${rom === v && (v === '18-24' || v === '>24') ? 'warn' : ''}`}
                  onClick={() => setRom(v)}>{l}</button>
              ))}
            </div>
          </StepCard>

          <StepCard num={5} q="GBS Status" sub="Maternal Group B Streptococcus">
            <div className="chip-row">
              <button className={`chip ${gbs === 'neg' ? 'on success' : ''}`} onClick={() => setGbs('neg')}>Negative</button>
              <button className={`chip ${gbs === 'unk' ? 'on' : ''}`} onClick={() => setGbs('unk')}>Unknown</button>
              <button className={`chip ${gbs === 'pos' ? 'on danger' : ''}`} onClick={() => setGbs('pos')}>Positive</button>
            </div>
          </StepCard>

          <StepCard num={6} q="Antibiotic ก่อนคลอด (IAP)" sub="Intrapartum prophylaxis adequacy">
            <div className="chip-row">
              {[['broad-spec-≥4hr','Broad-spec ≥4hr (adequate)'],['broad-spec-<4hr','Broad-spec <4hr'],['gbs-spec-≥2hr','GBS-spec ≥2hr'],['gbs-spec-<2hr','GBS-spec <2hr'],['none','None / Inadequate']].map(([v, l]) => (
                <button key={v} className={`chip ${iap === v ? 'on' : ''} ${iap === v && v === 'none' ? 'warn' : ''} ${iap === v && (v === 'broad-spec-≥4hr' || v === 'gbs-spec-≥2hr') ? 'success' : ''}`}
                  onClick={() => setIap(v)}>{l}</button>
              ))}
            </div>
          </StepCard>

          <StepCard num={7} q="ตรวจร่างกายทารก (Clinical Exam)" sub="หลังคลอด · modifies posterior with LR">
            <div className="chip-row">
              <button className={`chip ${exam === 'well' ? 'on success' : ''}`} onClick={() => setExam('well')}>Well-appearing</button>
              <button className={`chip ${exam === 'equivocal' ? 'on warn' : ''}`} onClick={() => setExam('equivocal')}>Equivocal</button>
              <button className={`chip ${exam === 'clinical-illness' ? 'on danger' : ''}`} onClick={() => setExam('clinical-illness')}>Clinical illness</button>
            </div>
            <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--ink-3)', fontFamily: 'var(--f-mono)' }}>
              LR: well ×0.41 · equivocal ×5.0 · ill ×21.5
            </div>
          </StepCard>
        </div>

        {/* RIGHT — GAUGE + BAYES TRACE */}
        <div className="calc-gauge">
          <div className="calc-gauge-title">Final EOS Risk</div>
          <div className="calc-gauge-svg-wrap">
            <svg width="240" height="240" viewBox="0 0 240 240">
              <defs>
                <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stopColor="var(--g)"/>
                  <stop offset="33%" stopColor="var(--g)"/>
                  <stop offset="50%" stopColor="var(--a)"/>
                  <stop offset="100%" stopColor="var(--r)"/>
                </linearGradient>
              </defs>
              <circle cx="120" cy="120" r="92" fill="none" stroke="var(--surface-3)" strokeWidth="16"/>
              <circle cx="120" cy="120" r="92" fill="none"
                stroke="url(#rg)" strokeWidth="16" strokeLinecap="round"
                strokeDasharray={circ}
                strokeDashoffset={circ * (1 - arcPct)}
                transform="rotate(-90 120 120)"
                style={{ transition: 'stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)' }}/>
              {/* needle */}
              {(() => {
                const angle = -90 + arcPct * 360;
                const rad = (angle * Math.PI) / 180;
                const x = 120 + 80 * Math.cos(rad);
                const y = 120 + 80 * Math.sin(rad);
                return <line x1="120" y1="120" x2={x} y2={y} stroke="var(--ink)" strokeWidth="2.5" strokeLinecap="round" opacity=".4"/>;
              })()}
            </svg>
            <div className="calc-gauge-center">
              <div className="calc-gauge-num n" style={{ color: band.c }}>{finalRisk.toFixed(2)}</div>
              <div className="calc-gauge-per">per 1,000</div>
            </div>
          </div>
          <div style={{ textAlign: 'center', marginTop: 6 }}>
            <span className="risk-band" style={{ background: band.c + '22', color: band.c, padding: '6px 14px', fontSize: 12 }}>
              <Icon name={band.c === 'var(--r)' ? 'warn' : band.c === 'var(--a)' ? 'eye' : 'check'} size={13}/>
              {band.label}
            </span>
          </div>
          <div style={{ marginTop: 12, padding: 12, background: band.c + '14', border: `1px solid ${band.c}44`, borderRadius: 10, fontSize: 12.5, lineHeight: 1.5 }}>
            <div style={{ fontSize: 10, fontFamily: 'var(--f-mono)', letterSpacing: '.12em', textTransform: 'uppercase', color: band.c, marginBottom: 4 }}>คำแนะนำ</div>
            {band.action}
          </div>

          <div style={{ fontSize: 10, fontFamily: 'var(--f-mono)', letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--ink-3)', margin: '18px 0 8px' }}>How we got here</div>
          <div className="bayes-row"><span className="k">Baseline per 1k</span><span className="lr">{result.priorPer1k.toFixed(2)}</span></div>
          {result.factors.map((f, i) => (
            <div key={i} className="bayes-row">
              <span className="k">{f.label}: {String(f.value)}</span>
              <span className={`lr ${f.lr > 1.05 ? 'up' : f.lr < 0.95 ? 'down' : ''}`}>×{f.lr.toFixed(2)}</span>
            </div>
          ))}
          <div className="bayes-row"><span className="k" style={{ fontWeight: 600 }}>Pre-exam posterior</span><span className="lr" style={{ fontWeight: 700 }}>{result.posteriorPer1k.toFixed(2)}</span></div>
          <div className="bayes-row">
            <span className="k">Exam: {exam.replace('-', ' ')}</span>
            <span className={`lr ${finalRisk > result.posteriorPer1k * 1.05 ? 'up' : 'down'}`}>→ {finalRisk.toFixed(2)}</span>
          </div>
        </div>
      </div>

      <EvidencePanel/>
    </div>
  );
}

function StepCard({ num, q, sub, children }) {
  return (
    <div className="calc-step done">
      <div className="head">
        <div className="num">{num}</div>
        <div>
          <div className="q">{q}</div>
          {sub && <div className="qsub">{sub}</div>}
        </div>
      </div>
      {children}
    </div>
  );
}

// ════════════════════════════════════════
// VITALS ENTRY — Big number pad, live abnormal flag
// ════════════════════════════════════════
function VitalsEntryV7({ patient, ageHr, onSave, onCancel, staffName, saving }) {
  const fields = ['T', 'P', 'R', 'SpO2'];
  const [vals, setVals] = useStateScr({});
  const [skin, setSkin] = useStateScr('Rosy');
  const [rd, setRd] = useStateScr([]);
  const [wellbeing, setWellbeing] = useStateScr('yes'); // M5: wellbeing field
  const [step, setStep] = useStateScr(0);
  const [text, setText] = useStateScr('');

  const currentKey = fields[step];
  const range = currentKey ? EOS.RANGES[currentKey] : null;
  const numericText = text.replace(/[^0-9.]/g, '');
  const numericVal = numericText === '' ? null : parseFloat(numericText);
  const isAlert = numericVal != null && range && (numericVal < range.lo || numericVal > range.hi);
  const isCritical = numericVal != null && range && (numericVal < range.hardLo || numericVal > range.hardHi);

  const next = () => {
    if (currentKey && numericVal != null) setVals(v => ({ ...v, [currentKey]: numericVal }));
    setText('');
    if (step < fields.length - 1) setStep(step + 1);
    else setStep(fields.length);
  };
  const back = () => { setText(''); setStep(Math.max(0, step - 1)); };
  const onKey = k => {
    if (k === '⌫') setText(t => t.slice(0, -1));
    else if (k === 'skip') next();
    else if (k === '.' && text.includes('.')) return;
    else setText(t => (t + k).slice(0, 5));
  };

  const finish = () => {
    if (saving) return;
    const final = { ...vals };
    if (currentKey && numericVal != null) final[currentKey] = numericVal;
    onSave({
      ts: EOS.nowISO(),
      hn: patient.hn,
      ageHr,
      ...final,
      skin,
      rd,
      wellbeing: wellbeing === 'no' ? 'no' : undefined, // M5: only store abnormal
      by: staffName || EOS.getSession()?.name || '?', // B1: real staff name
    });
  };

  return (
    <div className="modal-bg">
      <div className="modal" style={{ maxWidth: 760 }} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
          <span className="cp-pill info">{ageHr}</span>
          <h2 style={{ margin: 0 }}>บันทึก Serial PE</h2>
          <button className="ico-btn" style={{ marginLeft: 'auto' }} onClick={onCancel}><Icon name="x" size={16}/></button>
        </div>
        <div className="sub" style={{ marginBottom: 14 }}>
          {EOS.initials(patient.name)} · {patient.bed} · GA {EOS.fmtGA(patient.ga, patient.gaDays)} · BW {patient.bw != null ? patient.bw + 'g' : '—'}
        </div>

        {/* progress */}
        <div style={{ display: 'flex', gap: 5, marginBottom: 22 }}>
          {fields.map((f, i) => (
            <div key={f} style={{
              flex: 1, height: 4, borderRadius: 2,
              background: i < step ? 'var(--g)' : i === step ? 'var(--m)' : 'var(--surface-3)',
              transition: 'background .2s',
            }}/>
          ))}
          <div style={{ flex: 1, height: 4, borderRadius: 2, background: step >= fields.length ? 'var(--m)' : 'var(--surface-3)' }}/>
        </div>

        {step < fields.length ? (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 280px', gap: 20 }}>
            <div>
              <div style={{ fontSize: 11, fontFamily: 'var(--f-mono)', letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--ink-3)', marginBottom: 10 }}>
                {range.label} · {range.en}
              </div>
              <div className={`big-num-display ${isAlert ? 'flag' : ''}`}>
                <div>
                  <span className="n">{text || '—'}</span>
                  <span className="u">{range.unit}</span>
                </div>
                <div className="range">เกณฑ์ {range.lo}–{range.hi}</div>
                {isAlert && (
                  <div className="alert">
                    <Icon name="warn" size={13}/>
                    {isCritical ? 'ค่าผิดปกติร้ายแรง' : 'นอกช่วงปกติ'}
                  </div>
                )}
              </div>
            </div>
            <div className="npad">
              {['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k => (
                <button key={k} className={k === '⌫' ? 'fn' : ''} onClick={() => onKey(k)}>{k}</button>
              ))}
              <button className="fn" onClick={() => onKey('skip')}>ข้าม</button>
              <button className="ok" style={{ gridColumn: 'span 2' }} onClick={next}>ถัดไป →</button>
            </div>
          </div>
        ) : (
          <div>
            <div style={{ marginBottom: 16 }}>
              <label style={{ display: 'block', fontSize: 12, color: 'var(--ink-2)', marginBottom: 8, fontWeight: 600 }}>อาการทั่วไป · Wellbeing</label>
              <div className="chip-row">
                <button className={`chip ${wellbeing === 'yes' ? 'on success' : ''}`} onClick={() => setWellbeing('yes')}>ดี (Well)</button>
                <button className={`chip ${wellbeing === 'no' ? 'on danger' : ''}`} onClick={() => setWellbeing('no')}>ผิดปกติ (Unwell)</button>
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={{ display: 'block', fontSize: 12, color: 'var(--ink-2)', marginBottom: 8, fontWeight: 600 }}>สีผิว · Skin colour</label>
              <div className="chip-row">
                {EOS.SKIN_OPTS.map(s => (
                  <button key={s} className={`chip ${skin === s ? 'on' : ''} ${s === 'Cyanotic' || s === 'Marbled' ? 'danger' : s === 'Pale' ? 'warn' : ''}`}
                    onClick={() => setSkin(s)}>{s}</button>
                ))}
              </div>
            </div>
            <div>
              <label style={{ display: 'block', fontSize: 12, color: 'var(--ink-2)', marginBottom: 8, fontWeight: 600 }}>หายใจลำบาก · Respiratory distress</label>
              <div className="chip-row">
                {EOS.RD_OPTS.map(r => (
                  <button key={r} className={`chip ${rd.includes(r) ? 'on danger' : ''}`}
                    onClick={() => setRd(arr => arr.includes(r) ? arr.filter(x => x !== r) : [...arr, r])}>
                    {rd.includes(r) && <Icon name="check" size={11}/>} {r}
                  </button>
                ))}
              </div>
            </div>

            <div className="card" style={{ background: 'var(--surface-2)', marginTop: 18 }}>
              <div style={{ fontSize: 10.5, fontFamily: 'var(--f-mono)', letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--ink-3)', marginBottom: 10 }}>สรุปก่อนบันทึก</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
                {fields.map(f => (
                  <div key={f}>
                    <div style={{ fontSize: 11, color: 'var(--ink-3)', fontFamily: 'var(--f-mono)' }}>{EOS.RANGES[f].en}</div>
                    <div className="n" style={{ fontSize: 20, fontWeight: 700, marginTop: 2 }}>
                      {vals[f] != null ? (f === 'T' ? vals[f].toFixed(1) : Math.round(vals[f])) : '—'}
                      <span style={{ fontSize: 11, color: 'var(--ink-3)', marginLeft: 3, fontWeight: 500 }}>{EOS.RANGES[f].unit}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', gap: 8, marginTop: 20, justifyContent: 'flex-end' }}>
          {step > 0 && <button className="btn btn-ghost" onClick={back}><Icon name="arrow-left" size={13}/>ย้อนกลับ</button>}
          <button className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
          {step < fields.length ? (
            <button className="btn btn-pri" onClick={next}>ถัดไป<Icon name="arrow-right" size={13}/></button>
          ) : (
            <button className="btn btn-pri btn-lg" disabled={saving} onClick={finish}>
              <Icon name="check" size={14}/>{saving ? 'กำลังบันทึก…' : 'บันทึก'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
// ALERTS CENTER
// ════════════════════════════════════════
function AlertsV7({ patients, vitals, onOpenPatient, onBack }) {
  const [filter, setFilter] = useStateScr('all');
  const [dismissed, setDismissed] = useStateScr(() => {
    try { return new Set(JSON.parse(sessionStorage.getItem('eos_dismissed') || '[]')); } catch { return new Set(); }
  });
  // M9: persist dismissed across navigation
  useEffectScr(() => {
    try { sessionStorage.setItem('eos_dismissed', JSON.stringify([...dismissed])); } catch {}
  }, [dismissed]);

  const alerts = useMemoScr(() => {
    const list = [];
    patients.forEach(p => {
      const all = EOS.vitalsFor(p.hn, vitals);
      const last = all[all.length - 1];
      const status = EOS.tpStatus(p, vitals);
      if (last) {
        const issues = EOS.evalVitals(last).filter(i => i.sev === 'red');
        issues.forEach(i => {
          list.push({
            id: `${p.hn}-${last.ts}-${i.k}`,
            tier: 'crit',
            title: `${EOS.initials(p.name)} · ${i.k} ${typeof i.val === 'number' ? i.val.toFixed(1) : i.val}`,
            desc: `${p.bed} · ${EOS.floorLabel(p.floor)} · ค่าผิดปกติที่ ${last.ageHr}`,
            when: EOS.fmtTime(last.ts), hn: p.hn, icon: 'warn',
          });
        });
      }
      if (status.cat === 'overdue') {
        list.push({
          id: `${p.hn}-overdue`,
          tier: 'warn',
          title: `${EOS.initials(p.name)} · เลย ${status.tp}`,
          desc: `${p.bed} · เลยกำหนด ${status.hoursLate?.toFixed(1)} ชั่วโมง`,
          when: EOS.fmtAge(EOS.ageHours(p)), hn: p.hn, icon: 'clock',
        });
      }
      const trends = EOS.evalTrend(p.hn, vitals);
      trends.forEach((t, i) => {
        list.push({
          id: `${p.hn}-trend-${i}`,
          tier: 'warn',
          title: `${EOS.initials(p.name)} · Trend ผิดปกติ`,
          desc: `${p.bed} · ${t.txt}`,
          when: last ? EOS.fmtTime(last.ts) : '—', hn: p.hn, icon: 'arrow-up',
        });
      });
      all.forEach(v => {
        if (EOS.ABX_TPS.has(v.ageHr) && !v.abxApproved) {
          list.push({
            id: `${p.hn}-abx-${v.ts}`,
            tier: 'info',
            title: `${EOS.initials(p.name)} · ABX Time-Out`,
            desc: `${p.bed} · รอแพทย์ตัดสินใจที่ ${v.ageHr}`,
            when: EOS.fmtTime(v.ts), hn: p.hn, icon: 'abx',
          });
        }
      });
    });
    return list.filter(a => !dismissed.has(a.id));
  }, [patients, vitals, dismissed]);

  const filtered = filter === 'all' ? alerts : alerts.filter(a => a.tier === filter);
  const counts = {
    all: alerts.length, crit: alerts.filter(a => a.tier === 'crit').length,
    warn: alerts.filter(a => a.tier === 'warn').length, info: alerts.filter(a => a.tier === 'info').length,
  };

  return (
    <div className="page-pad fade-in">
      <div className="page-head">
        <button className="btn btn-ghost btn-sm" onClick={onBack}><Icon name="arrow-left" size={13}/>กลับ</button>
        <div style={{ flex: 1 }}>
          <h1>Alerts</h1>
          <div className="sub">{alerts.length} active · เรียงตามความสำคัญ</div>
        </div>
        <div className="floor-tabs" style={{ marginBottom: 0 }}>
          {[['all','All',counts.all],['crit','Critical',counts.crit],['warn','Warn',counts.warn],['info','Info',counts.info]].map(([v,l,c]) => (
            <button key={v} className={`f-tab ${filter === v ? 'active' : ''}`} onClick={() => setFilter(v)}>
              <span>{l}</span><span className="ct">{c}</span>
            </button>
          ))}
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="card" style={{ textAlign: 'center', padding: 60 }}>
          <div style={{ width: 56, height: 56, borderRadius: 16, background: 'var(--g-tint)', display: 'grid', placeItems: 'center', margin: '0 auto' }}>
            <Icon name="check" size={24} color="var(--g)"/>
          </div>
          <h2 style={{ marginTop: 16, fontSize: 18 }}>ไม่มี alert</h2>
          <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>ทุกอย่างเรียบร้อย</div>
        </div>
      ) : (
        <div>
          {filtered.map(a => (
            <div key={a.id} className={`alert-row ${a.tier}`} onClick={() => onOpenPatient(a.hn)}>
              <div className="alert-ico"><Icon name={a.icon} size={16}/></div>
              <div className="alert-body">
                <div className="title">{a.title}</div>
                <div className="desc">{a.desc}</div>
                <div className="meta">
                  <span><Icon name="clock" size={10}/> {a.when}</span>
                  <span>·</span>
                  <span style={{ color: a.tier === 'crit' ? 'var(--r)' : a.tier === 'warn' ? 'var(--a)' : 'var(--m)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em' }}>
                    {a.tier === 'crit' ? 'Critical' : a.tier === 'warn' ? 'Warning' : 'Info'}
                  </span>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="btn btn-soft btn-sm" onClick={e => { e.stopPropagation(); setDismissed(s => new Set([...s, a.id])); }}>
                  <Icon name="bell-off" size={11}/>Snooze
                </button>
                <button className="btn btn-pri btn-sm" onClick={e => { e.stopPropagation(); onOpenPatient(a.hn); }}>
                  ดู<Icon name="arrow-right" size={11}/>
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════
// ABX APPROVAL CENTER
// ════════════════════════════════════════
function AbxV7({ patients, vitals, onApprove, onBack }) {
  const pending = useMemoScr(() => {
    const list = [];
    patients.forEach(p => {
      const all = EOS.vitalsFor(p.hn, vitals);
      all.forEach(v => {
        if (EOS.ABX_TPS.has(v.ageHr) && !v.abxApproved) list.push({ patient: p, vital: v });
      });
    });
    return list;
  }, [patients, vitals]);

  const [idx, setIdx] = useStateScr(0);
  // M1: when pending shrinks after approval, keep idx in bounds
  useEffectScr(() => {
    if (pending.length > 0 && idx >= pending.length) setIdx(pending.length - 1);
  }, [pending.length]);

  const item = pending[Math.min(idx, Math.max(0, pending.length - 1))];

  if (pending.length === 0) {
    return (
      <div className="page-pad fade-in">
        <div className="page-head">
          <button className="btn btn-ghost btn-sm" onClick={onBack}><Icon name="arrow-left" size={13}/>กลับ</button>
          <div><h1>ABX Approval</h1><div className="sub">ตัดสินใจหยุดหรือต่อ antibiotic</div></div>
        </div>
        <div className="card" style={{ textAlign: 'center', padding: 60 }}>
          <div style={{ width: 60, height: 60, borderRadius: 18, background: 'var(--g-tint)', display: 'grid', placeItems: 'center', margin: '0 auto' }}>
            <Icon name="check" size={28} color="var(--g)"/>
          </div>
          <h2 style={{ marginTop: 16 }}>ไม่มีคำขอที่รอ</h2>
          <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>ABX time-outs ทั้งหมดได้รับการตัดสินใจแล้ว</div>
        </div>
      </div>
    );
  }

  if (!item) return null;
  const { patient, vital } = item;
  const all = EOS.vitalsFor(patient.hn, vitals);

  return (
    <div className="page-pad fade-in">
      <div className="page-head">
        <button className="btn btn-ghost btn-sm" onClick={onBack}><Icon name="arrow-left" size={13}/>กลับ</button>
        <div style={{ flex: 1 }}>
          <h1>ABX Approval</h1>
          <div className="sub">{idx + 1} / {pending.length} · ตัดสินใจหยุดหรือต่อ antibiotic</div>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {idx > 0 && <button className="btn btn-ghost btn-sm" onClick={() => setIdx(idx - 1)}><Icon name="arrow-left" size={13}/>Prev</button>}
          {idx < pending.length - 1 && <button className="btn btn-ghost btn-sm" onClick={() => setIdx(idx + 1)}>Next<Icon name="arrow-right" size={13}/></button>}
        </div>
      </div>

      <div style={{ maxWidth: 820, margin: '0 auto' }}>
        <div className="card" style={{ padding: 24 }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 16 }}>
            <span className="cp-pill warn">ABX TIME-OUT · {vital.ageHr}</span>
            <span className="cp-pill">{patient.bed}</span>
            <span style={{ fontSize: 11, color: 'var(--ink-3)', marginLeft: 'auto', fontFamily: 'var(--f-mono)' }}>HN {patient.hn}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 18 }}>
            <div className="avatar" style={{ width: 56, height: 56, borderRadius: 16, background: 'linear-gradient(135deg, var(--m), var(--m-2))', color: '#061814', display: 'grid', placeItems: 'center', font: '700 22px var(--f-sans)', letterSpacing: '-.03em' }}>
              {EOS.initials(patient.name)}
            </div>
            <div>
              <h2 style={{ margin: 0, fontSize: 28, letterSpacing: '-.025em' }}>{EOS.initials(patient.name)}</h2>
              <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 4, fontFamily: 'var(--f-mono)' }}>
                Mother {EOS.initials(patient.motherName)} · {EOS.floorLabel(patient.floor)} · GA {EOS.fmtGA(patient.ga, patient.gaDays)} · BW {patient.bw != null ? patient.bw + 'g' : '—'}
              </div>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, marginBottom: 18 }}>
            <div>
              <div className="section-lbl" style={{ margin: '0 0 8px' }}>Latest Vitals · {vital.ageHr}</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 8 }}>
                {['T','P','R','SpO2'].map(k => {
                  const r = EOS.RANGES[k];
                  const v = vital[k];
                  const flag = v != null && (v < r.lo || v > r.hi);
                  return (
                    <div key={k} style={{ padding: '10px 12px', borderRadius: 10, background: flag ? 'var(--r-tint)' : 'var(--surface-2)', border: `1px solid ${flag ? 'var(--r-2)' : 'var(--line)'}` }}>
                      <div style={{ fontSize: 10.5, color: flag ? 'var(--r)' : 'var(--ink-3)', fontFamily: 'var(--f-mono)', letterSpacing: '.08em' }}>{r.en}</div>
                      <div className="n" style={{ fontSize: 22, fontWeight: 700, color: flag ? 'var(--r)' : 'var(--ink)', marginTop: 2 }}>
                        {v != null ? (k === 'T' ? v.toFixed(1) : Math.round(v)) : '—'}
                        <span style={{ fontSize: 11, color: 'var(--ink-3)', fontWeight: 500, marginLeft: 3 }}>{r.unit}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div>
              <div className="section-lbl" style={{ margin: '0 0 8px' }}>Pre-test Risk Factors</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                <RiskRow label="KP risk" value={`${(patient.kpRisk ?? 0).toFixed(2)}/1k`} flag={(patient.kpRisk ?? 0) >= 1}/>
                <RiskRow label="GA" value={EOS.fmtGA(patient.ga, patient.gaDays)} flag={patient.ga < 37}/>
                <RiskRow label="GBS" value={(patient.intake?.gbs || '—').toUpperCase()} flag={patient.intake?.gbs === 'pos'}/>
                <RiskRow label="ROM" value={`${patient.intake?.rom}h`} flag={patient.intake?.rom >= 18}/>
                <RiskRow label="Maternal fever" value={patient.intake?.maternalFever === 'yes' ? `${patient.intake.fever}°C` : 'no'} flag={patient.intake?.maternalFever === 'yes'}/>
                <RiskRow label="Chorio" value={patient.intake?.chorio ? 'yes' : 'no'} flag={patient.intake?.chorio}/>
              </div>
            </div>
          </div>

          {/* labs */}
          {patient.labs && (
            <>
              <div className="section-lbl" style={{ margin: '0 0 8px' }}>Laboratory</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 18 }}>
                <LabCard title="CBC" labels={[
                  ['WBC', patient.labs.cbc?.wbc, '×10³/μL', v => v != null && (v < 5 || v > 30)],
                  ['ANC', patient.labs.cbc?.anc, '×10³/μL', v => v != null && v < 1.5],
                  ['Hb', patient.labs.cbc?.hb, 'g/dL', v => v != null && (v < 13 || v > 22)],
                  ['Plt', patient.labs.cbc?.plt, '×10³/μL', v => v != null && v < 100],
                ]} drawnAt={patient.labs.cbc?.drawnAtHr}/>
                <LabCard title="hs-CRP" labels={[['hs-CRP', patient.labs.hsCRP?.value, 'mg/L', v => v != null && v > 10]]} drawnAt={patient.labs.hsCRP?.drawnAtHr}/>
                <LabCard title="Hemoculture" labels={[['ผล', patient.labs.hc?.status, '', v => v === 'positive']]} drawnAt={patient.labs.hc?.drawnAtHr}/>
              </div>
            </>
          )}

          {/* 44h course */}
          <div className="section-lbl" style={{ margin: '0 0 8px' }}>44-hour Course</div>
          <div style={{ display: 'flex', gap: 5, marginBottom: 20 }}>
            {EOS.TIMEPOINTS.map(tp => {
              const rec = all.find(v => v.ageHr === tp);
              const isAlert = rec && EOS.evalVitals(rec).some(x => x.sev === 'red');
              const isCurrent = tp === vital.ageHr;
              return (
                <div key={tp} style={{
                  flex: 1, padding: '10px 4px', textAlign: 'center', borderRadius: 8,
                  background: isAlert ? 'var(--r-tint)' : rec ? 'var(--m-tint)' : 'var(--surface-2)',
                  color: isAlert ? 'var(--r)' : rec ? 'var(--m)' : 'var(--ink-4)',
                  border: isCurrent ? '2px solid var(--ink)' : '1px solid var(--line)',
                  fontWeight: isCurrent ? 700 : 600,
                  fontSize: 10.5, fontFamily: 'var(--f-mono)',
                }}>
                  <div>{tp}</div>
                  <div style={{ marginTop: 4, fontSize: 14 }}>{rec ? (isAlert ? '⚠' : '✓') : '·'}</div>
                </div>
              );
            })}
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <button className="btn btn-success btn-xl"
              onClick={() => onApprove(vital.ts, 'stop', EOS.initials(patient.name))}>
              <Icon name="check" size={18}/>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', lineHeight: 1.2 }}>
                <span style={{ fontSize: 10.5, fontWeight: 500, opacity: .7, textTransform: 'uppercase', letterSpacing: '.05em' }}>ทารกอาการดี</span>
                <span>หยุด Antibiotic</span>
              </div>
            </button>
            <button className="btn btn-warn btn-xl"
              onClick={() => onApprove(vital.ts, 'continue', EOS.initials(patient.name))}>
              <Icon name="warn" size={18}/>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', lineHeight: 1.2 }}>
                <span style={{ fontSize: 10.5, fontWeight: 500, opacity: .7, textTransform: 'uppercase', letterSpacing: '.05em' }}>ต้องเฝ้าระวังต่อ</span>
                <span>ให้ Antibiotic ต่อ</span>
              </div>
            </button>
          </div>
          <div style={{ textAlign: 'center', marginTop: 12, fontSize: 11.5, color: 'var(--ink-3)' }}>
            <Icon name="lock" size={11}/> ระบบจะขอยืนยันด้วย PIN ก่อนบันทึก
          </div>
        </div>
      </div>
    </div>
  );
}

}

function LabCard({ title, labels, drawnAt, note }) {
  return (
    <div style={{ padding: 12, borderRadius: 10, background: 'var(--surface-2)', border: '1px solid var(--line)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
        <div style={{ fontSize: 11, fontFamily: 'var(--f-mono)', letterSpacing: '.1em', color: 'var(--ink-2)', fontWeight: 600 }}>{title}</div>
        {drawnAt != null && <div style={{ fontSize: 10, color: 'var(--ink-4)', fontFamily: 'var(--f-mono)' }}>@{drawnAt}h</div>}
