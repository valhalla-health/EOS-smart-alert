<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOS Smart Alert · KCMH NICU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* EOS Smart Alert — V2 Design System (React Edition)
   Base: EOS Smart Alert v2.html (V4 folder)
   Additions: login screen, modals, permission-lock, ABX card, user mgmt
   ─────────────────────────────────────────────────── */

/* ── TOKENS ─────────────────────────────────────── */
:root {
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #faf8f3;
  --surface-3: #f0ede6;
  --border:    #e4e2d9;
  --border-2:  #d0cdc0;

  --text:   #15201d;
  --text-2: #3a4945;
  --text-3: #7a857f;
  --text-4: #a8b0a9;

  --sidebar:   #0e1816;
  --sidebar-2: #1f302c;
  --sidebar-hi:#1e302b;

  --teal:      #0e7a72;
  --teal-2:    #0a5d56;
  --teal-tint: #e6f3f1;
  --teal-deep: #053b37;

  --red:       #d63031;
  --red-2:     #a82222;
  --red-tint:  #fde8e8;

  --amber:     #c0760e;
  --amber-2:   #955b0c;
  --amber-tint:#fdecd4;

  --green:     #2c7a3e;
  --green-tint:#dff0e0;

  --navy:      #1e3a8a;
  --navy-tint: #dbe5fa;

  --r-sm: 8px;
  --r:    14px;
  --r-lg: 18px;
  --r-xl: 24px;

  --shadow-sm: 0 1px 2px rgba(14,24,22,.04),0 1px 1px rgba(14,24,22,.03);
  --shadow:    0 2px 8px rgba(14,24,22,.06),0 1px 2px rgba(14,24,22,.04);
  --shadow-lg: 0 14px 40px rgba(14,24,22,.14),0 4px 12px rgba(14,24,22,.08);

  --sidebar-w: 232px;
}

/* ── RESET ───────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono { font-family:'IBM Plex Mono',ui-monospace,monospace; font-feature-settings:"tnum" 1; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,select,textarea { font-family:inherit; font-size:inherit; color:inherit; }
input:focus,select:focus,textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(0,0,0,.12); border-radius:8px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background:rgba(0,0,0,.22); }

/* ── APP SHELL ───────────────────────────────────── */
.app-shell {
  display:flex; min-height:100vh; max-height:100vh; overflow:hidden;
}

/* ── SIDEBAR ─────────────────────────────────────── */
.sidebar {
  width:var(--sidebar-w); flex-shrink:0;
  background:linear-gradient(180deg,#141d1a 0%,#0e1816 60%,#0c1714 100%);
  color:rgba(255,255,255,.84);
  display:flex; flex-direction:column;
  border-right:1px solid rgba(255,255,255,.05);
}
.sidebar-brand {
  padding:20px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand-row { display:flex; align-items:center; gap:11px; }
.brand-mark {
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg,var(--teal),var(--teal-2));
  display:grid; place-items:center; flex-shrink:0; position:relative;
}
.brand-mark::after { content:''; position:absolute; inset:0; border-radius:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,.15); }
.brand-name { font-size:14px; font-weight:700; color:#fff; letter-spacing:-.2px; line-height:1.15; }
.brand-sub  { font-size:10px; color:rgba(255,255,255,.5); margin-top:2px; letter-spacing:.2px; }
.ward-chip {
  margin-top:14px; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08); border-radius:8px;
  padding:8px 10px; display:flex; align-items:center; gap:8px;
}
.ward-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.18); flex-shrink:0; }
.ward-chip .label { font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:1px; }
.ward-chip .val   { font-size:12px; color:#fff; font-weight:600; margin-top:1px; }

.sidebar-nav { flex:1; overflow-y:auto; padding:12px 8px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.1) transparent; }
.sidebar-nav::-webkit-scrollbar { width:4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:2px; border:none; }

.nav-section { font-size:10px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:rgba(255,255,255,.38); padding:14px 12px 6px; }
.nav-item {
  display:flex; align-items:center; gap:11px;
  padding:8px 10px; width:100%; border-radius:7px;
  font-size:13px; font-weight:500; color:rgba(255,255,255,.7);
  transition:background .12s,color .12s; text-align:left; position:relative;
}
.nav-item svg { width:17px; height:17px; flex-shrink:0; opacity:.8; }
.nav-item:hover { background:rgba(255,255,255,.05); color:#fff; }
.nav-item.active { background:var(--sidebar-hi); color:#fff; }
.nav-item.active svg { opacity:1; }
.nav-item.active::before {
  content:''; position:absolute; left:-8px; top:7px; bottom:7px;
  width:3px; border-radius:3px; background:var(--teal);
}
.nav-count {
  margin-left:auto; background:rgba(255,255,255,.08); color:rgba(255,255,255,.7);
  font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; min-width:20px; text-align:center;
}
.nav-count.alert { background:var(--red); color:#fff; box-shadow:0 0 0 3px rgba(200,16,46,.18); }
.nav-count.warn  { background:var(--amber); color:#fff; }

.sidebar-foot {
  border-top:1px solid rgba(255,255,255,.06);
  padding:14px 16px; display:flex; align-items:center; gap:10px;
}
.avatar {
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center;
  font-size:13px; font-weight:700; flex-shrink:0;
  background:linear-gradient(135deg,#4a635e,#2a3a37); color:#fff;
}
.sidebar-foot .name { font-size:12px; font-weight:600; color:#fff; }
.sidebar-foot .role { font-size:10px; color:rgba(255,255,255,.45); margin-top:1px; }
.sidebar-foot .info { flex:1; min-width:0; }
.sidebar-foot .info > div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── MAIN CONTENT ────────────────────────────────── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.topbar {
  height:56px; flex-shrink:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px; gap:14px;
}
.topbar-title { font-size:15px; font-weight:600; color:var(--text); }
.topbar-title .breadcrumb { color:var(--text-3); font-weight:400; margin-right:6px; }
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.live-clock { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:8px; }
.live-clock .dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.icon-btn { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; color:var(--text-2); position:relative; transition:background .12s; }
.icon-btn:hover { background:var(--surface-3); }
.icon-btn svg { width:18px; height:18px; }
.icon-btn .badge-dot { position:absolute; top:7px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--red); border:2px solid var(--surface); }

.content       { flex:1; overflow-y:auto; padding:24px 28px 60px; }
.content-inner { max-width:1480px; margin:0 auto; }

/* ── ALERT TICKER ────────────────────────────────── */
.alert-ticker {
  background:linear-gradient(90deg,var(--red),var(--red-2));
  color:#fff; padding:8px 24px; font-size:13px;
  display:flex; align-items:center; gap:14px;
  border-bottom:1px solid rgba(0,0,0,.1); overflow:hidden;
}
.alert-ticker svg { width:16px; height:16px; flex-shrink:0; }
.alert-ticker .label { font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:1px; background:rgba(0,0,0,.18); padding:3px 8px; border-radius:4px; }
.alert-ticker .messages { flex:1; white-space:nowrap; overflow:hidden; }
.alert-ticker .messages span { display:inline-block; padding-right:60px; font-weight:500; animation:scroll-ticker 30s linear infinite; }
@keyframes scroll-ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }

/* ── PAGE STRUCTURE ──────────────────────────────── */
.panel { animation:fadeIn .22s ease-out; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

.page-head { display:flex; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h1 { font-size:22px; font-weight:700; letter-spacing:-.3px; color:var(--text); }
.page-head .sub { font-size:13px; color:var(--text-3); margin-top:2px; }
.page-head .right { margin-left:auto; display:flex; gap:8px; align-items:center; }

/* ── CARDS ───────────────────────────────────────── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-sm); }
.card.muted { background:var(--surface-2); }
.card-head { display:flex; align-items:center; gap:8px; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--border); }
.card-title { font-size:13px; font-weight:700; color:var(--text); letter-spacing:-.1px; }
.card-sub   { font-size:11px; color:var(--text-3); }
.card-head .right { margin-left:auto; }

/* ── STATS ───────────────────────────────────────── */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px; position:relative; overflow:hidden; }
.stat .lbl  { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); }
.stat .val  { font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:700; color:var(--text); margin-top:6px; line-height:1; letter-spacing:-.5px; }
.stat .val .suf { font-size:14px; color:var(--text-3); margin-left:4px; font-weight:500; }
.stat .trend { font-size:11px; color:var(--text-3); margin-top:6px; }
.stat .trend .up   { color:var(--red);   font-weight:600; }
.stat .trend .down { color:var(--green); font-weight:600; }
.stat .accent { position:absolute; inset:0 auto 0 0; width:4px; }
.stat.red   .accent { background:var(--red);   } .stat.red   .val { color:var(--red);   }
.stat.amber .accent { background:var(--amber); } .stat.amber .val { color:var(--amber); }
.stat.green .accent { background:var(--green); } .stat.green .val { color:var(--green); }
.stat.teal  .accent { background:var(--teal);  } .stat.teal  .val { color:var(--teal);  }

/* ── BADGES ──────────────────────────────────────── */
.badge { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
.badge svg { width:11px; height:11px; }
.badge-red    { background:var(--red-tint);   color:var(--red-2);   }
.badge-amber  { background:var(--amber-tint); color:var(--amber-2); }
.badge-green  { background:var(--green-tint); color:var(--green);   }
.badge-teal   { background:var(--teal-tint);  color:var(--teal-2);  }
.badge-navy   { background:var(--navy-tint);  color:var(--navy);    }
.badge-grey   { background:var(--surface-3);  color:var(--text-2);  }

.dot-status { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
.dot-status.red   { background:var(--red);   box-shadow:0 0 0 3px var(--red-tint);   }
.dot-status.amber { background:var(--amber); box-shadow:0 0 0 3px var(--amber-tint); }
.dot-status.green { background:var(--green); box-shadow:0 0 0 3px var(--green-tint); }
.dot-status.teal  { background:var(--teal);  box-shadow:0 0 0 3px var(--teal-tint);  }
.dot-status.pulse-red { animation:pulseRed 1.4s infinite; }
@keyframes pulseRed { 0%{box-shadow:0 0 0 0 rgba(214,48,49,.45)} 70%{box-shadow:0 0 0 9px rgba(214,48,49,0)} 100%{box-shadow:0 0 0 0 rgba(214,48,49,0)} }

/* ── BUTTONS ─────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:12px; font-size:13px; font-weight:600; transition:all .15s; border:1px solid transparent; white-space:nowrap; }
.btn svg { width:15px; height:15px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--teal);   color:#fff; } .btn-primary:hover { background:var(--teal-2); }
.btn-danger  { background:var(--red);    color:#fff; } .btn-danger:hover  { background:var(--red-2);  }
.btn-ghost   { background:var(--surface); border-color:var(--border); color:var(--text-2); }
.btn-ghost:hover { background:var(--surface-3); border-color:var(--border-2); color:var(--text); }
.btn-sm { padding:6px 10px; font-size:12px; }
.btn-xs { padding:3px 8px;  font-size:11px; border-radius:6px; }

/* ── WARD BOARD ──────────────────────────────────── */
.board { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.board-col { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px; display:flex; flex-direction:column; min-height:440px; }
.board-col.overdue { border-top:3px solid var(--red);   }
.board-col.soon    { border-top:3px solid var(--amber); }
.board-col.ok      { border-top:3px solid var(--teal);  }
.board-col.done    { border-top:3px solid var(--green); }
.board-col-head { display:flex; align-items:center; gap:8px; padding:4px 4px 12px; margin-bottom:4px; }
.board-col-head .title { font-size:12px; font-weight:700; letter-spacing:.1px; color:var(--text); }
.board-col-head .count { margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1px 7px; color:var(--text-2); }

.patient-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
.patient-card:hover { border-color:var(--border-2); box-shadow:var(--shadow); transform:translateY(-1px); }
.patient-card .top-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.patient-card .name { font-size:13px; font-weight:700; color:var(--text); letter-spacing:-.2px; }
.patient-card .hn   { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-3); margin-left:auto; }
.patient-card .meta { display:flex; gap:10px; font-size:11px; color:var(--text-3); margin-bottom:8px; }
.patient-card .meta .mono { color:var(--text-2); }
.patient-card .progress-row { display:flex; gap:3px; margin-bottom:8px; }
.tp-pip { flex:1; height:4px; border-radius:2px; background:var(--surface-3); }
.tp-pip.done  { background:var(--green); }
.tp-pip.alert { background:var(--red); }
.tp-pip.next  { background:var(--amber); }
.patient-card .foot { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:11px; }
.patient-card .foot .due { color:var(--text-3); font-family:'IBM Plex Mono',monospace; }
.patient-card .foot .due strong { color:var(--text); }

/* ── TABLES ──────────────────────────────────────── */
table.eos { width:100%; border-collapse:collapse; font-size:12.5px; }
table.eos th,table.eos td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle; }
table.eos th { font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-3); letter-spacing:.6px; background:var(--surface-2); }
table.eos tbody tr:hover { background:var(--surface-2); }
table.eos td.mono { font-family:'IBM Plex Mono',monospace; font-feature-settings:"tnum" 1; }

/* ── FORMS ───────────────────────────────────────── */
.field { display:flex; flex-direction:column; gap:6px; }
.field label, label.lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-2); }
.field input,.field select,.field textarea,input.input,select.input {
  padding:9px 12px; border:1px solid var(--border-2); border-radius:8px;
  font-size:13px; background:var(--surface); transition:border-color .12s; width:100%;
}
.field input:focus,.field select:focus,input.input:focus,select.input:focus { border-color:var(--teal); }
textarea { min-height:70px; resize:vertical; }
.help { font-size:11px; color:var(--text-3); }

/* Segmented control */
.seg { display:inline-flex; background:var(--surface-3); border-radius:8px; padding:3px; gap:2px; }
.seg button { padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; color:var(--text-2); }
.seg button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

/* Chip group */
.chip-group { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:7px 12px; border:1.5px solid var(--border-2); border-radius:8px; background:var(--surface); font-size:13px; font-weight:500; color:var(--text-2); transition:all .12s; cursor:pointer; }
.chip:hover { border-color:var(--teal); }
.chip.active       { border-color:var(--teal);  background:var(--teal-tint);  color:var(--teal-2);  font-weight:600; }
.chip.danger.active{ border-color:var(--red);   background:var(--red-tint);   color:var(--red-2);   font-weight:600; }
.chip.warn.active  { border-color:var(--amber); background:var(--amber-tint); color:var(--amber-2); font-weight:600; }

/* Vital input with unit suffix */
.vital-input { display:flex; align-items:center; border:1px solid var(--border-2); border-radius:8px; background:var(--surface); overflow:hidden; }
.vital-input.flag { border-color:var(--red); background:var(--red-tint); }
.vital-input input { flex:1; border:none; padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; background:transparent; outline:none; }
.vital-input .unit { padding:0 10px; font-size:11px; color:var(--text-3); font-family:'IBM Plex Mono',monospace; border-left:1px solid var(--border); height:100%; display:flex; align-items:center; white-space:nowrap; }
.vital-range { font-size:10px; color:var(--text-3); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
.vital-range.flag { color:var(--red); font-weight:600; }

/* Alert banners */
.banner { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:10px; border:1px solid; font-size:13px; }
.banner svg { width:18px; height:18px; flex-shrink:0; margin-top:1px; }
.banner .title { font-weight:700; margin-bottom:2px; }
.banner.red   { background:var(--red-tint);   border-color:#f4c2cc; color:var(--red-2);   }
.banner.amber { background:var(--amber-tint); border-color:#ecd2a0; color:var(--amber-2); }
.banner.green { background:var(--green-tint); border-color:#b9d7be; color:var(--green);   }
.banner.teal  { background:var(--teal-tint);  border-color:#c3dfdc; color:var(--teal-2);  }

/* Grid helpers */
.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.row-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }

/* Misc utilities */
.divider { height:1px; background:var(--border); margin:14px 0; }
.flex { display:flex; } .flex-1 { flex:1; } .flex-col { flex-direction:column; }
.items-center { align-items:center; } .justify-between { justify-content:space-between; }
.gap-6{gap:6px} .gap-8{gap:8px} .gap-10{gap:10px} .gap-12{gap:12px} .gap-14{gap:14px} .gap-16{gap:16px}
.mt-8{margin-top:8px} .mt-12{margin-top:12px} .mt-14{margin-top:14px} .mt-16{margin-top:16px}
.mb-8{margin-bottom:8px} .mb-12{margin-bottom:12px} .mb-16{margin-bottom:16px}
.muted{color:var(--text-3)} .center{text-align:center}

/* ── TRIAGE ──────────────────────────────────────── */
.triage-wrap { display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start; }
.triage-step { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:22px; margin-bottom:14px; transition:all .18s; }
.triage-step.locked { opacity:.35; pointer-events:none; }
.triage-step.current { box-shadow:0 0 0 2px var(--teal-tint); border-color:var(--teal); }
.triage-step .step-no { display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; align-items:center; justify-content:center; margin-right:10px; }
.triage-step.done .step-no { background:var(--green); }
.triage-step .q    { font-size:16px; font-weight:700; color:var(--text); line-height:1.35; }
.triage-step .q-en { font-size:12px; color:var(--text-3); margin:4px 0 0 36px; }
.triage-step .step-body { margin-top:16px; margin-left:36px; }
.yn-row { display:flex; gap:10px; margin-top:8px; }
.yn-row .chip { flex:1; text-align:center; padding:14px; font-size:14px; font-weight:600; }

.outcome { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px; position:sticky; top:0; }
.outcome h4 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); margin-bottom:10px; }
.verdict { padding:14px; border-radius:10px; border:1.5px dashed var(--border-2); text-align:center; font-size:14px; color:var(--text-3); }
.verdict.active { border-style:solid; }
.verdict.red   { background:var(--red-tint);   border-color:var(--red);   color:var(--red-2);   }
.verdict.amber { background:var(--amber-tint); border-color:var(--amber); color:var(--amber-2); }
.verdict.green { background:var(--green-tint); border-color:var(--green); color:var(--green);   }
.verdict .lg { font-size:18px; font-weight:700; display:block; margin-bottom:6px; line-height:1.2; }
.verdict .actions { text-align:left; margin-top:12px; padding-top:12px; border-top:1px solid currentColor; font-size:12.5px; opacity:.9; }
.verdict .actions ul { padding-left:18px; }
.verdict .actions li { margin:3px 0; }

/* ── PATIENT DETAIL ──────────────────────────────── */
.detail-grid { display:grid; grid-template-columns:320px 1fr; gap:16px; align-items:start; }
.profile-card .name { font-size:22px; font-weight:700; letter-spacing:-.4px; color:var(--text); }
.profile-card .hn-line { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-3); margin-top:2px; }
.kv { display:grid; grid-template-columns:96px 1fr; gap:8px 10px; font-size:12.5px; margin-top:14px; }
.kv .k { color:var(--text-3); } .kv .v { color:var(--text); font-weight:500; } .kv .v.mono { font-family:'IBM Plex Mono',monospace; font-weight:600; }

/* Timeline */
.timeline { display:grid; grid-template-columns:80px 1fr; gap:8px; }
.timeline-row { display:contents; }
.timeline-row .age { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-3); text-align:right; padding:12px 8px 12px 0; border-right:1px solid var(--border); position:relative; }
.timeline-row .age::after { content:''; position:absolute; right:-5px; top:14px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--border-2); }
.timeline-row.done  .age::after { background:var(--green); border-color:var(--green); }
.timeline-row.alert .age::after { background:var(--red);   border-color:var(--red);   box-shadow:0 0 0 4px var(--red-tint); }
.timeline-row.due   .age::after { background:var(--amber); border-color:var(--amber); }
.timeline-row .body { padding:10px 0 14px 16px; }
.timeline-row .ts      { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-3); margin-bottom:4px; }
.timeline-row .summary { font-size:13px; color:var(--text); font-weight:500; }
.timeline-row .vitals-row { display:flex; gap:14px; margin-top:6px; font-size:12px; color:var(--text-2); flex-wrap:wrap; }
.timeline-row .vitals-row .v { display:flex; gap:4px; align-items:baseline; }
.timeline-row .vitals-row .v .k { color:var(--text-3); font-size:11px; }
.timeline-row .vitals-row .v .n { font-family:'IBM Plex Mono',monospace; font-weight:600; }
.timeline-row .vitals-row .v.flag .n { color:var(--red); }
.timeline-row .issues { margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }

/* Sparklines */
.spark-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.spark-tile { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.spark-tile .lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); }
.spark-tile .v { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:var(--text); margin:2px 0; }
.spark-tile .v.flag { color:var(--red); }
.spark-tile svg { display:block; width:100%; height:28px; }

/* ── PE FORM SECTION ─────────────────────────────── */
.pe-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px; }
.pe-section h3 { font-size:13px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.pe-section h3 .num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px; background:var(--teal-tint); color:var(--teal-2); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; }
h3 .num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px; background:var(--teal-tint); color:var(--teal-2); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; }

/* ── CALCULATOR ──────────────────────────────────── */
.calc-grid { display:grid; grid-template-columns:1fr 360px; gap:18px; }
.gauge-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:24px 22px; text-align:center; }
.gauge-card .gauge { position:relative; width:200px; height:110px; margin:0 auto 8px; }
.gauge-num { font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:700; letter-spacing:-1px; color:var(--text); line-height:1; }
.gauge-card .unit-line { font-size:11px; color:var(--text-3); margin-top:4px; }
.gauge-card .verdict-pill { display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; }

/* ── ALERTS LIST ─────────────────────────────────── */
.alert-row { display:flex; gap:12px; padding:12px; border-bottom:1px solid var(--border); align-items:flex-start; }
.alert-row:last-child { border-bottom:none; }
.alert-row .ico { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; }
.alert-row.red   .ico { background:var(--red-tint);   color:var(--red);   }
.alert-row.amber .ico { background:var(--amber-tint); color:var(--amber); }
.alert-row.teal  .ico { background:var(--teal-tint);  color:var(--teal);  }
.alert-row .body  { flex:1; min-width:0; }
.alert-row .title { font-size:13px; font-weight:600; color:var(--text); }
.alert-row .desc  { font-size:12px; color:var(--text-2); margin-top:2px; }
.alert-row .when  { font-size:11px; color:var(--text-3); font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

/* ── MODAL ───────────────────────────────────────── */
.modal-backdrop { position:fixed; inset:0; background:rgba(14,24,22,.5); backdrop-filter:blur(4px); z-index:100; display:grid; place-items:center; padding:20px; animation:fadeIn .15s; }
.modal { background:var(--surface); border-radius:var(--r-xl); padding:24px; width:100%; max-width:480px; box-shadow:var(--shadow-lg); max-height:90vh; overflow-y:auto; }
.modal h3   { font-size:16px; font-weight:700; margin-bottom:6px; }
.modal .sub { font-size:13px; color:var(--text-3); margin-bottom:16px; }
.modal-foot { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }

/* ── RESPONSIVE ──────────────────────────────────── */
@media (max-width:1100px) {
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  .board { grid-template-columns:repeat(2,1fr); }
  .detail-grid,.triage-wrap,.calc-grid { grid-template-columns:1fr; }
  .row-4 { grid-template-columns:1fr 1fr; }
}

/* ── OVERDUE column emphasis ─────────────────────── */
.board-col.overdue { border-top-width:5px; }

/* ── Logout / sidebar icon ───────────────────────── */
.sidebar .icon-btn:hover { background:rgba(255,255,255,.08); }
.sidebar .icon-btn { color:rgba(255,255,255,.5); }

/* ── Sidebar overlay (tablet hamburger) ─────────── */
.sidebar-overlay { display:none; position:fixed; inset:0; z-index:199; background:rgba(0,0,0,.45); }
.hamburger-btn   { display:none; }

/* ══════════════════════════════════════════════════
   TABLET  (641–1024px) — iPad, large Android
══════════════════════════════════════════════════ */
@media (max-width:1024px) and (min-width:641px) {
  .sidebar {
    position:fixed; top:0; left:0; height:100vh; z-index:200;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow:none;
  }
  .sidebar.open { transform:translateX(0); box-shadow:4px 0 32px rgba(0,0,0,.35); }
  .sidebar.open ~ * .sidebar-overlay,
  .sidebar-overlay { display:block; }
  .hamburger-btn { display:grid; }
  .mobile-tab-bar { display:none; }
  .mobile-more-backdrop { display:none; }
  .content { padding:20px; }
  .main { margin-left:0 !important; }
}

/* ══════════════════════════════════════════════════
   MOBILE  (≤ 640px) — iPhone, Android phones
══════════════════════════════════════════════════ */
@media (max-width:640px) {
  /* Sidebar hidden — replaced by bottom tab bar */
  .sidebar { display:none !important; }
  .sidebar-overlay { display:none !important; }
  .hamburger-btn { display:none !important; }

  /* Main area full-width + space for bottom tab bar */
  .app-shell { flex-direction:column; }
  .main { padding-bottom:calc(64px + env(safe-area-inset-bottom,0px)); overflow-y:auto; }
  .content { padding:14px 12px; }
  .content-inner { max-width:100%; }

  /* Topbar — slimmer, simpler */
  .topbar { padding:0 14px; height:52px; }
  .topbar-title { font-size:16px; }
  .live-clock { display:none; }

  /* Stats: 2×2 grid */
  .stat-grid { grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat { padding:12px 14px; }
  .stat .lbl { font-size:10px; }
  .stat .val { font-size:24px; }

  /* Board: horizontal scroll with snap (Kanban on mobile) */
  .board {
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    gap:12px; padding-bottom:8px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .board::-webkit-scrollbar { display:none; }
  .board-col {
    min-width:82vw; flex-shrink:0; scroll-snap-align:start;
    min-height:unset; padding:10px;
  }
  .board-col-head { padding:2px 2px 10px; }

  /* Patient cards: slightly more padding */
  .patient-card { padding:12px 13px; border-radius:12px; }

  /* Grids: single column */
  .detail-grid,.triage-wrap,.calc-grid,.row-2,.row-3,.row-4 { grid-template-columns:1fr; }

  /* Page heads */
  .page-head h1 { font-size:18px; }
  .page-head .sub { font-size:12px; }

  /* Modals: full-screen */
  .modal-backdrop { padding:0; align-items:flex-end; }
  .modal {
    border-radius:20px 20px 0 0 !important;
    max-width:100% !important; width:100%;
    max-height:92vh; overflow-y:auto;
    padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .modal-foot { justify-content:stretch; }
  .modal-foot .btn { flex:1; justify-content:center; }

  /* Font size bump */
  body { font-size:15px; }
  .btn { font-size:14px; padding:10px 16px; border-radius:14px; min-height:48px; }
  .btn-sm { font-size:13px; padding:8px 14px; min-height:44px; }
  .btn-xs { font-size:12px; padding:5px 10px; min-height:36px; }

  /* Timeline & tables */
  table.eos { font-size:12px; }
  .timeline { grid-template-columns:60px 1fr; }
  .timeline-row .age { font-size:10px; }

  /* PE form: larger vitals inputs */
  .vital-input input { font-size:18px; padding:12px 10px; min-height:52px; }
  .vital-input .unit { font-size:13px; padding:0 12px; }

  /* Nav section in sidebar (hidden anyway) */
  .nav-section { display:none; }
}

/* ══════════════════════════════════════════════════
   BOTTOM TAB BAR — mobile only
══════════════════════════════════════════════════ */
.mobile-tab-bar {
  display:none;
  position:fixed; bottom:0; left:0; right:0; z-index:300;
  height:calc(60px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--sidebar);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  justify-content:space-around; align-items:stretch;
}
.mobile-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:rgba(255,255,255,.45); transition:color .12s;
  min-height:44px;
}
.mobile-tab.active { color:#fff; }
.mobile-tab-icon { position:relative; display:flex; }
.mobile-tab-icon svg { display:block; }
.mobile-tab-label { font-size:10px; font-weight:500; letter-spacing:.2px; }
.mobile-tab-badge {
  position:absolute; top:-4px; right:-6px;
  min-width:16px; height:16px; border-radius:8px;
  background:var(--red); color:#fff; font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
  border:1.5px solid var(--sidebar);
}
.mobile-tab.active .mobile-tab-icon svg { stroke-width:2.5; }

/* ── More drawer ──────────────────────────────── */
.mobile-more-backdrop {
  display:none; position:fixed; inset:0; z-index:400;
  background:rgba(0,0,0,.5);
}
.mobile-more-sheet {
  position:absolute; bottom:0; left:0; right:0;
  background:var(--surface); border-radius:20px 20px 0 0;
  padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));
  max-height:85vh; overflow-y:auto;
}
.mobile-more-handle {
  width:36px; height:4px; background:var(--border-2); border-radius:2px;
  margin:0 auto 16px;
}
.mobile-more-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 20px; width:100%; font-family:inherit;
  border:none; background:none; cursor:pointer;
  text-align:left; transition:background .1s;
}
.mobile-more-item:hover,
.mobile-more-item:active { background:var(--surface-2); }

/* Show bottom tab bar on mobile */
@media (max-width:640px) {
  .mobile-tab-bar { display:flex; }
  .mobile-more-backdrop { display:flex; }
}

/* ══════════════════════════════════════════════════
   BOARD TAB SWITCHER — mobile only
══════════════════════════════════════════════════ */
.board-tabs { display:none; }
.board-col-hidden { display:none; }

@media (max-width:640px) {
  /* Show tab switcher, hide inactive columns */
  .board-tabs {
    display:flex; overflow-x:auto; scrollbar-width:none;
    border-bottom:1px solid var(--border); margin-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .board-tabs::-webkit-scrollbar { display:none; }
  .board-tab {
    flex:1; min-width:72px; padding:10px 8px 10px;
    font-size:13px; font-weight:600; color:var(--text-3);
    border:none; background:none; cursor:pointer;
    border-bottom:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:color .12s;
  }
  .board-tab.active { color:var(--text); }
  .board-tab-count {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; border-radius:10px;
    background:var(--surface-3); font-size:11px; font-weight:700;
    padding:0 5px;
  }
  .board-tab-count.urgent { background:var(--red-tint); color:var(--red-2); }

  /* Board: single active column full-width */
  .board { display:block; overflow-x:unset; scroll-snap-type:unset; }
  .board-col { min-width:unset; width:100%; }
  .board-col-hidden { display:none !important; }

  /* ── Labels: readable on mobile ─────────────────── */
  .field label, label.lbl {
    font-size:13px; text-transform:none; letter-spacing:0; font-weight:600;
  }
  /* Stat labels */
  .stat .lbl { font-size:12px; text-transform:none; letter-spacing:0; }

  /* ── Table headers ───────────────────────────────── */
  table.eos th { font-size:11px; text-transform:none; letter-spacing:0; }

  /* ── PE Form vitals: keep 2×2 on mobile ─────────── */
  .row-4 { grid-template-columns:1fr 1fr !important; }

  /* ── Alert ticker: no animation on mobile ────────── */
  .alert-ticker .messages { overflow:hidden; }
  .alert-ticker .messages span { animation:none; white-space:normal; font-size:13px; line-height:1.4; }
  .alert-ticker { flex-wrap:wrap; padding:10px 14px; gap:8px; cursor:pointer; }
  .alert-ticker .label { flex-shrink:0; }

  /* ── Page head compact ───────────────────────────── */
  .page-head { margin-bottom:14px; }
  .page-head h1 { font-size:17px; }
  .page-head .right { margin-top:0; }
}

</style>

  const clearSession = () => sessionStorage.removeItem('eos_sess');

  // ── USER MANAGEMENT ─────────────────────────────────────
  const getUsers = () => {
    const ov = sj(localStorage.getItem(STORE.users), null);
    return (ov && typeof ov === 'object') ? ov : STAFF_DB;
  };
  const saveUsers = db => setStore(STORE.users, db);
  const findStaffByEmail = email => {
    if (!email) return null;
    const key = String(email).trim().toLowerCase();
    const db  = getUsers();
    for (const k in db) if (k.toLowerCase()===key) return {email:k, ...db[k]};
    return null;
  };

  // ── AUDIT LOG ───────────────────────────────────────────
  const auditLog = (action, detail='') => {
    const s     = getSession();
    const entry = { ts:new Date().toISOString(), staff:s?.name||'?', role:s?.role||'?', action, detail };
    // 1. Persist locally
    const arr = getStore(STORE.audit);
    arr.push(entry);
    if (arr.length > 1000) arr.splice(0, arr.length-1000);
    setStore(STORE.audit, arr);
    // 2. Sync to GAS immediately — fire-and-forget (Vera #7)
    // syncRow defined below in same closure scope — safe to call
    const url = getCfg?.() ? (getCfg().url || DEFAULT_WEBHOOK) : DEFAULT_WEBHOOK;
    const token = s?.token || null;
    if (token) {
      fetch(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({sheet:'AuditLog', ...entry, token}),
      }).catch(()=>{}); // silent fail — audit is best-effort sync
    }
  };

  // ── CONFIG & SYNC ────────────────────────────────────────
  const getCfg = () => sj(localStorage.getItem(STORE.cfg), {});
  const setCfg = c => setStore(STORE.cfg, {...getCfg(), ...c});

  const fetchT = (url, opts={}, ms=10000) => {
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), ms);
    return fetch(url, {...opts, signal:ctrl.signal}).finally(()=>clearTimeout(t));
  };
  const getToken = () => {
    const s = sj(sessionStorage.getItem('eos_sess'), null);
    return s?.token || null;
  };

  const syncRow = async (sheet, row) => {
    const url   = getCfg().url || DEFAULT_WEBHOOK;
    const token = getToken();
    try {
      const r = await fetchT(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({sheet, ...row, token}),
      }, 8000);
      return r.ok;
    } catch { return false; }
  };

  /** loginGAS — ตรวจสอบ Google JWT กับ GAS (server-side verify) */
  const loginGAS = async token => {
    const url = getCfg().url || DEFAULT_WEBHOOK;
    try {
      const r = await fetchT(url, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'login', token}),
      }, 10000);
      if (!r.ok) return { status:'network_error', code:r.status };
      const data = await r.json();
      return data; // ส่งคืน object เต็ม: {status:'ok'|'unauthorized', email, name, role}
    } catch (e) {
      return { status:'error', message: e?.message||'unknown' };

  const nowISO = () => new Date().toISOString();
  const maskHn = hn => hn ? String(hn).replace(/(\d{2}\/\d{2})\d+/,'$1****') : '?';
  const esc    = s  => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

  const fmtTime = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  };
  const fmtDateTime = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short'})+' '+fmtTime(iso);
  };
  const fmtRelative = iso => {
    if (!iso) return '—';
    const diff = (Date.now()-new Date(iso))/3600000;
    if (diff < 1/60) return 'เมื่อกี้';
    if (diff < 1)    return Math.round(diff*60)+' นาทีที่แล้ว';
    if (diff < 24)   return (Math.round(diff*10)/10)+' hr ที่แล้ว';
    return Math.round(diff/24)+' วันที่แล้ว';
  };

  /**
   * evalTrend — KP "Equivocal" criterion detection across consecutive PEs
   * Returns issues[] if HR/RR/Temp/RD abnormal in ≥2 consecutive readings
   * (simulates "persistent physiologic abnormality")
   */
  const evalTrend = (hn, store) => {
    const vits = vitalsFor(hn, store);
    if (vits.length < 2) return [];
    const last2 = vits.slice(-2);
    const issues = [];

    // Check each numeric vital: both readings must be outside normal (lo/hi)
    [['P', 'HR'], ['R', 'RR'], ['T', 'Temp']].forEach(([k, label]) => {
      const r = RANGES[k];
      if (!r) return;
      const allAbnormal = last2.every(v => {
        const val = v[k];
        return val != null && (+val < r.lo || +val > r.hi);
      });
      if (allAbnormal) {
        const lastVal = last2[last2.length - 1][k];
        const sev = (+lastVal < r.hardLo || +lastVal > r.hardHi) ? 'red' : 'amber';
        issues.push({ k: label, txt: `persistent ${label}=${lastVal}${r.unit}`, sev, trend: true });
      }
    });

    // Persistent respiratory distress (both readings have rd)
    if (last2.every(v => v.rd && v.rd.length > 0)) {
      issues.push({ k: 'RD', txt: 'persistent respiratory distress', sev: 'red', trend: true });
    }

    return issues;
  };

  const evalVitals = v => {
    const issues = [];
    if (v.wellbeing==='no') issues.push({k:'Wellbeing',txt:'ผิดปกติ',sev:'red'});
    if (v.skin && v.skin!=='Rosy') issues.push({k:'Skin',txt:v.skin,sev:v.skin==='Cyanotic'?'red':'amber'});
    [['T',v.T],['P',v.P],['R',v.R],['SpO2',v.SpO2]].forEach(([k,val]) => {
      if (val==null) return;
      const r=RANGES[k]; if(!r) return;
      const n=+val;
      if (n<r.hardLo||n>r.hardHi) issues.push({k,txt:n+r.unit,sev:'red'});
      else if (n<r.lo||n>r.hi)    issues.push({k,txt:n+r.unit,sev:'amber'});
    });
    if (v.rd && v.rd.length) issues.push({k:'Distress',txt:v.rd.join(', '),sev:'red'});
    return issues;
  };

  const vitalFlag = (key, value) => {
    if (value==null||value==='') return null;
    const r=RANGES[key]; if(!r) return null;
    const v=+value;
    if (v<r.hardLo||v>r.hardHi) return 'red';
    if (v<r.lo||v>r.hi)         return 'amber';
    return null;
  };

  // ── EOS RISK CALCULATOR — KP 2024 (Kuzniewicz / Puopolo) ─
  // Reference: neonatalsepsiscalculator.kaiserpermanente.org
  // version: '2017' (no universal GBS screening) | '2024' (universal GBS screening)
  // iapType: 'broad_4plus' | 'broad_2to4' | 'gbs_2plus' | 'none'
  // gbsStatus: 'neg' | 'pos' | 'unk'
  // maternalTempC: in Celsius
  // incidence: base EOS rate at your institution per 1000 live births
  const calcEOSRisk = ({
    gaWeeks=39, gaDays=0,
    romHours=12, maternalTempC=37.0,
    gbsStatus='unk', iapType='none',
    incidence=0.5, version='2024',
  }) => {
    const ga = gaWeeks + (gaDays || 0) / 7;

    // GA factor (relative to GA 39 wk reference)
    let gaFactor;
    if (ga < 35)      gaFactor = 8.0;
    else if (ga < 36) gaFactor = 4.0;
    else if (ga < 37) gaFactor = 2.3;
    else if (ga < 38) gaFactor = 1.5;
    else if (ga < 39) gaFactor = 1.0;
    else if (ga < 40) gaFactor = 0.75;
    else if (ga < 41) gaFactor = 0.60;
    else              gaFactor = 0.50;

    let risk = incidence * gaFactor;

    // GBS status
    if (version === '2024') {
      // Universal screening: negative result more reliable
      if (gbsStatus === 'pos') risk *= 6.0;
      else if (gbsStatus === 'neg') risk *= 0.18;
      // unk = ×1.0
    } else {
      // 2017: no universal screening
      if (gbsStatus === 'pos') risk *= 6.0;
      else if (gbsStatus === 'neg') risk *= 0.27;
    }

    // ROM duration
    if (romHours >= 24)      risk *= 1.9;
    else if (romHours >= 18) risk *= 1.4;
    else if (romHours >= 12) risk *= 1.1;
    else                     risk *= 0.7; // < 12hr

    // Maternal temperature (Celsius)
    if (maternalTempC >= 39.0)      risk *= 4.2;
    else if (maternalTempC >= 38.0) risk *= 2.3;
    // < 38°C = ×1.0

    // Intrapartum antibiotics — 4-level (KP 2024)
    if (iapType === 'broad_4plus')  risk *= 0.065; // most protective
    else if (iapType === 'broad_2to4') risk *= 0.12;
    else if (iapType === 'gbs_2plus')  risk *= 0.15;
    // 'none' / < 2hr = ×1.0

    return Math.max(0.001, Math.round(risk * 10000) / 10000);
  };

  // Clinical presentation table — risk modifier after exam
  const calcEOSTable = (birthRisk) => [
    {
      exam: 'Clinical Illness', examTh: 'อาการหนัก',
      risk: Math.min(999, Math.round(birthRisk * 6.5 * 100) / 100),
      recommend: 'Blood culture + Empiric antibiotics',
      recommendTh: 'เริ่ม Empirical ABX ทันที + blood culture',
      badge: 'red',
      vitals: 'Hemodynamic instability, NCPAP/HFNC, O₂ ≥ 2 hr',
    },
    {
      exam: 'Equivocal', examTh: 'กำกวม',
      risk: Math.min(999, Math.round(birthRisk * 2.2 * 100) / 100),
      recommend: 'Blood culture + CBC → individualize',
      recommendTh: 'เจาะ CBC + blood culture พิจารณา ABX',
      badge: 'amber',
      vitals: 'HR ≥ 160 / RR ≥ 60 / Temp instability ≥ 4 hr',
    },
    {
      exam: 'Well Appearing', examTh: 'ดูดี',
      risk: Math.min(999, Math.round(birthRisk * 0.45 * 100) / 100),
      recommend: 'Routine newborn care',
      recommendTh: 'ดูแลตามปกติ — Serial PE ตาม protocol',
      badge: 'green',
      vitals: 'ไม่มีความผิดปกติคงที่',
    },
  ];

  const riskCategory = risk => {
    if (risk<0.5)  return {level:'low', label:'ความเสี่ยงต่ำ',    en:'Low',       badge:'green',recommend:'Routine care',                    detail:'Continue routine newborn care. No additional workup.'};
    if (risk<1.0)  return {level:'med', label:'ความเสี่ยงปานกลาง',en:'Moderate',  badge:'amber',recommend:'Serial PE × 48 hr',              detail:'No labs needed; clinical surveillance is sufficient if exam remains reassuring.'};
    if (risk<3.0)  return {level:'high',label:'ความเสี่ยงสูง',    en:'High',      badge:'amber',recommend:'Blood culture + CBC · Serial PE', detail:'Obtain blood culture and CBC at 0–6 hr. Continue serial PE.'};
    return           {level:'crit',label:'ความเสี่ยงสูงมาก',  en:'Very high', badge:'red',  recommend:'Empirical ABX + full sepsis workup',detail:'Start empirical broad-spectrum antibiotics. Full sepsis workup required.'};
  };

  // ── PATIENT HELPERS ─────────────────────────────────────
  const ageHours  = p => Math.round((Date.now()-new Date(p.dob))/36e5*10)/10;
  const vitalsFor = (hn, store) => (store||getStore(STORE.vitals)).filter(v=>v.hn===hn).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const doneTPs   = (hn, store) => new Set(vitalsFor(hn, store).map(v=>v.ageHr));
  const nextTP    = (hn, store) => { const done=doneTPs(hn,store); return TIMEPOINTS.find(tp=>!done.has(tp))||null; };
  const tpDueAt   = (p, tp)    => new Date(new Date(p.dob).getTime()+OFFSETS[tp]*3600000);

  const tpStatus = (p, store) => {

    const tp = nextTP(p.hn, store);

    if (diffH<-0.5) return {cat:'overdue',label:`เลยกำหนด ${Math.abs(Math.round(diffH*10)/10)} hr`,dueIn:diffH,tp};
    if (diffH<1.5)  return {cat:'soon',   label:`ครบในอีก ${Math.round(diffH*60)} นาที`,           dueIn:diffH,tp};

    const now=Date.now();

    const pts = [

      {hn:'68/12053',name:'Baby ของ คุณนภาพร',   motherName:'คุณนภาพร แสงทอง', sex:'F',ga:39.1,bw:3380,bed:'NICU-1',dob:ago(22),  intake:{maternalFever:'no', fever:null,  chorio:false,gbs:'unk',rom:20,iap:'none'},   triageOutcome:'serialPE',isSerialPE:true,archived:false,staff:'system',ts:ago(22.1),synced:false},
      {hn:'68/12058',name:'Baby ของ คุณวันเพ็ญ', motherName:'คุณวันเพ็ญ ทับทิม',sex:'M',ga:36.2,bw:2580,bed:'NICU-5',dob:ago(11.5),intake:{maternalFever:'no', fever:null,  chorio:false,gbs:'pos',rom:6, iap:'adequate'},triageOutcome:'serialPE',isSerialPE:true,archived:false,staff:'system',ts:ago(11.6),synced:false},
    ];
    const vts = [

    ];
    setStore(STORE.patients, pts);
    setStore(STORE.vitals,   vts);
  };

  return {
    TIMEPOINTS, OFFSETS, ABX_TPS, RANGES, SKIN_OPTS, RD_OPTS,

  };
})();

// EOS Smart Alert — Login Screen v2.1

function LoginScreen({ onLogin }) {
  const { useState, useEffect } = React;
  const [err,     setErr]     = useState('');
  const [errSub,  setErrSub]  = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    const { GOOGLE_CLIENT_ID } = EOS.AUTH;
    if (!GOOGLE_CLIENT_ID) return;

    let attempts = 0;
    const tryInit = () => {
      attempts++;
      if (attempts > 20) return; // หยุดหลังจาก 8 วินาที

      if (!window.google?.accounts?.id) {
        setTimeout(tryInit, 400); return;
      }

      // Re-initialize ทุกครั้ง (สำคัญ: ต้องทำใหม่หลัง logout)
      google.accounts.id.initialize({
        client_id:   GOOGLE_CLIENT_ID,
        callback:    handleGoogleCredential,
        auto_select: false,
      });

      // รอให้ DOM element พร้อม
      const render = () => {
        const el = document.getElementById('gsi-btn-wrap');
        if (!el) { setTimeout(render, 100); return; }
        // ล้าง content เก่าก่อน render ใหม่
        el.innerHTML = '';
        google.accounts.id.renderButton(el, {
          type:'standard', size:'large', shape:'pill',
          theme:'filled_black',
          width: Math.min(300, window.innerWidth - 80),
        });
      };
      render();
    };

    // delay เล็กน้อยให้แน่ใจว่า DOM mount แล้ว
    setTimeout(tryInit, 50);
  }, []);

  const handleGoogleCredential = async resp => {
    setLoading(true); setErr(''); setErrSub('');
    try {
      const result = await EOS.loginGAS(resp.credential);

      if (result?.status === 'ok') {
        doLogin({ email:result.email, name:result.name, role:result.role }, resp.credential);
        return;
      }

      // ── Map error status → user-friendly message ──
      if (result?.status === 'unauthorized') {
        setErr('ไม่มีสิทธิ์เข้าใช้งาน');
        setErrSub('กรุณาติดต่อผู้ดูแลระบบเพื่อเพิ่มบัญชีของคุณ');
      } else if (result?.status === 'network_error') {
        setErr('ไม่สามารถเชื่อมต่อ server');
        setErrSub(`HTTP ${result.code||'?'} — ตรวจ GAS webhook URL ใน Config`);
      } else {
        setErr('เกิดข้อผิดพลาด');
        setErrSub(result?.message || 'กรุณาลองใหม่อีกครั้ง');
      }
    } catch (e) {
      setErr('ยืนยันตัวตนไม่ได้');
      setErrSub(e?.message || 'กรุณาลองใหม่');
    }
    setLoading(false);
  };

  const doLogin = (s, token) => {
    const sess = { ...s, loginAt:EOS.nowISO(), token:token||null };
    EOS.setSession(sess);
    EOS.auditLog('LOGIN', `${s.name} (${s.role})`);
    setLoading(false);
    onLogin(sess);
  };

  const ECG = 'M0,20 L28,20 L32,18 L35,22 L37,20 L42,20 L46,2 L50,38 L54,2 L58,20 L63,20 L66,17 L69,23 L72,20 L120,20';

  return (

function StatusDot({ patient, vitals }) {
  const st = tpStatus(patient, vitals);
  const all = vitalsFor(patient.hn, vitals);
  const last = all[all.length - 1];
  const hasRed = last && evalVitals(last).some(i => i.sev === 'red');
  if (hasRed)               return <span className="dot-status red pulse-red"/>;
  if (st.cat === 'overdue') return <span className="dot-status red"/>;
  if (st.cat === 'soon')    return <span className="dot-status amber"/>;
  if (st.cat === 'done')    return <span className="dot-status green"/>;
  return <span className="dot-status teal"/>;
}

function SparkTile({ label, unit, value, series, flag }) {
  const clean = (series||[]).filter(s => s != null);
  const min = clean.length ? Math.min(...clean) : 0;
  const max = clean.length ? Math.max(...clean) : 1;
  const pad = (max - min) * 0.2 || 1;
  const lo = min - pad, hi = max + pad;
  const W = 100, H = 28;
  const points = clean.map((v, i) => {
    const x = (i / Math.max(1, clean.length - 1)) * W;
    const y = H - ((v - lo) / (hi - lo)) * H;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = flag === 'red' ? 'var(--red)' : 'var(--teal)';
  return (
    <div className="spark-tile">
      <div className="lbl">{label}</div>
      <div className={`v${flag ? ' flag' : ''}`}>
        {value ?? '—'}
        <span style={{ fontSize:11, color:'var(--text-3)', marginLeft:4, fontFamily:'IBM Plex Sans Thai' }}>{unit}</span>
      </div>
      {clean.length > 1 && (
        <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
          <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" vectorEffect="non-scaling-stroke"/>
          {clean.map((v, i) => {
            const x = (i / Math.max(1, clean.length - 1)) * W;
            const y = H - ((v - lo) / (hi - lo)) * H;
            return <circle key={i} cx={x} cy={y} r="1.4" fill={i === clean.length-1 ? color : 'var(--text-3)'}/>;
          })}
        </svg>
      )}
    </div>
  );
}

function PatientCard({ patient: p, vitals, onClick }) {
  const st = tpStatus(p, vitals);
  const done = doneTPs(p.hn, vitals);
  const all = vitalsFor(p.hn, vitals);
  const lastV = all[all.length - 1];
  const hasAlert = lastV && evalVitals(lastV).some(i => i.sev === 'red');
  const trendAlerts = evalTrend(p.hn, vitals);
  const hasTrend = trendAlerts.length > 0;
  return (
    <div className="patient-card" onClick={onClick}>
      <div className="top-row">
        <StatusDot patient={p} vitals={vitals}/>
        <span className="name" title={p.name} style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:120}}>{p.name.replace('Baby ของ ','')}</span>
        {hasTrend && <span className="badge badge-amber" style={{fontSize:9,padding:'1px 5px',flexShrink:0}}>TREND</span>}
        <span className="hn mono">{p.bed||p.hn}</span>
      </div>
      <div className="meta">
        <span>GA <span className="mono">{p.ga}</span> wk</span>
        <span>BW <span className="mono">{p.bw}</span> g</span>
        <span>อายุ <span className="mono">{ageHours(p)}</span> hr</span>
      </div>
      <div className="progress-row">
        {TIMEPOINTS.map(tp => {
          const rec = all.find(v => v.ageHr === tp);
          const isAlert = rec && evalVitals(rec).some(i => i.sev === 'red');
          const cls = isAlert ? 'alert' : done.has(tp) ? 'done' : tp === st.tp ? 'next' : '';
          return <div key={tp} className={`tp-pip ${cls}`} title={tp}/>;
        })}
      </div>
      <div className="foot">
        <span className="due">{st.tp ? <>ถัดไป <strong>{st.tp}</strong></> : <>เสร็จสิ้น</>}</span>
        <span style={{ color: hasAlert?'var(--red)':st.cat==='overdue'?'var(--red-2)':st.cat==='soon'?'var(--amber-2)':'var(--text-3)', fontWeight:600, fontSize:11 }}>
          {hasAlert ? '⚠ ผิดปกติ' : st.label}
        </span>
      </div>
    </div>
  );
}

function Dashboard({ patients, vitals, onOpenPatient, onGo }) {

// RISK TREND CHART
// ══════════════════════════════════════════════════

function RiskTrendChart({ patient: p, vitals, birthRisk }) {
  const all = vitalsFor(p.hn, vitals);
  if (all.length === 0) return null;

  // Clinical category from vitals → risk multiplier
  const catMult = v => {
    const issues = evalVitals(v);
    if (issues.some(i=>i.sev==='red')) return {mult:6.5, label:'Illness',  color:'var(--red)'};
    if (issues.some(i=>i.sev==='amber')) return {mult:2.2, label:'Equivocal',color:'var(--amber)'};
    return {mult:0.45, label:'Well',     color:'var(--teal)'};
  };

  const pts = [
    { label:'Birth', risk:birthRisk, color:'var(--text-2)' },
    ...all.map(v => { const c=catMult(v); return { label:v.ageHr.replace(' hr','h'), risk:Math.round(birthRisk*c.mult*100)/100, color:c.color, cat:c.label }; }),
  ];

  const W=280, H=72, PAD=28;
  const maxR = Math.max(...pts.map(p=>p.risk), 1.5);
  const x = i => PAD + (i/(pts.length-1||1))*(W-PAD*2);
  const y = r => H-10 - Math.min(1,r/maxR)*(H-18);

  return (
    <div className="card mb-12">
      <div className="card-head">
        <span className="card-title">EOS Risk Trend</span>
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--text-3)'}}>per 1,000 live births — by clinical presentation</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,overflow:'visible'}}>
        {/* Reference lines */}
        {[0.5,1,3].map(r=>{
          const yy=y(r); if(yy<4||yy>H-4) return null;
          return <g key={r}>
            <line x1={PAD} y1={yy} x2={W-PAD} y2={yy} stroke="var(--border)" strokeWidth="0.7" strokeDasharray="3,4"/>
            <text x={PAD-3} y={yy+3} textAnchor="end" fontSize="7.5" fill="var(--text-3)">{r}</text>
          </g>;
        })}
        {/* Connecting line */}
        {pts.length>1 && <polyline points={pts.map((_,i)=>`${x(i)},${y(pts[i].risk)}`).join(' ')}
          fill="none" stroke="var(--border-2)" strokeWidth="1.2" strokeLinejoin="round"/>}
        {/* Dots + labels */}
        {pts.map((pt,i)=>(
          <g key={i}>
            <circle cx={x(i)} cy={y(pt.risk)} r="5" fill={pt.color} stroke="var(--surface)" strokeWidth="1.5"/>
            <text x={x(i)} y={H+2} textAnchor="middle" fontSize="8" fill="var(--text-3)">{pt.label}</text>
            <text x={x(i)} y={y(pt.risk)-7} textAnchor="middle" fontSize="7.5" fill={pt.color} fontWeight="700">
              {pt.risk<0.1?pt.risk.toFixed(3):pt.risk.toFixed(2)}
            </text>
          </g>
        ))}
      </svg>
      <div style={{display:'flex',gap:12,marginTop:4,fontSize:10.5,color:'var(--text-3)'}}>
        <span style={{color:'var(--red)'}}>● Illness ×6.5</span>
        <span style={{color:'var(--amber)'}}>● Equivocal ×2.2</span>
        <span style={{color:'var(--teal)'}}>● Well ×0.45</span>
      </div>
    </div>
  );
}

// PATIENT DETAIL
// ══════════════════════════════════════════════════

function PatientDetail({ patient: p, vitals, onBack, onAddPE, onDischarge, session }) {
  const all = vitalsFor(p.hn, vitals);
  const last = all[all.length - 1];
  const lastIssues = last ? evalVitals(last) : [];
  const hasAlert = lastIssues.some(i => i.sev === 'red');
  const st = tpStatus(p, vitals);
  const rc = EOS.ROLE_CFG[session.role];

  // Birth risk — new signature
  const intakeCalc = calcEOSRisk({
    gaWeeks: Math.floor(p.ga||39), gaDays: Math.round(((p.ga||39)%1)*7),
    romHours: p.intake?.rom||0, maternalTempC: p.intake?.fever||37,
    gbsStatus: p.intake?.gbs||'unk',
    iapType: p.intake?.iap==='adequate'?'broad_4plus': p.intake?.iap==='partial'?'broad_2to4':'none',
    incidence: 0.5, version: '2024',
  });
  const intakeCat = riskCategory(intakeCalc);

  // ABX timer (find last approved continue decision)
  const abxEntry = all.filter(v=>v.abxApproved&&v.abxDecision==='continue').slice(-1)[0];
  const abxStartedAt = abxEntry?.abxAt || null;
  const abxElapsedHr = abxStartedAt ? (Date.now()-new Date(abxStartedAt))/3600000 : 0;
  const abxRemainingHr = Math.max(0, 48 - abxElapsedHr);
  const needReCulture = abxStartedAt && abxElapsedHr >= 36 &&
    !all.some(v => v.cultureStatus==='negative'||v.cultureStatus==='positive');

  return (
    <div className="panel">
      <div className="page-head">
        <div className="flex items-center gap-12">
          <button className="btn btn-ghost btn-sm" onClick={onBack}><Icon name="arrow_left"/>กลับ Ward Board</button>
          {rc.canDischarge && !p.archived && (
            <button className="btn btn-danger btn-sm" onClick={() => onDischarge(p.hn)}>Discharge</button>
          )}
        </div>
      </div>

      {/* Trend-based alert banner — Equivocal criterion */}
      {(() => {
        const trends = evalTrend(p.hn, vitals);
        if (!trends.length) return null;
        const redTrends = trends.filter(t=>t.sev==='red');
        const color = redTrends.length ? 'red' : 'amber';
        return (
          <div className={`banner ${color} mb-12`} style={{borderLeft:`4px solid var(--${color})`}}>
            <Icon name="warn"/>
            <div style={{flex:1}}>
              <div className="title">⚠ Trend Alert — Equivocal Criterion</div>
              <div style={{marginTop:4,fontSize:12}}>
                {trends.map(t=>t.txt).join(' · ')}
              </div>
              <div style={{marginTop:4,fontSize:11,opacity:.8}}>
                ≥2 consecutive readings abnormal — พิจารณา Clinical Equivocal classification
              </div>
            </div>
          </div>
        );
      })()}

      {hasAlert && (
        <div className="banner red mb-16" style={{borderLeft:'4px solid var(--red)'}}>
          <Icon name="warn"/>
          <div style={{flex:1}}>
            <div className="title">พบความผิดปกติ — ต้องการการประเมินทันที</div>
            <div style={{marginTop:4}}>ตรวจครั้งล่าสุด {fmtRelative(last.ts)} · {lastIssues.filter(i=>i.sev==='red').map(i=>i.k+' '+i.txt).join(' · ')}</div>
            <div style={{marginTop:10,display:'flex',gap:8}}>
              <button className="btn btn-danger btn-sm" onClick={()=>{EOS.auditLog('ABX_REQUESTED',`HN:${EOS.maskHn(p.hn)} by ${session.name}`);alert('⚠️ บันทึกแล้ว\nแจ้งแพทย์เพื่อพิจารณาสั่ง Empirical ABX\nการยืนยัน ABX ต้องดำเนินการโดยแพทย์ผ่านหน้า ABX Approval');}}><Icon name="syringe"/>เริ่ม Empirical ABX</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>EOS.auditLog('NOTIFY_DOCTOR',`HN:${EOS.maskHn(p.hn)}`)}>แจ้งแพทย์</button>
            </div>
          </div>
        </div>
      )}

      <div className="detail-grid">
        <div>
          <div className="card profile-card">
            <div className="name">{p.name}</div>
            <div className="hn-line">HN {p.hn} · {p.bed||'—'}</div>
            <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
              {p.triageOutcome==='workup'   && <span className="badge badge-red">Workup + Serial PE</span>}
              {p.triageOutcome==='serialPE' && <span className="badge badge-amber">Serial PE</span>}
              {p.triageOutcome==='observe'  && <span className="badge badge-green">Observation</span>}
              {p.archived && <span className="badge badge-grey">เสร็จสิ้น</span>}
              <span className={`badge badge-${intakeCat.badge}`}>EOS {intakeCat.en}</span>
            </div>
            <div className="kv">
              <div className="k">เพศ / GA</div><div className="v">{p.sex==='M'?'ชาย':'หญิง'} · <span className="mono">{p.ga}</span> wk</div>
              <div className="k">น้ำหนักแรกเกิด</div><div className="v mono">{p.bw} g</div>
              <div className="k">เกิดเมื่อ</div><div className="v">{fmtDateTime(p.dob)}</div>
              <div className="k">อายุปัจจุบัน</div><div className="v mono">{ageHours(p)} hr</div>
              {p.motherName && <><div className="k">มารดา</div><div className="v">{p.motherName}</div></>}
              <div className="k">Maternal Fever</div><div className="v">{p.intake?.maternalFever==='yes'?`มี ${p.intake.fever??'—'}°C`:'ไม่มีไข้'}</div>
              <div className="k">GBS</div><div className="v">{{pos:'Positive',neg:'Negative',unk:'Unknown'}[p.intake?.gbs]||'—'}</div>
              <div className="k">ROM</div><div className="v mono">{p.intake?.rom??'—'} hr</div>
              <div className="k">IAP</div><div className="v">{{adequate:'Adequate (≥4hr)',partial:'Partial',none:'None'}[p.intake?.iap]||'—'}</div>
            </div>
          </div>

          <div className="card mt-14">
            <div className="card-head">
              <span className="card-title">EOS Risk · Kaiser</span>
              <span className={`badge badge-${intakeCat.badge}`} style={{marginLeft:'auto'}}>{intakeCat.en}</span>
            </div>
            <div style={{textAlign:'center',padding:'6px 0 4px'}}>
              <div className="mono" style={{fontSize:36,fontWeight:700,letterSpacing:'-1px'}}>{intakeCalc < 0.01 ? intakeCalc.toFixed(3) : intakeCalc.toFixed(2)}</div>
              <div className="muted" style={{fontSize:11}}>ต่อ 1,000 ทารกเกิดมีชีพ</div>
            </div>
            <div className="divider"/>
            <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>{intakeCat.recommend}</div>
            <div style={{fontSize:12,color:'var(--text-2)',lineHeight:1.55}}>{intakeCat.detail}</div>
          </div>
        </div>

        <div>
          <div className="card mb-12">
            <div className="card-head">
              <span className="card-title">Latest Vitals</span>
              <span className="card-sub" style={{marginLeft:'auto'}}>{last ? fmtRelative(last.ts) : 'ยังไม่มีบันทึก'}</span>
            </div>
            {last ? (
              <div className="spark-grid">
                <SparkTile label="Temp" unit="°C" value={last.T} series={all.map(v=>v.T)} flag={vitalFlag('T',last.T)}/>
                <SparkTile label="Heart Rate" unit="bpm" value={last.P} series={all.map(v=>v.P)} flag={vitalFlag('P',last.P)}/>
                <SparkTile label="Resp Rate" unit="/min" value={last.R} series={all.map(v=>v.R)} flag={vitalFlag('R',last.R)}/>
                <SparkTile label="SpO₂" unit="%" value={last.SpO2} series={all.map(v=>v.SpO2)} flag={vitalFlag('SpO2',last.SpO2)}/>
                <div className="spark-tile">
                  <div className="lbl">Skin</div>
                  <div className="v" style={{color:last.skin==='Rosy'?'var(--text)':'var(--red)'}}>{last.skin||'—'}</div>
                  <div style={{fontSize:10,color:'var(--text-3)',marginTop:2}}>{last.wellbeing==='yes'?'Wellbeing ปกติ':'⚠ Wellbeing ผิดปกติ'}</div>
                </div>
                <div className="spark-tile">
                  <div className="lbl">Distress</div>
                  <div className="v" style={{fontSize:13,color:(last.rd&&last.rd.length)?'var(--red)':'var(--teal)'}}>
                    {(last.rd&&last.rd.length)?last.rd.join(', '):'ไม่มี'}
                  </div>
                  <div style={{fontSize:10,color:'var(--text-3)',marginTop:2}}>BP {last.BP||'—'}</div>
                </div>
              </div>
            ) : (
              <div className="muted center" style={{padding:24}}>ยังไม่มีข้อมูล vital signs</div>
            )}
          </div>

          {/* ABX Timer banner */}
          {abxStartedAt && (
            <div className={`banner ${abxRemainingHr <= 6 ? 'red' : 'amber'} mb-12`}>
              <Icon name="abx"/>
              <div style={{flex:1}}>
                <div className="title">ABX Duration Timer — {abxElapsedHr.toFixed(1)} hr ที่ผ่านมา</div>
                <div style={{marginTop:4}}>
                  {abxRemainingHr > 0
                    ? <>Recommended stop ใน <strong>{abxRemainingHr.toFixed(1)} hr</strong> (48 hr empirical course)</>
                    : <strong>⚠️ ครบ 48 hr — พิจารณา de-escalate หรือ stop ABX</strong>
                  }
                </div>
              </div>
            </div>
          )}

          {/* Re-culture prompt */}
          {needReCulture && (
            <div className="banner amber mb-12">
              <Icon name="warn"/>
              <div style={{flex:1}}>
                <div className="title">Re-culture Check — ABX ≥ 36 hr</div>
                <div style={{marginTop:4}}>ยังไม่มีผล blood culture — กรุณาบันทึกผลใน Serial PE ถัดไป</div>
              </div>
            </div>
          )}

          {/* Risk Trend Chart */}
          <RiskTrendChart patient={p} vitals={vitals} birthRisk={intakeCalc}/>

          <div className="card">
            <div className="card-head">
              <span className="card-title">Serial PE Timeline</span>
              {!p.archived && (
                <button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>onAddPE(p)}>
                  <Icon name="plus"/>บันทึก {st.tp||'44 hr'}
                </button>
              )}
            </div>
            <div className="timeline">
              {TIMEPOINTS.map(tp => {
                const rec = all.find(v=>v.ageHr===tp);
                const issues = rec ? evalVitals(rec) : [];
                const hasRed = issues.some(i=>i.sev==='red');
                const cls = rec ? (hasRed?'alert':'done') : tp===st.tp?'due':'';
                const dueAt = tpDueAt(p, tp);
                const isABX = EOS.ABX_TPS.has(tp);
                return (
                  <div key={tp} className={`timeline-row ${cls}`}>
                    <div className="age">
                      {tp}
                      {isABX && <span className="badge badge-navy" style={{fontSize:9,padding:'1px 5px',marginTop:3,display:'inline-block'}}>ABX TO</span>}
                    </div>
                    <div className="body">
                      <div className="ts">
                        {rec ? fmtDateTime(rec.ts) : `กำหนด: ${fmtDateTime(dueAt.toISOString())}`}
                        {rec?.staff && <> · {rec.staff}</>}
                        {rec?.abxApproved && <> · <span style={{color:'var(--green)',fontWeight:600}}>ABX: {rec.abxDecision==='stop'?'หยุดแล้ว':'ต่อแล้ว'}</span></>}
                      </div>
                      {rec ? (
                        <>
                          <div className="summary">{issues.length===0?'ตรวจร่างกายปกติ':hasRed?'⚠ พบความผิดปกติ':'ค่าผิดปกติเล็กน้อย'}</div>
                          <div className="vitals-row">
                            {[['T',rec.T,'T'],['HR',rec.P,'P'],['RR',rec.R,'R'],['SpO₂',rec.SpO2,'SpO2']].map(([label,val,key])=>(
                              <span key={label} className={`v${vitalFlag(key,val)?' flag':''}`}><span className="k">{label}</span><span className="n">{val??'—'}</span></span>
                            ))}
                            <span className="v"><span className="k">Skin</span><span className="n">{rec.skin}</span></span>
                          </div>
                          {issues.length>0 && (
                            <div className="issues">
                              {issues.map((iss,idx)=><span key={idx} className={`badge badge-${iss.sev==='red'?'red':'amber'}`}>{iss.k}: {iss.txt}</span>)}
                            </div>
                          )}
                          {rec.management && <div style={{fontSize:11,color:'var(--text-2)',marginTop:4}}>Plan: {rec.management}</div>}
                          {/* Lab results inline */}
                          {(rec.crp||rec.wbc||rec.anc||rec.cultureStatus==='pending'||rec.cultureStatus==='negative'||rec.cultureStatus==='positive') && (
                            <div style={{display:'flex',gap:10,marginTop:6,flexWrap:'wrap',fontSize:11}}>
                              {rec.crp!=null&&<span className={`badge badge-${+rec.crp>=10?'red':'grey'}`}>CRP {rec.crp} mg/L</span>}
                              {rec.wbc!=null&&<span className={`badge badge-${(+rec.wbc<5000||+rec.wbc>30000)?'amber':'grey'}`}>WBC {(+rec.wbc).toLocaleString()}</span>}
                              {rec.anc!=null&&<span className={`badge badge-${+rec.anc<1000?'red':'grey'}`}>ANC {(+rec.anc).toLocaleString()}</span>}
                              {rec.itRatio!=null&&<span className={`badge badge-${+rec.itRatio>=0.2?'red':'grey'}`}>I:T {rec.itRatio}</span>}
                              {rec.cultureStatus&&rec.cultureStatus!=='not_sent'&&<span className={`badge badge-${rec.cultureStatus==='positive'?'red':rec.cultureStatus==='negative'?'green':'amber'}`}>Culture: {rec.cultureStatus}</span>}
                            </div>
                          )}
                        </>
                      ) : tp===st.tp ? (
                        <div className="summary muted">▸ ถัดไป — <button className="btn btn-primary btn-xs" onClick={()=>onAddPE(p)} style={{marginLeft:6}}>บันทึกเดี๋ยวนี้</button></div>
                      ) : (
                        <div className="summary muted" style={{fontStyle:'italic'}}>รอการตรวจ</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PatientList({ patients, vitals, onOpenPatient }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('active');
  const filtered = patients.filter(p => {
    if (filter==='active' && p.archived) return false;
    if (filter==='done' && !p.archived) return false;
    if (q && !(p.name+p.hn+(p.bed||'')).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  return (
    <div className="panel">
      <div className="page-head">
        <div><h1>Patients</h1><div className="sub">รายชื่อทารกในการเฝ้าระวัง EOS ({patients.length} ราย)</div></div>
        <div className="right">
          <div className="seg">
            {[['all','ทั้งหมด'],['active','กำลังเฝ้าระวัง'],['done','เสร็จสิ้น']].map(([k,l])=>(
              <button key={k} className={filter===k?'active':''} onClick={()=>setFilter(k)}>{l}</button>
            ))}
          </div>
          <div style={{position:'relative'}}>
            <Icon name="search" size={16} style={{position:'absolute',left:10,top:9,color:'var(--text-3)'}}/>
            <input className="input" style={{paddingLeft:32,width:200,height:36}} placeholder="HN / ชื่อ" value={q} onChange={e=>setQ(e.target.value)}/>
          </div>
        </div>
      </div>
      <div className="card" style={{padding:0,overflow:'auto'}}>
        <table className="eos">
          <thead><tr><th>สถานะ</th><th>ชื่อ / มารดา</th><th>HN</th><th>เตียง</th><th>GA</th><th>BW</th><th>อายุ</th><th>EOS Risk</th><th>ถัดไป / สถานะ</th><th></th></tr></thead>
          <tbody>
            {filtered.map(p => {
              const st = tpStatus(p, vitals);
              const cal = calcEOSRisk({ga:p.ga,romHours:p.intake?.rom||0,maternalTemp:p.intake?.fever||37,gbsStatus:p.intake?.gbs||'unk',iapStatus:p.intake?.iap||'none'});
              const cat = riskCategory(cal);
              return (
                <tr key={p.hn} onClick={()=>onOpenPatient(p.hn)} style={{cursor:'pointer'}}>
                  <td><StatusDot patient={p} vitals={vitals}/></td>
                  <td><div style={{fontWeight:600}}>{p.name}</div><div className="muted" style={{fontSize:11}}>{p.motherName}</div></td>
                  <td className="mono">{p.hn}</td>
                  <td>{p.bed||'—'}</td>
                  <td className="mono">{p.ga} wk</td>
                  <td className="mono">{p.bw} g</td>
                  <td className="mono">{ageHours(p)} hr</td>
                  <td><span className={`badge badge-${cat.badge}`}>{cal.toFixed(2)} · {cat.en}</span></td>
                  <td style={{color:st.cat==='overdue'?'var(--red)':st.cat==='soon'?'var(--amber)':'inherit',fontWeight:st.cat==='overdue'||st.cat==='soon'?600:400,fontSize:12}}>{st.label}</td>
                  <td><button className="btn btn-ghost btn-xs">เปิด →</button></td>
                </tr>
              );
            })}
            {filtered.length===0&&<tr><td colSpan={10} style={{textAlign:'center',padding:32,color:'var(--text-3)'}}>ไม่พบรายการ</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}
